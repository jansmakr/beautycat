<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - BeautyCat | 피부관리실 견적비교 플랫폼</title>
    <!-- v2.8.13.6.69: UI 개선 (로딩 + 에러 처리) -->
    
    <!-- SEO 메타태그 -->
    <meta name="description" content="BeautyCat 로그인 페이지. 고객, 피부관리실, 관리자 계정으로 로그인하여 맞춤형 피부관리 서비스를 이용하세요.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://beautycat.kr/login.html">
    
    <!-- 🚨 CRITICAL FIX: 최우선 실행 -->
    <script src="sw-unregister.js"></script>
    <script src="api-global-override.js"></script>
    <script src="js/dev-environment-handler.js"></script>
    
    <!-- 소셜 로그인 SDK -->
    <script type="text/javascript" src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/tailwind-production.css">
    <link rel="stylesheet" href="css/mobile-optimized.css?v=2.1.0">
    <link rel="stylesheet" href="css/fast-transitions.css?v=2.4.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* 로고 스타일 */
        /* 로고 호버 애니메이션 */
        .logo-container:hover img {
            transform: scale(1.05);
            transition: transform 0.2s ease;
            filter: brightness(1.1);
        }

        /* 카드 스타일 */
        .card-soft {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
            backdrop-filter: blur(10px);
        }
        
        /* 버튼 스타일 */
        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #db2777, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }

        /* 입력 필드 스타일 */
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f3f4f6;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        /* 사용자 유형 버튼 */
        .user-type-btn {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .user-type-btn:hover {
            border-color: #ec4899;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }
        
        .user-type-btn.selected {
            border-color: #ec4899;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
        }

        /* 소셜 로그인 버튼 */
        .social-btn {
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .naver-btn {
            background: #03C75A;
            color: white;
        }

        .naver-btn:hover {
            background: #02b350;
        }

        .kakao-btn {
            background: #FEE500;
            color: #000000;
        }

        .kakao-btn:hover {
            background: #fdd835;
        }

        /* 네이버 버튼 비활성화 스타일 */
        .naver-btn-disabled {
            position: relative;
            opacity: 0.6;
            cursor: not-allowed !important;
        }

        .naver-btn-disabled::after {
            content: '준비중';
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .naver-btn-disabled::before {
            content: '';
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(0, 0, 0, 0.85);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .naver-btn-disabled:hover::after,
        .naver-btn-disabled:hover::before {
            opacity: 1;
        }

        .naver-btn-disabled:hover {
            background: #03C75A !important;
            transform: translateY(0) !important;
            box-shadow: 0 4px 12px rgba(3, 199, 90, 0.2) !important;
        }

        /* 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        /* 로딩 스피너 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 에러 메시지 */
        .error-message {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            animation: shake 0.5s ease-in-out;
        }

        .error-message.active {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* 모바일 최적화 */
        @media (max-width: 640px) {
            .logo-container img {
                height: 40px !important;
            }

            .card-soft {
                border-radius: 20px;
                padding: 24px !important;
            }

            .input-field {
                font-size: 16px;
                padding: 12px 14px;
            }

            .user-type-btn {
                padding: 16px;
            }

            h2 {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="py-6 px-4">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <a href="index.html" class="logo-container" style="display: flex; align-items: center; text-decoration: none;">
                <img src="https://www.genspark.ai/api/files/s/bvA3zk1x" alt="Beautyket" style="height: 50px; width: auto;">
            </a>
            <a href="index.html" class="text-gray-600 hover:text-primary-500 transition-colors">
                <i class="fas fa-home mr-1"></i>홈으로
            </a>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-lg mx-auto px-4 pb-12">
        <div class="card-soft p-8 animate-fade-in-up">
            <!-- 제목 -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">로그인</h2>
                <p class="text-gray-600">피부관리의 새로운 시작</p>
            </div>

            <!-- 사용자 유형 선택 -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    <i class="fas fa-user-circle mr-1 text-primary-500"></i>
                    로그인 유형
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" 
                            class="user-type-btn selected" 
                            data-type="customer"
                            onclick="selectUserType('customer', this)">
                        <div class="text-center">
                            <i class="fas fa-user text-3xl mb-2" style="color: #ec4899;"></i>
                            <div class="font-semibold text-gray-900">고객</div>
                            <div class="text-xs text-gray-500 mt-1">일반 사용자</div>
                        </div>
                    </button>
                    <button type="button" 
                            class="user-type-btn" 
                            data-type="shop"
                            onclick="selectUserType('shop', this)">
                        <div class="text-center">
                            <i class="fas fa-store text-3xl mb-2" style="color: #a855f7;"></i>
                            <div class="font-semibold text-gray-900">피부관리실</div>
                            <div class="text-xs text-gray-500 mt-1">업체 회원</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText"></span>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm" class="space-y-4 mb-6">
                <input type="hidden" id="userType" value="customer">
                
                <!-- 이메일 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-1 text-primary-500"></i>
                        이메일
                    </label>
                    <input type="email" 
                           id="loginEmail" 
                           class="input-field" 
                           placeholder="example@beautycat.kr" 
                           required>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-lock mr-1 text-primary-500"></i>
                        비밀번호
                    </label>
                    <input type="password" 
                           id="loginPassword" 
                           class="input-field" 
                           placeholder="비밀번호를 입력하세요" 
                           required>
                </div>

                <!-- 로그인 버튼 -->
                <button type="submit" 
                        id="loginBtn"
                        class="btn-primary w-full py-4 text-lg font-bold rounded-xl">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    로그인
                </button>
            </form>

            <!-- 소셜 로그인 -->
            <div class="mb-6">
                <div class="relative mb-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500 font-medium">또는 소셜 로그인</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button type="button" 
                            onclick="event.preventDefault(); return false;" 
                            class="social-btn naver-btn naver-btn-disabled"
                            title="준비중">
                        <i class="fas fa-n mr-2"></i>
                        네이버
                    </button>
                    <button type="button" 
                            id="kakaoLoginBtn"
                            onclick="loginWithKakao()" 
                            class="social-btn kakao-btn">
                        <i class="fas fa-comment mr-2"></i>
                        카카오
                    </button>
                </div>
            </div>

            <!-- 링크 -->
            <div class="text-center space-y-2">
                <div>
                    <span class="text-gray-600">계정이 없으신가요?</span>
                    <a href="register.html" class="text-primary-500 font-semibold hover:underline ml-2">
                        회원가입
                    </a>
                </div>
                <div>
                    <a href="#" onclick="alert('비밀번호 찾기 기능 준비중입니다.'); return false;" 
                       class="text-sm text-gray-500 hover:text-primary-500">
                        비밀번호를 잊으셨나요?
                    </a>
                </div>
            </div>

            <!-- 관리자 로그인 -->
            <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                <button type="button" 
                        onclick="selectUserType('admin', null)" 
                        class="text-sm text-gray-500 hover:text-gray-700">
                    <i class="fas fa-shield-alt mr-1"></i>
                    관리자 로그인
                </button>
            </div>
        </div>

        <!-- 하단 텍스트 -->
        <div class="text-center mt-8 text-sm text-gray-500">
            <p>로그인하시면 <a href="legal/terms.html" class="text-primary-500 hover:underline">이용약관</a> 및</p>
            <p><a href="legal/privacy.html" class="text-primary-500 hover:underline">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.</p>
        </div>
    </main>

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="bg-white rounded-lg p-6 text-center">
            <div class="spinner mx-auto mb-4"></div>
            <p class="text-gray-700 font-medium">로그인 중...</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/config.js?v=2.5.4"></script>
    <script src="js/auth.js?v=2.8.13"></script>
    <script src="js/naver-login.js"></script>
    <script src="js/kakao-login.js"></script>

    <script>
        // 사용자 유형 선택
        function selectUserType(type, button) {
            document.getElementById('userType').value = type;
            
            // 모든 버튼에서 selected 클래스 제거
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // 클릭한 버튼에 selected 클래스 추가
            if (button) {
                button.classList.add('selected');
            }

            // 관리자 선택 시 즉시 로그인 폼으로 포커스
            if (type === 'admin') {
                document.getElementById('loginEmail').focus();
            }
        }

        // 에러 메시지 표시 함수 (v2.8.13.6.69)
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('active');
            
            // 5초 후 자동 숨김
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 5000);
        }

        // 로딩 표시 함수
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
            document.getElementById('loginBtn').disabled = true;
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
            document.getElementById('loginBtn').disabled = false;
        }

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const userType = document.getElementById('userType').value;
            
            if (!email || !password) {
                showError('이메일과 비밀번호를 모두 입력해주세요.');
                return;
            }
            
            showLoading();
            
            try {
                // 로그인 함수 호출 (auth.js에서 정의됨)
                await login({
                    email: email,
                    password: password,
                    user_type: userType
                });
            } catch (error) {
                console.error('로그인 오류:', error);
                hideLoading();
                showError('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.');
            }
        });

        // 네이버 로그인
        function loginWithNaver() {
            if (typeof initNaverLogin === 'function') {
                initNaverLogin();
            } else {
                alert('네이버 로그인 기능을 준비 중입니다.');
            }
        }

        // 카카오 로그인
        function loginWithKakao() {
            if (typeof startKakaoLogin === 'function') {
                showLoading();
                try {
                    startKakaoLogin();
                } catch (error) {
                    hideLoading();
                    showError('카카오 로그인 중 오류가 발생했습니다.');
                }
            } else {
                showError('카카오 로그인 기능을 준비 중입니다.');
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            // 이미 로그인된 경우 리다이렉트
            const currentUser = localStorage.getItem('user_data');
            if (currentUser) {
                const userData = JSON.parse(currentUser);
                const userType = userData.user_type || 'customer';
                
                if (userType === 'customer') {
                    window.location.href = 'customer-dashboard.html';
                } else if (userType === 'shop') {
                    window.location.href = 'shop-dashboard.html';
                } else if (userType === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
