<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피부관리실 정보 등록 - beautycat</title>
    
    <!-- 🚨 CRITICAL FIX: 최우선 실행 -->
    <script src="sw-unregister.js"></script>
    <script src="api-global-override.js?v=2.7.3.3"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        input, textarea, select {
            appearance: none;
            -webkit-appearance: none;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff2d92;
            box-shadow: 0 0 0 3px rgba(255, 45, 146, 0.1);
        }
        
        /* 모바일 최적화 */
        @media (max-width: 640px) {
            input, textarea, select, button {
                font-size: 16px;
                min-height: 52px;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center">
                <img src="images/beautycat-logo.png" alt="BeautyCat" style="height: 40px; width: auto;">
            </a>
            <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-900">
                <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 안내 메시지 -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-3">
                <i class="fas fa-store text-pink-500 mr-3"></i>피부관리실 정보 등록
            </h1>
            <p class="text-gray-600 mb-4">
                고객에게 견적을 받으려면 피부관리실 정보를 등록해주세요. 
                <span class="text-pink-600 font-medium">등록 완료 후 상담 요청을 받을 수 있습니다.</span>
            </p>
            
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex items-start">
                    <i class="fas fa-info-circle text-blue-500 mt-1 mr-3"></i>
                    <div class="text-sm text-blue-800">
                        <p class="font-semibold mb-1">📝 등록 후 혜택</p>
                        <ul class="list-disc list-inside space-y-1">
                            <li>우리 지역 고객의 상담 요청을 받을 수 있어요</li>
                            <li>견적서를 보내고 예약을 확정할 수 있어요</li>
                            <li>대표샵으로 신청하여 전화상담 서비스를 제공할 수 있어요</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- 등록 폼 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <form id="shop-register-form" class="p-6 space-y-6">
                
                <!-- 1. 기본 정보 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                        기본 정보
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                피부관리실명 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="shop-name" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 강남 프리미엄 스킨케어">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                대표자명 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="owner-name" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 김미영">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                사업자등록번호 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="business-number" required pattern="[0-9]{3}-[0-9]{2}-[0-9]{5}"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="000-00-00000">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                영업신고증 번호 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="business-license-number" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 제2024-서울강남-0000호">
                        </div>
                    </div>
                </div>

                <!-- 2. 연락처 정보 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center mr-3 text-sm">2</span>
                        연락처 정보
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                전화번호 <span class="text-red-500">*</span>
                            </label>
                            <input type="tel" id="shop-phone" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="02-1234-5678">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                이메일 <span class="text-gray-500 text-xs">(자동입력)</span>
                            </label>
                            <input type="email" id="shop-email" readonly 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 text-gray-600">
                        </div>
                    </div>
                </div>

                <!-- 3. 위치 정보 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center mr-3 text-sm">3</span>
                        위치 정보
                    </h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    시/도 <span class="text-red-500">*</span>
                                </label>
                                <select id="shop-state" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500">
                                    <option value="">시/도를 선택해주세요</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    구/군 <span class="text-red-500">*</span>
                                </label>
                                <select id="shop-district" required disabled
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500 disabled:bg-gray-100">
                                    <option value="">먼저 시/도를 선택해주세요</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                상세 주소 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="shop-address" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="동/읍/면, 도로명/지번, 건물명, 층수 등">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                영업시간 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="business-hours" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 월-금 09:00-18:00, 토 09:00-15:00">
                        </div>
                    </div>
                </div>

                <!-- 4. 샵 소개 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center mr-3 text-sm">4</span>
                        샵 소개
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                대표 관리 <span class="text-red-500">*</span>
                                <span class="text-xs text-gray-500">(고객에게 노출)</span>
                            </label>
                            <input type="text" id="representative-service" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 여드름 집중 관리">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                1회 관리 가격 <span class="text-red-500">*</span>
                                <span class="text-xs text-gray-500">(고객에게 노출)</span>
                            </label>
                            <input type="text" id="service-price" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 150,000원">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                관리용 화장품 (브랜드)
                            </label>
                            <input type="text" id="cosmetic-brands"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 닥터자르트, 아이오페">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                주요 피부미용기기
                            </label>
                            <input type="text" id="beauty-equipment"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 울쎄라, 써마지">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            샵 특징 및 차별 포인트 <span class="text-red-500">*</span>
                        </label>
                        <textarea id="shop-features" rows="3" required
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                  placeholder="우리 샵만의 특별한 장점과 차별화 포인트를 작성해주세요"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                평 수
                            </label>
                            <input type="text" id="shop-size"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 30평">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                베드 수
                            </label>
                            <input type="text" id="bed-count"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 5대">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                직원 수
                            </label>
                            <input type="text" id="staff-count"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                   placeholder="예: 7명">
                        </div>
                    </div>
                </div>

                <!-- 5. 원장 소개 (선택) -->
                <div class="pb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-gray-400 text-white rounded-full flex items-center justify-center mr-3 text-sm">5</span>
                        원장 소개 <span class="text-sm text-gray-500 ml-2">(선택사항)</span>
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                주요 프로필
                            </label>
                            <textarea id="director-profile" rows="3"
                                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                      placeholder="원장님의 학력, 자격증, 전문 분야 등을 작성해주세요"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                주요 경력
                            </label>
                            <textarea id="director-experience" rows="3"
                                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                                      placeholder="주요 경력 사항과 근무 이력을 작성해주세요"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="pt-6 border-t border-gray-200">
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white py-4 px-6 rounded-lg font-semibold text-lg transition-all shadow-lg hover:shadow-xl">
                        <i class="fas fa-check-circle mr-2"></i>
                        피부관리실 등록 완료
                    </button>
                    <p class="text-center text-sm text-gray-500 mt-3">
                        등록 후 바로 고객 상담 요청을 받을 수 있어요
                    </p>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/regional-matching.js"></script>
    <script src="js/auth.js"></script>
    <script>
        console.log('🏪 샵 등록 페이지 초기화');
        
        // 사용자 정보 로드
        async function loadUserInfo() {
            const userData = localStorage.getItem('userData');
            if (!userData) {
                alert('로그인이 필요합니다.');
                window.location.href = 'login.html';
                return;
            }
            
            const user = JSON.parse(userData);
            
            // 이메일 자동 입력
            document.getElementById('shop-email').value = user.email || '';
            
            // 샵 회원이 아니면 접근 불가
            if (user.user_type !== 'shop') {
                alert('피부관리실 회원만 접근 가능합니다.');
                window.location.href = 'index.html';
                return;
            }
            
            console.log('✅ 사용자 정보 로드 완료:', user);
        }
        
        // 지역 선택 드롭다운 초기화 (regional-matching.js가 자동 처리)
        function initializeRegionDropdowns() {
            console.log('✅ 지역 드롭다운 초기화 (regional-matching.js 사용)');
            // regional-matching.js가 자동으로 shop-state, shop-district 처리
        }
        
        // 폼 제출 처리
        document.getElementById('shop-register-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            // 필수 필드 검증
            const requiredFields = [
                'shop-name', 'owner-name', 'business-number', 'business-license-number',
                'shop-phone', 'shop-state', 'shop-district', 'shop-address', 
                'business-hours', 'representative-service', 'service-price', 'shop-features'
            ];
            
            for (const fieldId of requiredFields) {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    alert('모든 필수 항목을 입력해주세요.');
                    field.focus();
                    return;
                }
            }
            
            // 사업자등록번호 유효성 검사
            const businessNumber = document.getElementById('business-number').value;
            if (!/^\d{3}-\d{2}-\d{5}$/.test(businessNumber)) {
                alert('사업자등록번호는 000-00-00000 형식으로 입력해주세요.');
                document.getElementById('business-number').focus();
                return;
            }
            
            // 데이터 수집
            const shopData = {
                name: document.getElementById('shop-name').value.trim(),
                owner_name: document.getElementById('owner-name').value.trim(),
                business_number: businessNumber,
                business_license_number: document.getElementById('business-license-number').value.trim(),
                phone: document.getElementById('shop-phone').value.trim(),
                email: document.getElementById('shop-email').value.trim(),
                state: document.getElementById('shop-state').value,
                district: document.getElementById('shop-district').value,
                address: document.getElementById('shop-address').value.trim(),
                business_hours: document.getElementById('business-hours').value.trim(),
                representative_service: document.getElementById('representative-service').value.trim(),
                service_price: document.getElementById('service-price').value.trim(),
                cosmetic_brands: document.getElementById('cosmetic-brands').value.trim() || null,
                beauty_equipment: document.getElementById('beauty-equipment').value.trim() || null,
                shop_features: document.getElementById('shop-features').value.trim(),
                shop_size: document.getElementById('shop-size').value.trim() || null,
                bed_count: document.getElementById('bed-count').value.trim() || null,
                staff_count: document.getElementById('staff-count').value.trim() || null,
                director_profile: document.getElementById('director-profile').value.trim() || null,
                director_experience: document.getElementById('director-experience').value.trim() || null,
                user_id: JSON.parse(localStorage.getItem('userData')).id,
                status: 'active',
                created_at: new Date().toISOString()
            };
            
            console.log('📤 샵 등록 요청:', shopData);
            
            try {
                // API 요청
                const response = await fetch('tables/skincare_shops', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(shopData)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ API 에러:', errorText);
                    throw new Error(`등록 실패: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('✅ 샵 등록 성공:', result);
                
                alert('🎉 피부관리실 정보가 성공적으로 등록되었습니다!\n\n이제 고객의 상담 요청을 받을 수 있습니다.');
                window.location.href = 'shop-dashboard.html';
                
            } catch (error) {
                console.error('❌ 등록 오류:', error);
                alert('등록 중 오류가 발생했습니다.\n다시 시도해주세요.\n\n오류: ' + error.message);
            }
        });
        
        // 로그아웃
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('userData');
                window.location.href = 'login.html';
            }
        }
        
        // 페이지 로드 시 초기화
        window.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            initializeRegionDropdowns();
        });
    </script>
</body>
</html>
