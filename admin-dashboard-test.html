<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 테스트 - 뽀샵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
        }
        .test-pass { border-color: #10b981; background-color: #f0fdf4; }
        .test-fail { border-color: #ef4444; background-color: #fef2f2; }
        .test-info { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">
                <i class="fas fa-cogs text-blue-600 mr-2"></i>
                관리자 대시보드 네이버 카페 ID 기능 테스트
            </h1>
            
            <div id="test-results"></div>
            
            <!-- 네이버 카페 ID 표시 테스트 테이블 -->
            <div class="test-section test-info" id="cafe-id-test">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-table mr-2"></i>
                    네이버 카페 ID 표시 테스트
                </h3>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">업체명</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">지역</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">네이버 카페 ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">가입일</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작업</th>
                            </tr>
                        </thead>
                        <tbody id="test-shops-table" class="bg-white divide-y divide-gray-200">
                            <!-- 테스트 데이터가 여기에 들어갑니다 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 기능 테스트 버튼들 -->
            <div class="test-section" id="function-tests">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-play-circle mr-2"></i>
                    기능 테스트
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <button onclick="testCafeIdFunction('testuser123')" 
                            class="p-3 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors">
                        <i class="fas fa-external-link-alt mr-2"></i>
                        네이버 카페 확인 테스트
                    </button>
                    
                    <button onclick="testApprovalFunction('shop_001')" 
                            class="p-3 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors">
                        <i class="fas fa-check-circle mr-2"></i>
                        업체 승인 테스트
                    </button>
                    
                    <button onclick="runAllTests()" 
                            class="p-3 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition-colors">
                        <i class="fas fa-rocket mr-2"></i>
                        전체 테스트 실행
                    </button>
                </div>
            </div>

            <!-- 실제 관리자 대시보드로 이동 -->
            <div class="mt-8 text-center">
                <a href="admin-dashboard.html" 
                   class="inline-flex items-center px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                    <i class="fas fa-tachometer-alt mr-2"></i>
                    실제 관리자 대시보드로 이동
                </a>
            </div>
        </div>
    </div>

    <!-- 알림 표시 영역 -->
    <div id="notification-area"></div>

    <script>
        // 테스트 데이터
        const testShops = [
            {
                id: 'shop_001',
                shop_name: '강남 뷰티클리닉',
                owner_name: '김미영',
                region: '서울특별시 강남구',
                naver_cafe_id: 'beautykim123',
                created_at: '2024-09-25T10:00:00Z',
                status: 'pending'
            },
            {
                id: 'shop_002', 
                shop_name: '홍대 스킨케어',
                owner_name: '박지은',
                region: '서울특별시 마포구',
                naver_cafe_id: 'skincare_park',
                created_at: '2024-09-26T14:30:00Z',
                status: 'active'
            },
            {
                id: 'shop_003',
                shop_name: '분당 피부관리실',
                owner_name: '이수진',
                region: '경기도 성남시',
                naver_cafe_id: null, // 네이버 카페 ID 미입력
                created_at: '2024-09-27T09:15:00Z', 
                status: 'pending'
            }
        ];

        // 페이지 로드시 테스트 테이블 렌더링
        document.addEventListener('DOMContentLoaded', function() {
            renderTestShopsTable();
            logTest('관리자 대시보드 네이버 카페 ID 기능 테스트 시작', 'info');
        });

        // 테스트 상점 테이블 렌더링
        function renderTestShopsTable() {
            const tableBody = document.getElementById('test-shops-table');
            
            tableBody.innerHTML = testShops.map(shop => {
                const statusColors = {
                    'active': 'text-green-600 bg-green-100',
                    'pending': 'text-yellow-600 bg-yellow-100',
                    'inactive': 'text-red-600 bg-red-100'
                };
                
                const statusLabels = {
                    'active': '활성',
                    'pending': '승인대기',
                    'inactive': '비활성'
                };
                
                return `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${shop.shop_name}</div>
                            <div class="text-sm text-gray-500">${shop.owner_name}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${shop.region}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${shop.naver_cafe_id || '-'}</div>
                            ${shop.naver_cafe_id ? `<div class="text-xs text-blue-600">
                                <a href="https://cafe.naver.com/cosmetickr" target="_blank" class="hover:underline">
                                    <i class="fas fa-external-link-alt mr-1"></i>카페 확인
                                </a>
                            </div>` : '<div class="text-xs text-gray-400">미입력</div>'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${formatDate(shop.created_at)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColors[shop.status]}">
                                ${statusLabels[shop.status]}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button onclick="testViewShop('${shop.id}')" class="text-indigo-600 hover:text-indigo-900 mr-2">
                                보기
                            </button>
                            <button onclick="testApprovalFunction('${shop.id}')" class="text-green-600 hover:text-green-900 mr-2">
                                승인
                            </button>
                            ${shop.naver_cafe_id ? `
                                <button onclick="testCafeIdFunction('${shop.naver_cafe_id}')" class="text-blue-600 hover:text-blue-900">
                                    카페 확인
                                </button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 네이버 카페 ID 확인 기능 테스트
        function testCafeIdFunction(cafeId) {
            logTest(`네이버 카페 ID 확인 테스트: ${cafeId}`, 'info');
            
            if (!cafeId) {
                showNotification('네이버 카페 ID가 없습니다.', 'warning');
                logTest('❌ 네이버 카페 ID 확인 실패: ID가 없음', 'fail');
                return;
            }
            
            // 새 창에서 네이버 카페 페이지 열기
            const cafeUrl = `https://cafe.naver.com/cosmetickr`;
            const verificationWindow = window.open(cafeUrl, '_blank');
            
            if (verificationWindow) {
                showNotification(`네이버 카페에서 "${cafeId}" 회원을 확인하세요.`, 'success');
                logTest(`✅ 네이버 카페 확인 성공: ${cafeId}`, 'pass');
            } else {
                showNotification('팝업이 차단되었습니다. 브라우저 설정을 확인하세요.', 'warning');
                logTest('❌ 팝업 차단으로 인한 실패', 'fail');
            }
        }

        // 업체 승인 기능 테스트
        function testApprovalFunction(shopId) {
            logTest(`업체 승인 테스트: ${shopId}`, 'info');
            
            const shop = testShops.find(s => s.id === shopId);
            if (!shop) {
                showNotification('업체를 찾을 수 없습니다.', 'error');
                logTest('❌ 업체 승인 실패: 업체를 찾을 수 없음', 'fail');
                return;
            }
            
            // 테스트 환경에서는 실제 API 호출 대신 시뮬레이션
            setTimeout(() => {
                shop.status = 'active';
                renderTestShopsTable();
                showNotification(`${shop.shop_name}이(가) 승인되었습니다.`, 'success');
                logTest(`✅ 업체 승인 성공: ${shop.shop_name}`, 'pass');
            }, 1000);
            
            showNotification('승인 처리 중...', 'info');
        }

        // 상점 상세보기 테스트
        function testViewShop(shopId) {
            const shop = testShops.find(s => s.id === shopId);
            if (shop) {
                showNotification(`${shop.shop_name} 상세 정보를 표시합니다.`, 'info');
                logTest(`✅ 상점 상세보기 테스트 성공: ${shop.shop_name}`, 'pass');
            } else {
                logTest('❌ 상점 상세보기 테스트 실패', 'fail');
            }
        }

        // 전체 테스트 실행
        function runAllTests() {
            logTest('=== 전체 테스트 시작 ===', 'info');
            
            // 1. 네이버 카페 ID가 있는 업체 테스트
            setTimeout(() => testCafeIdFunction('beautykim123'), 500);
            
            // 2. 네이버 카페 ID가 없는 업체 테스트
            setTimeout(() => testCafeIdFunction(null), 1000);
            
            // 3. 업체 승인 테스트
            setTimeout(() => testApprovalFunction('shop_003'), 1500);
            
            // 4. 테스트 완료 메시지
            setTimeout(() => {
                logTest('=== 전체 테스트 완료 ===', 'info');
                showNotification('전체 테스트가 완료되었습니다.', 'success');
            }, 2500);
        }

        // 테스트 로그 출력
        function logTest(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const timestamp = new Date().toLocaleTimeString();
            
            const colors = {
                'pass': 'text-green-600',
                'fail': 'text-red-600', 
                'info': 'text-blue-600',
                'warning': 'text-yellow-600'
            };
            
            const icons = {
                'pass': 'fas fa-check-circle',
                'fail': 'fas fa-times-circle',
                'info': 'fas fa-info-circle',
                'warning': 'fas fa-exclamation-triangle'
            };
            
            const logEntry = document.createElement('div');
            logEntry.className = `flex items-center space-x-2 p-2 rounded ${colors[type]}`;
            logEntry.innerHTML = `
                <i class="${icons[type]}"></i>
                <span class="text-xs text-gray-500">[${timestamp}]</span>
                <span>${message}</span>
            `;
            
            resultsDiv.appendChild(logEntry);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        // 알림 표시 함수
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 p-4 rounded-md shadow-lg max-w-sm transform transition-all duration-300 ${
                type === 'success' ? 'bg-green-100 text-green-700 border border-green-300' :
                type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' :
                type === 'warning' ? 'bg-yellow-100 text-yellow-700 border border-yellow-300' :
                'bg-blue-100 text-blue-700 border border-blue-300'
            }`;
            
            notification.innerHTML = `
                <div class="flex items-center justify-between">
                    <span>${message}</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-3 text-lg leading-none hover:text-gray-600">×</button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 자동 제거
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 4000);
        }

        // 날짜 포맷 함수
        function formatDate(dateString) {
            if (!dateString) return '-';
            
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
    </script>
</body>
</html>
