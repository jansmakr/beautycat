<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyCat - Service Worker 없는 안전 모드</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff2d92, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        button {
            background: #ff2d92;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #e6267d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 BeautyCat</h1>
        <h2>Service Worker 안전 모드</h2>
        
        <div class="status">
            <h3>🛡️ 안전 모드 활성화</h3>
            <p>✅ Service Worker 완전 비활성화</p>
            <p>✅ 리다이렉트 오류 방지</p>
            <p>✅ 모든 기능 정상 작동</p>
            <p>⚡ 빠른 로딩 속도</p>
        </div>
        
        <button onclick="goToMain()">🏠 메인 페이지로 이동</button>
        <button onclick="clearAll()">🧹 모든 데이터 정리</button>
        
        <div class="status">
            <h4>📋 현재 상태:</h4>
            <div id="statusInfo">확인 중...</div>
        </div>
    </div>

    <script>
        async function goToMain() {
            // Service Worker 완전 비활성화 확인 후 이동
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                if (registrations.length > 0) {
                    alert('⚠️ Service Worker가 아직 남아있습니다. 먼저 "모든 데이터 정리"를 실행해주세요.');
                    return;
                }
            }
            
            window.location.href = './index.html?safe_mode=1&t=' + Date.now();
        }
        
        async function clearAll() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '정리 중...';
            
            try {
                // Service Worker 제거
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }
                
                // 캐시 제거
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                    }
                }
                
                // 스토리지 정리
                localStorage.clear();
                sessionStorage.clear();
                
                alert('✅ 모든 데이터가 정리되었습니다!');
                location.reload();
                
            } catch (error) {
                alert('❌ 정리 중 오류: ' + error.message);
                btn.disabled = false;
                btn.textContent = '🧹 모든 데이터 정리';
            }
        }
        
        // 상태 확인
        window.addEventListener('load', async () => {
            const statusDiv = document.getElementById('statusInfo');
            let status = [];
            
            // Service Worker 확인
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                status.push(`Service Worker: ${registrations.length}개`);
            } else {
                status.push('Service Worker: 미지원');
            }
            
            // 캐시 확인
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                status.push(`캐시: ${cacheNames.length}개`);
            } else {
                status.push('캐시: 미지원');
            }
            
            // URL 정보
            status.push(`도메인: ${location.hostname}`);
            status.push(`프로토콜: ${location.protocol}`);
            
            statusDiv.innerHTML = status.map(s => `<div>• ${s}</div>`).join('');
        });
        
        console.clear();
        console.log('🛡️ BeautyCat 안전 모드 - Service Worker 완전 비활성화');
    </script>
</body>
</html>
