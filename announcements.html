<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - beautycat</title>
    
    <script src="sw-unregister.js"></script>
    <script src="api-global-override.js?v=2.7.3.4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#fff0f8',
                            100: '#ffe3f2',
                            500: '#ff2d92',
                            600: '#e6297f',
                            700: '#cc256c',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        /* 한글 줄바꿈 최적화 (v2.8.13.6.59) */
        body, p, h1, h2, h3, h4, h5, h6, span, div {
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        
        /* 헤더 로고 스타일 (v2.8.13.6.59) */
        .beautycat-logo {
            font-size: 42px;
            font-weight: 900;
            color: #FF1493;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        
        .beautycat-logo:hover {
            opacity: 0.8;
        }
        
        /* 모바일 헤더 최적화 */
        @media (max-width: 640px) {
            .beautycat-logo {
                font-size: 32px;
            }
        }
        
        /* 카드 디자인 개선 (v2.8.13.6.59) */
        .announcement-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .announcement-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }
        
        /* 운영진 공지 스타일 */
        .admin-announcement {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFFBF0 100%);
            border-left: 4px solid #FFD700;
        }
        
        /* 업체 소식 스타일 */
        .shop-announcement {
            background: linear-gradient(135deg, #F0FFF4 0%, #F7FFF9 100%);
            border-left: 4px solid #10B981;
        }
        
        /* 모달 애니메이션 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out;
        }
        
        /* 텍스트 라인 제한 */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* 로딩 상태 개선 */
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header (v2.8.13.6.59 - 메인 페이지와 통일) -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-14">
                <a href="index.html" class="beautycat-logo">
                    B
                </a>
                <nav class="flex items-center space-x-4 sm:space-x-6">
                    <a href="index.html" class="text-gray-600 hover:text-primary-500 font-medium text-sm sm:text-base">홈</a>
                    <a href="announcements.html" class="text-primary-500 font-semibold text-sm sm:text-base">공지사항</a>
                    <a href="login.html" class="text-gray-600 hover:text-primary-500 font-medium text-sm sm:text-base">로그인</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content (v2.8.13.6.59) -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <!-- Page Header -->
        <div class="text-center mb-8 sm:mb-12">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-3 sm:mb-4">
                <i class="fas fa-bullhorn text-primary-500 mr-2 sm:mr-3"></i>공지사항
            </h1>
            <p class="text-gray-600 text-base sm:text-lg">BeautyCat의 최신 소식과 업체 이벤트 정보를 확인하세요</p>
        </div>

        <!-- 관리자 공지사항 섹션 (v2.8.13.6.59) -->
        <section class="mb-8 sm:mb-12">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 sm:mb-6 gap-2">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-900">
                    <i class="fas fa-crown text-yellow-500 mr-2"></i>운영진 공지
                </h2>
                <span class="text-xs sm:text-sm text-gray-500">항상 최상단에 고정됩니다</span>
            </div>
            
            <div id="admin-announcements" class="space-y-4">
                <!-- 로딩 상태 -->
                <div class="flex items-center justify-center py-8">
                    <i class="fas fa-spinner fa-spin text-3xl text-primary-500 mr-3"></i>
                    <span class="text-gray-600">공지사항을 불러오는 중...</span>
                </div>
            </div>
        </section>

        <!-- 업체 공지사항 섹션 (v2.8.13.6.59) -->
        <section>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 sm:mb-6 gap-3">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-900">
                    <i class="fas fa-store text-green-500 mr-2"></i>업체 소식
                </h2>
                <div class="flex items-center gap-3">
                    <select id="region-filter" onchange="filterShopAnnouncements()"
                            class="px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500">
                        <option value="">전체 지역</option>
                        <option value="서울">서울</option>
                        <option value="경기">경기</option>
                        <option value="부산">부산</option>
                        <option value="대구">대구</option>
                        <option value="인천">인천</option>
                    </select>
                </div>
            </div>
            
            <div id="shop-announcements" class="space-y-4">
                <!-- 로딩 상태 -->
                <div class="flex items-center justify-center py-8">
                    <i class="fas fa-spinner fa-spin text-3xl text-green-500 mr-3"></i>
                    <span class="text-gray-600">업체 소식을 불러오는 중...</span>
                </div>
            </div>
        </section>

        <!-- 빈 상태 -->
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fas fa-inbox text-gray-300 text-6xl mb-4"></i>
            <p class="text-gray-500 text-lg">등록된 공지사항이 없습니다.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center">
                <p class="text-gray-400">&copy; 2024 beautycat. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 상세보기 모달 (v2.8.13.6.59 개선) -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden animate-fadeIn">
            <div class="sticky top-0 bg-gradient-to-r from-pink-50 to-purple-50 border-b border-pink-100 px-4 sm:px-6 py-4 flex justify-between items-center">
                <h2 id="modal-title" class="text-lg sm:text-xl font-bold text-gray-900 pr-4"></h2>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 transition-colors flex-shrink-0">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-4 sm:p-6 overflow-y-auto" style="max-height: calc(90vh - 140px);">
                <div class="flex flex-wrap items-center gap-2 sm:gap-3 mb-4 pb-4 border-b border-gray-200">
                    <span id="modal-badge" class="px-2 sm:px-3 py-1 text-xs sm:text-sm font-semibold rounded-full"></span>
                    <span class="text-xs sm:text-sm text-gray-500">
                        <i class="far fa-calendar mr-1"></i>
                        <span id="modal-date"></span>
                    </span>
                    <span class="text-xs sm:text-sm text-gray-500">
                        <i class="far fa-eye mr-1"></i>
                        \uc870\ud68c <span id="modal-views">0</span>\ud68c
                    </span>
                    <span id="modal-shop-info" class="text-xs sm:text-sm text-gray-600 hidden">
                        <i class="fas fa-store mr-1"></i>
                        <span id="modal-shop-name"></span> (<span id="modal-location"></span>)
                    </span>
                </div>
                
                <div id="modal-content" class="prose prose-sm sm:prose max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap"></div>
            </div>
            
            <div class="sticky bottom-0 bg-gray-50 px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center border-t border-gray-200">
                <!-- 삭제 버튼 (관리자만 표시, v2.8.13.6.60) -->
                <button id="delete-announcement-btn" onclick="deleteCurrentAnnouncement()" 
                        class="hidden px-4 sm:px-6 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg hover:from-red-600 hover:to-red-700 transition-all font-medium text-sm sm:text-base shadow-md">
                    <i class="fas fa-trash mr-2"></i>삭제
                </button>
                
                <div class="flex-1"></div>
                
                <button onclick="closeDetailModal()" class="px-4 sm:px-6 py-2 bg-gradient-to-r from-gray-200 to-gray-300 text-gray-700 rounded-lg hover:from-gray-300 hover:to-gray-400 transition-all font-medium text-sm sm:text-base">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/announcements-page.js"></script>
</body>
</html>
