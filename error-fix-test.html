<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀샵 오류 해결 테스트</title>
    <link rel="stylesheet" href="pposhop-styles.css">
</head>
<body class="bg-gray-50">
    <div class="container py-8">
        <div class="max-w-2xl">
            <div class="card">
                <h1 class="text-2xl font-bold text-center mb-6 pposhop-gradient-text">
                    🚀 뽀샵 오류 해결 테스트
                </h1>
                
                <!-- 해결된 문제들 -->
                <div class="space-y-4 mb-8">
                    <div class="flex items-center p-3 bg-green-50 border border-green-200 rounded-lg">
                        <span class="text-green-600 mr-3">✅</span>
                        <span class="text-green-800">Tailwind CSS 프로덕션 경고 해결</span>
                    </div>
                    
                    <div class="flex items-center p-3 bg-green-50 border border-green-200 rounded-lg">
                        <span class="text-green-600 mr-3">✅</span>
                        <span class="text-green-800">Table API 500 오류 해결 (독립형 DB)</span>
                    </div>
                    
                    <div class="flex items-center p-3 bg-green-50 border border-green-200 rounded-lg">
                        <span class="text-green-600 mr-3">✅</span>
                        <span class="text-green-800">인증 시스템 오류 해결 (Standalone Auth)</span>
                    </div>
                    
                    <div class="flex items-center p-3 bg-green-50 border border-green-200 rounded-lg">
                        <span class="text-green-600 mr-3">✅</span>
                        <span class="text-green-800">Service Worker 오류 해결</span>
                    </div>
                </div>
                
                <!-- 테스트 섹션 -->
                <div class="space-y-6">
                    <h2 class="text-xl font-semibold mb-4">🧪 시스템 테스트</h2>
                    
                    <!-- CSS 테스트 -->
                    <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <h3 class="font-semibold text-blue-800 mb-2">1. CSS 시스템 테스트</h3>
                        <div class="flex space-x-2 mb-2">
                            <button class="btn btn-primary">Primary Button</button>
                            <button class="btn btn-secondary">Secondary</button>
                            <button class="btn btn-success">Success</button>
                        </div>
                        <input type="text" class="input" placeholder="입력 필드 테스트">
                    </div>
                    
                    <!-- 인증 시스템 테스트 -->
                    <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                        <h3 class="font-semibold text-yellow-800 mb-2">2. 독립형 인증 시스템 테스트</h3>
                        <button onclick="testAuth()" class="btn btn-primary mb-2">인증 시스템 테스트</button>
                        <div id="authTestResult" class="text-sm text-gray-600"></div>
                    </div>
                    
                    <!-- 콘솔 오류 체크 -->
                    <div class="p-4 bg-purple-50 border border-purple-200 rounded-lg">
                        <h3 class="font-semibold text-purple-800 mb-2">3. 콘솔 오류 체크</h3>
                        <button onclick="checkConsoleErrors()" class="btn btn-primary mb-2">콘솔 상태 확인</button>
                        <div id="consoleTestResult" class="text-sm text-gray-600"></div>
                    </div>
                    
                    <!-- 성능 테스트 -->
                    <div class="p-4 bg-green-50 border border-green-200 rounded-lg">
                        <h3 class="font-semibold text-green-800 mb-2">4. 성능 최적화 확인</h3>
                        <button onclick="checkPerformance()" class="btn btn-primary mb-2">성능 측정</button>
                        <div id="performanceResult" class="text-sm text-gray-600"></div>
                    </div>
                </div>
                
                <!-- 링크 테스트 -->
                <div class="mt-8 p-4 bg-gray-100 rounded-lg">
                    <h3 class="font-semibold mb-4">🔗 주요 페이지 테스트</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <a href="cost-effective-auth.html" class="btn btn-primary">가성비 인증 시스템</a>
                        <a href="login.html" class="btn btn-secondary">로그인 페이지</a>
                        <a href="index.html" class="btn btn-secondary">메인 페이지</a>
                        <a href="customer-dashboard.html" class="btn btn-secondary">고객 대시보드</a>
                    </div>
                </div>
                
                <!-- 결과 요약 -->
                <div id="overallResult" class="mt-8 p-4 text-center hidden">
                    <!-- 동적으로 채워짐 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 독립형 인증 시스템 -->
    <script src="standalone-auth.js"></script>
    
    <script>
        // 전역 오류 감지
        let errorCount = 0;
        const errors = [];
        
        window.addEventListener('error', function(event) {
            errorCount++;
            errors.push({
                type: 'JavaScript Error',
                message: event.message,
                filename: event.filename,
                lineno: event.lineno
            });
            console.error('감지된 오류:', event.message);
        });
        
        window.addEventListener('unhandledrejection', function(event) {
            errorCount++;
            errors.push({
                type: 'Promise Rejection',
                message: event.reason?.message || event.reason
            });
            console.error('감지된 Promise 오류:', event.reason);
        });
        
        // 인증 시스템 테스트
        async function testAuth() {
            const resultDiv = document.getElementById('authTestResult');
            resultDiv.innerHTML = '테스트 진행 중...';
            
            try {
                // pposhopAuth가 로드되었는지 확인
                if (typeof pposhopAuth === 'undefined') {
                    throw new Error('독립형 인증 시스템이 로드되지 않았습니다.');
                }
                
                // 통계 확인
                const stats = pposhopAuth.getStats();
                
                // 테스트 로그인
                const loginResult = await pposhopAuth.login('customer@pposhop.com', 'demo123');
                
                if (loginResult.success) {
                    resultDiv.innerHTML = `
                        <div class="text-green-600">
                            ✅ 인증 시스템 정상 작동<br>
                            👤 총 사용자: ${stats.total_users}명<br>
                            🔐 테스트 로그인 성공<br>
                            📊 현재 사용자: ${loginResult.user.name}
                        </div>
                    `;
                    
                    // 로그아웃
                    pposhopAuth.logout();
                } else {
                    throw new Error(loginResult.error);
                }
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="text-red-600">
                        ❌ 인증 시스템 오류: ${error.message}
                    </div>
                `;
            }
        }
        
        // 콘솔 오류 체크
        function checkConsoleErrors() {
            const resultDiv = document.getElementById('consoleTestResult');
            
            if (errorCount === 0) {
                resultDiv.innerHTML = `
                    <div class="text-green-600">
                        ✅ 콘솔 오류 없음<br>
                        🚀 모든 스크립트 정상 로드
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="text-red-600">
                        ❌ 감지된 오류: ${errorCount}개<br>
                        <details class="mt-2">
                            <summary>오류 상세보기</summary>
                            ${errors.map(err => `
                                <div class="text-xs mt-1 p-1 bg-red-100 rounded">
                                    ${err.type}: ${err.message}
                                </div>
                            `).join('')}
                        </details>
                    </div>
                `;
            }
        }
        
        // 성능 측정
        function checkPerformance() {
            const resultDiv = document.getElementById('performanceResult');
            
            const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
            const domTime = performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart;
            
            // CSS 로딩 확인
            const tailwindWarning = document.querySelector('[src*="tailwindcss.com"]');
            const customCSS = document.querySelector('[href*="pposhop-styles.css"]');
            
            resultDiv.innerHTML = `
                <div class="space-y-1">
                    <div class="text-blue-600">📊 성능 측정 결과:</div>
                    <div>⏱️ 페이지 로드: ${loadTime}ms</div>
                    <div>🏗️ DOM 로드: ${domTime}ms</div>
                    <div>🎨 CSS: ${customCSS ? '✅ 최적화됨' : '❌ 미적용'}</div>
                    <div>⚠️ Tailwind CDN: ${tailwindWarning ? '❌ 여전히 사용중' : '✅ 제거됨'}</div>
                    <div class="text-sm text-gray-500 mt-2">
                        ${loadTime < 2000 ? '🚀 우수한 성능' : loadTime < 5000 ? '⚡ 양호한 성능' : '🐌 개선 필요'}
                    </div>
                </div>
            `;
        }
        
        // 종합 결과 표시
        function showOverallResult() {
            const resultDiv = document.getElementById('overallResult');
            
            // 모든 테스트 실행
            setTimeout(() => {
                const cssOk = document.querySelector('[href*="pposhop-styles.css"]');
                const authOk = typeof pposhopAuth !== 'undefined';
                const noTailwind = !document.querySelector('[src*="tailwindcss.com"]');
                
                const allOk = cssOk && authOk && noTailwind && errorCount === 0;
                
                if (allOk) {
                    resultDiv.className = 'mt-8 p-4 text-center bg-green-100 border border-green-300 rounded-lg';
                    resultDiv.innerHTML = `
                        <h3 class="text-xl font-bold text-green-800 mb-2">🎉 모든 오류 해결 완료!</h3>
                        <p class="text-green-700">뽀샵 가성비 인증 시스템이 완벽하게 작동합니다.</p>
                        <div class="mt-4 space-x-2">
                            <a href="cost-effective-auth.html" class="btn btn-primary">가성비 인증 체험</a>
                            <a href="login.html" class="btn btn-secondary">로그인 테스트</a>
                        </div>
                    `;
                } else {
                    resultDiv.className = 'mt-8 p-4 text-center bg-yellow-100 border border-yellow-300 rounded-lg';
                    resultDiv.innerHTML = `
                        <h3 class="text-xl font-bold text-yellow-800 mb-2">⚠️ 일부 문제 발견</h3>
                        <p class="text-yellow-700">위의 테스트 버튼들을 클릭하여 상세 내용을 확인하세요.</p>
                    `;
                }
                
                resultDiv.classList.remove('hidden');
            }, 1000);
        }
        
        // 페이지 로드 완료 후 자동 체크
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 뽀샵 오류 해결 테스트 페이지 로드 완료');
            
            // 3초 후 종합 결과 표시
            setTimeout(showOverallResult, 3000);
        });
        
        // 전역 테스트 함수
        window.runAllTests = function() {
            testAuth();
            checkConsoleErrors();
            checkPerformance();
            showOverallResult();
        };
        
        console.log('✅ 뽀샵 오류 해결 테스트 시스템 준비 완료');
    </script>
</body>
</html>
