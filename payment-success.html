<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - beautycat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#fff0f8',
                            100: '#ffe3f2',
                            500: '#ff2d92',
                            600: '#e6297f',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
        .unni-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="unni-card max-w-md w-full p-8 text-center">
            <!-- 성공 아이콘 -->
            <div class="mb-6">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-green-500 text-2xl"></i>
                </div>
                <div class="w-24 h-1 bg-gradient-to-r from-primary-500 to-green-500 rounded-full mx-auto"></div>
            </div>
            
            <!-- 메시지 -->
            <h1 class="text-2xl font-bold text-gray-900 mb-2">결제가 완료되었습니다!</h1>
            <p class="text-gray-600 mb-6">업체에서 곧 연락드릴 예정입니다</p>
            
            <!-- 주문 정보 -->
            <div id="order-info" class="bg-gray-50 p-4 rounded-lg mb-6 text-left">
                <h3 class="font-semibold text-gray-900 mb-3 text-center">주문 정보</h3>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-600">주문번호</span>
                        <span id="order-number" class="font-medium">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">결제금액</span>
                        <span id="payment-amount" class="font-medium text-primary-500">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">업체명</span>
                        <span id="shop-name" class="font-medium">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">결제일시</span>
                        <span id="payment-date" class="font-medium">-</span>
                    </div>
                </div>
            </div>
            
            <!-- 안내사항 -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-left">
                <h4 class="flex items-center font-medium text-blue-900 mb-2">
                    <i class="fas fa-info-circle mr-2"></i>
                    다음 단계 안내
                </h4>
                <ul class="text-sm text-blue-800 space-y-1">
                    <li>• 업체에서 24시간 내 연락드립니다</li>
                    <li>• 예약 일정을 함께 조율합니다</li>
                    <li>• 궁금한 점은 업체에 직접 문의해주세요</li>
                </ul>
            </div>
            
            <!-- 액션 버튼 -->
            <div class="space-y-3">
                <button onclick="goToDashboard()" 
                        class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-tachometer-alt mr-2"></i>
                    내 대시보드로 가기
                </button>
                
                <button onclick="goToHome()" 
                        class="w-full border border-gray-300 hover:bg-gray-50 text-gray-700 py-3 rounded-lg font-medium transition-colors">
                    <i class="fas fa-home mr-2"></i>
                    홈으로 가기
                </button>
            </div>
            
            <!-- 고객센터 -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-500 mb-2">결제 관련 문의</p>
                <div class="flex justify-center space-x-4 text-sm">
                    <a href="tel:1588-0000" class="text-primary-500 hover:text-primary-600">
                        <i class="fas fa-phone mr-1"></i>1588-0000
                    </a>
                    <a href="mailto:support@pposhop.kr" class="text-primary-500 hover:text-primary-600">
                        <i class="fas fa-envelope mr-1"></i>support@pposhop.kr
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/external-payment.js"></script>
    <script>
        // URL 파라미터에서 주문 정보 가져오기
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order');
            
            if (orderId) {
                loadOrderInfo(orderId);
            } else {
                // 주문 정보가 없는 경우 기본 정보 표시
                document.getElementById('order-number').textContent = '주문 정보를 확인할 수 없습니다';
            }
        });
        
        // 주문 정보 로드
        async function loadOrderInfo(orderId) {
            try {
                const response = await fetch(`tables/external_orders?search=${orderId}&limit=1`);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    const order = data.data[0];
                    
                    document.getElementById('order-number').textContent = order.orderId;
                    document.getElementById('payment-amount').textContent = formatPrice(order.estimatedPrice) + '원';
                    document.getElementById('shop-name').textContent = order.shopName;
                    document.getElementById('payment-date').textContent = new Date().toLocaleString('ko-KR');
                    
                    // 결제 완료 처리
                    await externalPaymentManager.handlePaymentComplete(orderId, {
                        completedAt: new Date().toISOString(),
                        source: 'payment_success_page'
                    });
                }
            } catch (error) {
                console.error('주문 정보 로드 오류:', error);
            }
        }
        
        // 가격 포맷팅
        function formatPrice(price) {
            return new Intl.NumberFormat('ko-KR').format(price);
        }
        
        // 대시보드로 이동
        function goToDashboard() {
            // 사용자 타입에 따라 적절한 대시보드로 이동
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            
            switch (currentUser.user_type) {
                case 'shop':
                    window.location.href = 'shop-dashboard.html';
                    break;
                case 'admin':
                    window.location.href = 'admin-dashboard.html';
                    break;
                default:
                    window.location.href = 'customer-dashboard.html';
            }
        }
        
        // 홈으로 이동
        function goToHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
