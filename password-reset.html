<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - BeautyCat</title>
    
    <!-- SEO -->
    <meta name="description" content="BeautyCat 비밀번호 재설정 - 이메일 인증을 통해 비밀번호를 재설정하세요.">
    <meta name="keywords" content="비밀번호 찾기, 비밀번호 재설정, BeautyCat, 뷰티켓">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fff0f8',
                            100: '#ffe3f2',
                            200: '#ffc7e6',
                            300: '#ff9bd4',
                            400: '#ff5fb8',
                            500: '#ff2d92',
                            600: '#e6297f',
                            700: '#cc256c',
                            800: '#a62158',
                            900: '#8a1e4a'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        
        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .step::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #e5e7eb;
            z-index: -1;
            transform: translateY(-50%);
        }
        
        .step:first-child::before {
            left: 50%;
        }
        
        .step:last-child::before {
            right: 50%;
        }
        
        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e5e7eb;
            color: #9ca3af;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }
        
        .step.active .step-circle {
            background: #ff2d92;
            color: white;
        }
        
        .step.completed .step-circle {
            background: #10b981;
            color: white;
        }
        
        .step.completed::before {
            background: #10b981;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-2">
                    <img src="images/logo.png" alt="BeautyCat" class="h-8">
                    <span class="text-2xl font-bold text-primary-500">BeautyCat</span>
                </a>
                <a href="login.html" class="text-gray-600 hover:text-primary-500 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>로그인으로 돌아가기
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-8">
        <!-- Step Indicator -->
        <div class="step-indicator" id="stepIndicator">
            <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <div class="text-sm font-medium">이메일 확인</div>
            </div>
            <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <div class="text-sm font-medium">인증코드 입력</div>
            </div>
            <div class="step" data-step="3">
                <div class="step-circle">3</div>
                <div class="text-sm font-medium">비밀번호 재설정</div>
            </div>
        </div>

        <!-- Step 1: 이메일 입력 -->
        <div id="step1" class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">비밀번호 찾기</h2>
            <p class="text-gray-600 mb-6">가입하신 이메일 주소를 입력해주세요.</p>
            
            <form id="emailForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        이메일 주소
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="example@beautycat.kr"
                    >
                </div>
                
                <button
                    type="submit"
                    id="sendCodeBtn"
                    class="w-full bg-primary-500 text-white py-3 rounded-lg font-medium hover:bg-primary-600 transition-colors"
                >
                    인증코드 받기
                </button>
            </form>
            
            <p class="text-sm text-gray-500 mt-4 text-center">
                계정이 없으신가요? 
                <a href="register.html" class="text-primary-500 hover:text-primary-600 font-medium">회원가입</a>
            </p>
        </div>

        <!-- Step 2: 인증코드 입력 -->
        <div id="step2" class="bg-white rounded-lg shadow-md p-8 hidden">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">인증코드 입력</h2>
            <p class="text-gray-600 mb-6">
                <span id="emailDisplay" class="font-medium text-primary-500"></span>로<br>
                인증코드를 발송했습니다.
            </p>
            
            <form id="codeForm" class="space-y-4">
                <div>
                    <label for="verificationCode" class="block text-sm font-medium text-gray-700 mb-2">
                        인증코드 (6자리)
                    </label>
                    <input
                        type="text"
                        id="verificationCode"
                        name="verificationCode"
                        required
                        maxlength="6"
                        pattern="[0-9]{6}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-center text-2xl tracking-widest"
                        placeholder="000000"
                    >
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <span class="text-gray-500">
                        남은 시간: <span id="timer" class="font-medium text-primary-500">05:00</span>
                    </span>
                    <button
                        type="button"
                        id="resendCodeBtn"
                        class="text-primary-500 hover:text-primary-600 font-medium"
                    >
                        재전송
                    </button>
                </div>
                
                <button
                    type="submit"
                    id="verifyCodeBtn"
                    class="w-full bg-primary-500 text-white py-3 rounded-lg font-medium hover:bg-primary-600 transition-colors"
                >
                    인증하기
                </button>
            </form>
            
            <button
                type="button"
                onclick="goToStep(1)"
                class="w-full mt-4 text-gray-600 hover:text-gray-900 font-medium"
            >
                <i class="fas fa-arrow-left mr-2"></i>이전으로
            </button>
        </div>

        <!-- Step 3: 비밀번호 재설정 -->
        <div id="step3" class="bg-white rounded-lg shadow-md p-8 hidden">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">새 비밀번호 설정</h2>
            <p class="text-gray-600 mb-6">새로운 비밀번호를 입력해주세요.</p>
            
            <form id="passwordForm" class="space-y-4">
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        새 비밀번호
                    </label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="8자 이상 (영문+숫자 조합)"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>8자 이상, 영문과 숫자를 포함해주세요.
                    </p>
                </div>
                
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호 확인
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="비밀번호 재입력"
                    >
                </div>
                
                <div id="passwordStrength" class="hidden">
                    <div class="flex items-center space-x-2 text-sm">
                        <span class="text-gray-600">비밀번호 강도:</span>
                        <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="strengthBar" class="h-full transition-all duration-300"></div>
                        </div>
                        <span id="strengthText" class="font-medium"></span>
                    </div>
                </div>
                
                <button
                    type="submit"
                    id="resetPasswordBtn"
                    class="w-full bg-primary-500 text-white py-3 rounded-lg font-medium hover:bg-primary-600 transition-colors"
                >
                    비밀번호 재설정
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="bg-white rounded-lg shadow-md p-8 text-center hidden">
            <div class="mb-4">
                <i class="fas fa-check-circle text-green-500 text-6xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">비밀번호 재설정 완료!</h2>
            <p class="text-gray-600 mb-6">새로운 비밀번호로 로그인해주세요.</p>
            
            <a
                href="login.html"
                class="inline-block bg-primary-500 text-white px-8 py-3 rounded-lg font-medium hover:bg-primary-600 transition-colors"
            >
                로그인하러 가기
            </a>
        </div>
    </main>

    <!-- Notification -->
    <div id="notification" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg p-4 max-w-sm">
            <div class="flex items-start">
                <div id="notificationIcon" class="flex-shrink-0 mr-3"></div>
                <div class="flex-1">
                    <p id="notificationMessage" class="text-sm font-medium text-gray-900"></p>
                </div>
                <button onclick="hideNotification()" class="flex-shrink-0 ml-3 text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        // 현재 단계
        let currentStep = 1;
        let verificationEmail = '';
        let verificationCode = '';
        let timerInterval = null;
        let timeRemaining = 300; // 5분

        // 단계 이동
        function goToStep(step) {
            // 이전 단계 숨기기
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`step${i}`).classList.add('hidden');
                const stepEl = document.querySelector(`[data-step="${i}"]`);
                stepEl.classList.remove('active', 'completed');
            }
            
            // 현재 단계 표시
            currentStep = step;
            document.getElementById(`step${step}`).classList.remove('hidden');
            
            // 단계 표시 업데이트
            for (let i = 1; i <= 3; i++) {
                const stepEl = document.querySelector(`[data-step="${i}"]`);
                if (i < step) {
                    stepEl.classList.add('completed');
                } else if (i === step) {
                    stepEl.classList.add('active');
                }
            }
            
            // 타이머 정리
            if (step !== 2 && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Step 1: 이메일로 인증코드 전송
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const btn = document.getElementById('sendCodeBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>전송 중...';
            
            try {
                // 이메일 존재 확인
                const response = await fetch(`tables/users?search=${encodeURIComponent(email)}&limit=1`);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    showNotification('등록되지 않은 이메일입니다.', 'error');
                    return;
                }
                
                const user = data.data.find(u => u.email === email);
                if (!user) {
                    showNotification('등록되지 않은 이메일입니다.', 'error');
                    return;
                }
                
                // 인증코드 생성 (6자리)
                verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                verificationEmail = email;
                
                // 실제 환경에서는 이메일 발송 API 호출
                // await sendVerificationEmail(email, verificationCode);
                
                // 개발 환경: 콘솔에 출력
                console.log('🔐 인증코드:', verificationCode);
                console.log('📧 발송 이메일:', email);
                
                showNotification('인증코드를 발송했습니다. 이메일을 확인해주세요.', 'success');
                
                // Step 2로 이동
                document.getElementById('emailDisplay').textContent = email;
                goToStep(2);
                startTimer();
                
            } catch (error) {
                console.error('인증코드 발송 오류:', error);
                showNotification('인증코드 발송에 실패했습니다.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // 타이머 시작
        function startTimer() {
            timeRemaining = 300; // 5분
            updateTimer();
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimer();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showNotification('인증코드가 만료되었습니다. 재전송해주세요.', 'warning');
                }
            }, 1000);
        }

        function updateTimer() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 인증코드 재전송
        document.getElementById('resendCodeBtn').addEventListener('click', async () => {
            if (timeRemaining > 0 && timeRemaining < 240) { // 1분 이상 남았으면 재전송 불가
                showNotification('인증코드는 1분 후에 재전송할 수 있습니다.', 'warning');
                return;
            }
            
            // 새 인증코드 생성
            verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
            console.log('🔐 새 인증코드:', verificationCode);
            
            showNotification('인증코드를 재전송했습니다.', 'success');
            startTimer();
        });

        // Step 2: 인증코드 확인
        document.getElementById('codeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const inputCode = document.getElementById('verificationCode').value;
            
            if (timeRemaining <= 0) {
                showNotification('인증코드가 만료되었습니다. 재전송해주세요.', 'error');
                return;
            }
            
            if (inputCode !== verificationCode) {
                showNotification('인증코드가 일치하지 않습니다.', 'error');
                return;
            }
            
            clearInterval(timerInterval);
            showNotification('인증이 완료되었습니다!', 'success');
            goToStep(3);
        });

        // 비밀번호 강도 체크
        document.getElementById('newPassword').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (password.length === 0) {
                strengthDiv.classList.add('hidden');
                return;
            }
            
            strengthDiv.classList.remove('hidden');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-green-500', 'bg-green-600'];
            const texts = ['매우 약함', '약함', '보통', '강함', '매우 강함'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            
            strengthBar.className = `h-full transition-all duration-300 ${colors[strength - 1]}`;
            strengthBar.style.width = widths[strength - 1];
            strengthText.textContent = texts[strength - 1];
        });

        // Step 3: 비밀번호 재설정
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showNotification('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
            
            if (newPassword.length < 8) {
                showNotification('비밀번호는 8자 이상이어야 합니다.', 'error');
                return;
            }
            
            if (!/(?=.*[A-Za-z])(?=.*\d)/.test(newPassword)) {
                showNotification('비밀번호는 영문과 숫자를 포함해야 합니다.', 'error');
                return;
            }
            
            const btn = document.getElementById('resetPasswordBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>재설정 중...';
            
            try {
                // 사용자 찾기
                const response = await fetch(`tables/users?search=${encodeURIComponent(verificationEmail)}&limit=1`);
                const data = await response.json();
                const user = data.data.find(u => u.email === verificationEmail);
                
                if (!user) {
                    showNotification('사용자를 찾을 수 없습니다.', 'error');
                    return;
                }
                
                // 비밀번호 해시화
                let hashedPassword = newPassword;
                if (window.securityManager) {
                    const hashed = await window.securityManager.hashPassword(newPassword);
                    hashedPassword = hashed.hash + ':' + hashed.salt;
                }
                
                // 비밀번호 업데이트
                const updateResponse = await fetch(`tables/users/${user.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: hashedPassword })
                });
                
                if (!updateResponse.ok) {
                    throw new Error('비밀번호 업데이트 실패');
                }
                
                // 성공 메시지 표시
                document.getElementById('step3').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                
            } catch (error) {
                console.error('비밀번호 재설정 오류:', error);
                showNotification('비밀번호 재설정에 실패했습니다.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // 알림 표시
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const messageEl = document.getElementById('notificationMessage');
            
            const icons = {
                success: '<i class="fas fa-check-circle text-green-500 text-xl"></i>',
                error: '<i class="fas fa-exclamation-circle text-red-500 text-xl"></i>',
                warning: '<i class="fas fa-exclamation-triangle text-yellow-500 text-xl"></i>',
                info: '<i class="fas fa-info-circle text-blue-500 text-xl"></i>'
            };
            
            icon.innerHTML = icons[type] || icons.info;
            messageEl.textContent = message;
            
            notification.classList.remove('hidden');
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        }

        function hideNotification() {
            document.getElementById('notification').classList.add('hidden');
        }
    </script>
</body>
</html>
