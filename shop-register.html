<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업체 회원가입 - beautycat</title>
    
    <!-- 🚨 CRITICAL FIX: 최우선 실행 -->
    <script src="sw-unregister.js"></script>
    <script src="api-global-override.js?v=2.7.3.3"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        input:focus {
            outline: none;
            border-color: #ff2d92;
            box-shadow: 0 0 0 3px rgba(255, 45, 146, 0.1);
        }
        
        @media (max-width: 640px) {
            input, button {
                font-size: 16px;
                min-height: 52px;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <a href="index.html" class="flex items-center">
                <img src="images/beautycat-logo.png" alt="BeautyCat" style="height: 40px; width: auto;">
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 py-8">
        <!-- 안내 메시지 -->
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-pink-100 rounded-full mb-4">
                <i class="fas fa-store text-pink-500 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-3">
                업체 회원가입
            </h1>
            <p class="text-gray-600 mb-2">
                간단한 정보만 입력하세요
            </p>
            <p class="text-sm text-gray-500">
                상세 정보는 가입 후 대시보드에서 등록하실 수 있습니다
            </p>
        </div>

        <!-- 등록 폼 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <form id="shop-register-form" class="space-y-4">
                
                <!-- 이름 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        이름 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="name" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                           placeholder="홍길동">
                </div>

                <!-- 이메일 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        이메일 <span class="text-red-500">*</span>
                    </label>
                    <input type="email" id="email" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                           placeholder="example@email.com">
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호 <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="password" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                           placeholder="6자 이상 입력">
                    <p class="text-xs text-gray-500 mt-1">최소 6자 이상 입력해주세요</p>
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호 확인 <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="password-confirm" required minlength="6"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                           placeholder="비밀번호 재입력">
                </div>

                <!-- 사업자등록번호 (선택) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        사업자등록번호 <span class="text-gray-400">(선택)</span>
                    </label>
                    <input type="text" id="business-number" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-pink-500" 
                           placeholder="123-45-67890"
                           pattern="\d{3}-\d{2}-\d{5}"
                           maxlength="12">
                    <p class="text-xs text-gray-500 mt-1">
                        형식: 123-45-67890 (개인 샵은 생략 가능)
                    </p>
                </div>

                <!-- 안내 메시지 -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <div class="flex items-start">
                        <i class="fas fa-info-circle text-blue-500 mt-1 mr-3"></i>
                        <div class="text-sm text-blue-800">
                            <p class="font-semibold mb-1">📝 가입 후 절차</p>
                            <ol class="list-decimal list-inside space-y-1">
                                <li><strong>대시보드 > 샵 정보</strong>에서 업체 정보 등록 (5분 소요)</li>
                                <li>관리자 승인 (1-2 영업일)</li>
                                <li>고객 상담 요청 받기 시작</li>
                            </ol>
                        </div>
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <button type="submit" 
                        class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                    <i class="fas fa-check mr-2"></i>가입하기
                </button>

                <!-- 로그인 링크 -->
                <div class="text-center pt-4 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        이미 계정이 있으신가요? 
                        <a href="login.html" class="text-pink-500 hover:text-pink-600 font-medium">로그인</a>
                    </p>
                </div>
            </form>
        </div>

        <!-- 추가 안내 -->
        <div class="mt-6 text-center">
            <p class="text-xs text-gray-500">
                회원가입 시 <a href="legal/terms.html" class="text-pink-500 underline">이용약관</a> 및 
                <a href="legal/privacy.html" class="text-pink-500 underline">개인정보처리방침</a>에 동의하게 됩니다.
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/security-manager.js"></script>
    <script src="js/api-helper.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        console.log('🏪 업체 간편 회원가입 페이지 초기화');
        
        // 폼 제출 처리
        document.getElementById('shop-register-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            const businessNumber = document.getElementById('business-number').value.trim();
            
            // 유효성 검증
            if (!name || !email || !password || !passwordConfirm) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }
            
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            if (password.length < 6) {
                alert('비밀번호는 최소 6자 이상이어야 합니다.');
                return;
            }
            
            // 이메일 형식 확인
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('올바른 이메일 형식을 입력해주세요.');
                return;
            }
            
            // 사업자등록번호 형식 확인 (입력된 경우만)
            if (businessNumber) {
                const bnRegex = /^\d{3}-\d{2}-\d{5}$/;
                if (!bnRegex.test(businessNumber)) {
                    alert('사업자등록번호 형식이 올바르지 않습니다.\n형식: 123-45-67890');
                    return;
                }
            }
            
            try {
                // 버튼 비활성화
                const submitButton = event.target.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>가입 중...';
                
                // 사용자 데이터 준비
                const userData = {
                    name: name,
                    email: email,
                    password: password,
                    business_number: businessNumber || null, // 사업자번호 (선택)
                    user_type: 'shop', // 업체 회원
                    status: 'pending', // 승인 대기
                    is_verified: false,
                    created_at: Date.now()
                };
                
                // auth.js의 processRegister 함수 사용
                if (typeof processRegister === 'function') {
                    await processRegister(userData);
                } else {
                    // auth.js가 없는 경우 직접 API 호출
                    const response = await fetch('/tables/users', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(userData)
                    });
                    
                    if (!response.ok) {
                        throw new Error('회원가입 처리 실패');
                    }
                    
                    const result = await response.json();
                    console.log('✅ 회원가입 성공:', result);
                    
                    // 로컬 스토리지에 임시 저장
                    localStorage.setItem('userData', JSON.stringify({
                        ...result,
                        user_type: 'shop'
                    }));
                    
                    // 성공 메시지
                    alert('🎉 회원가입이 완료되었습니다!\n\n다음 단계: 대시보드에서 "샵 정보"를 등록해주세요.\n(등록 완료 후 고객의 상담 요청을 받을 수 있습니다)');
                    
                    // 대시보드로 이동
                    window.location.href = 'shop-dashboard.html';
                }
                
            } catch (error) {
                console.error('❌ 회원가입 오류:', error);
                
                // 버튼 복구
                const submitButton = event.target.querySelector('button[type="submit"]');
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-check mr-2"></i>가입하기';
                
                // 에러 메시지 표시
                if (error.message.includes('이미 사용')) {
                    alert('이미 사용 중인 이메일입니다.');
                } else {
                    alert('회원가입 중 오류가 발생했습니다.\n다시 시도해주세요.');
                }
            }
        });
    </script>
</body>
</html>
