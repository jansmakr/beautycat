name: Update RSS Feed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 403 에러 해결을 위해 필수 추가
permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Node.js 설정 단계는 현재 Bash로만 생성하므로 삭제해도 무방하지만, 
      # 나중에 확장성을 고려한다면 유지하셔도 됩니다.

      - name: Generate RSS Feed
        run: |
          echo "📡 RSS 피드 생성 시작..."
          
          # 'EOF'에서 따옴표를 제거하여 내부 변수($(date))가 해석되도록 수정
          cat > rss.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
            <channel>
              <title>Beautyket - 전국 피부관리실 정보</title>
              <link>https://beautyket.kr/</link>
              <description>전국 피부관리실 정보, 견적 비교, 예약 서비스. 강남, 홍대, 부산, 대구 등 전국 30,000개 피부관리실 데이터베이스</description>
              <language>ko</language>
              <lastBuildDate>$(date -R)</lastBuildDate>
              <atom:link href="https://beautyket.kr/rss.xml" rel="self" type="application/rss+xml" />
              <image>
                <url>https://beautyket.kr/images/beautyket-logo-full.png</url>
                <title>Beautyket</title>
                <link>https://beautyket.kr/</link>
              </image>

              <item>
                <title>Beautyket 일일 업데이트 - $(date +'%Y년 %m월 %d일')</title>
                <link>https://beautyket.kr/</link>
                <description>전국 피부관리실 데이터베이스 최신 업데이트. 신규 등록 샵 정보 및 서비스 개선 사항.</description>
                <pubDate>$(date -R)</pubDate>
                <guid isPermaLink="false">https://beautyket.kr/#update-$(date +%Y-%m-%d)</guid>
              </item>

              <item>
                <title>Beautyket - 전국 피부관리실 견적 비교 서비스</title>
                <link>https://beautyket.kr/</link>
                <description>피부관리실 찾기가 쉬워집니다. 지역별 피부관리실 정보, 실시간 견적 비교, 고객 리뷰 확인.</description>
                <pubDate>$(date -R)</pubDate>
                <guid isPermaLink="false">https://beautyket.kr/#service-intro</guid>
              </item>

              <item>
                <title>피부관리실 업주님께 - 무료 샵 등록 혜택</title>
                <link>https://beautyket.kr/shop-registration.html</link>
                <description>Beautyket에 샵을 무료로 등록하고 지역 고객에게 노출하세요. 견적 신청 자동 매칭, 고객 관리 대시보드 제공.</description>
                <pubDate>$(date -R)</pubDate>
                <guid>https://beautyket.kr/shop-registration.html</guid>
              </item>
            </channel>
          </rss>
          EOF
          
          echo "✅ RSS 피드 생성 완료"
          ls -lh rss.xml
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet rss.xml || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and Push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add rss.xml
          git commit -m "🔄 Auto-update RSS feed - $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## 📡 RSS Feed Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Update Time: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 File Size: $(du -h rss.xml | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 RSS URL: https://beautyket.kr/rss.xml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ RSS feed updated and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
