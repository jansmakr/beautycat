<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 대시보드 - BeautyCat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card { transition: transform 0.2s; cursor: pointer; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .action-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: all 0.3s;
        }
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">🐱 BeautyCat</h1>
                    <p class="text-sm text-gray-500">피부관리실 견적 플랫폼</p>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="customer-name" class="font-medium"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Welcome Banner -->
        <div class="action-card card mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold mb-2">
                        <span id="welcome-name"></span>님, 환영합니다! 👋
                    </h2>
                    <p class="text-blue-100">피부관리가 필요하신가요? 지금 바로 상담을 신청하세요.</p>
                </div>
                <button onclick="goToRequestPage()" class="px-6 py-3 bg-white text-purple-600 rounded-lg hover:bg-gray-100 font-bold">
                    <i class="fas fa-plus mr-2"></i>
                    상담 신청하기
                </button>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card stat-card" onclick="filterConsultations('all')">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">전체 상담</p>
                        <p id="stat-total" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-comments text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card" onclick="filterConsultations('pending')">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">답변 대기</p>
                        <p id="stat-pending" class="text-3xl font-bold text-yellow-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card" onclick="goToQuotesPage()">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">받은 견적서</p>
                        <p id="stat-quotes" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-invoice text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card" onclick="filterConsultations('completed')">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">완료된 관리</p>
                        <p id="stat-completed" class="text-3xl font-bold text-purple-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 빠른 액션 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <button onclick="goToRequestPage()" class="card hover:shadow-lg transition-all text-left group">
                <div class="flex items-center mb-3">
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-blue-200 transition-colors">
                        <i class="fas fa-plus text-blue-600 text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg">새 상담 신청</h3>
                </div>
                <p class="text-gray-600 text-sm">피부 고민을 등록하고 견적을 받아보세요</p>
            </button>

            <button onclick="goToQuotesPage()" class="card hover:shadow-lg transition-all text-left group">
                <div class="flex items-center mb-3">
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-green-200 transition-colors">
                        <i class="fas fa-file-invoice text-green-600 text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg">받은 견적서</h3>
                </div>
                <p class="text-gray-600 text-sm">업체에서 보낸 견적서를 확인하세요</p>
            </button>

            <button onclick="goToShopsPage()" class="card hover:shadow-lg transition-all text-left group">
                <div class="flex items-center mb-3">
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-purple-200 transition-colors">
                        <i class="fas fa-search text-purple-600 text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg">업체 찾기</h3>
                </div>
                <p class="text-gray-600 text-sm">내 근처 피부관리실을 찾아보세요</p>
            </button>
        </div>

        <!-- 내 상담 요청 목록 -->
        <div class="card">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">내 상담 요청</h2>
                <div class="flex space-x-2">
                    <button onclick="filterConsultations('all')" id="filter-all" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm">
                        전체
                    </button>
                    <button onclick="filterConsultations('pending')" id="filter-pending" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 text-sm">
                        대기중
                    </button>
                    <button onclick="filterConsultations('in_progress')" id="filter-in_progress" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 text-sm">
                        진행중
                    </button>
                    <button onclick="filterConsultations('completed')" id="filter-completed" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 text-sm">
                        완료
                    </button>
                </div>
            </div>

            <!-- 로딩 -->
            <div id="loading" class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-2"></i>
                <p class="text-gray-600">로딩중...</p>
            </div>

            <!-- 상담 목록 -->
            <div id="consultations-list" class="hidden space-y-4">
                <!-- 동적으로 로드됩니다 -->
            </div>

            <!-- 빈 상태 -->
            <div id="empty-state" class="hidden text-center py-12">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg mb-4">상담 요청이 없습니다.</p>
                <button onclick="goToRequestPage()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>
                    첫 상담 신청하기
                </button>
            </div>
        </div>

    </main>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let currentCustomer = null;
        let allConsultations = [];
        let currentFilter = 'all';

        // 세션 확인
        function checkSession() {
            const user = JSON.parse(localStorage.getItem('beautycat_user') || '{}');
            if (!user.id || user.user_type !== 'customer') {
                alert('로그인이 필요합니다.');
                window.location.href = 'login-clean.html';
                return null;
            }
            return user;
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('beautycat_user');
            window.location.href = 'login-clean.html';
        }

        // 페이지 이동
        function goToRequestPage() {
            window.location.href = 'consultation-request.html';
        }

        function goToQuotesPage() {
            window.location.href = 'my-quotes.html';
        }

        function goToShopsPage() {
            alert('업체 찾기 기능은 곧 추가됩니다!');
        }

        // 상담 요청 로드
        async function loadConsultations() {
            try {
                const response = await fetch(`${API_BASE}/tables/consultations`);
                const data = await response.json();
                
                // 현재 고객의 상담만 필터링
                allConsultations = (data.data || []).filter(c => c.customer_id === currentCustomer.id);
                
                updateStats();
                displayConsultations();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('consultations-list').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading consultations:', error);
                document.getElementById('loading').innerHTML = 
                    '<p class="text-red-500">데이터를 불러오는데 실패했습니다.</p>';
            }
        }

        // 견적서 개수 로드
        async function loadQuotesCount() {
            try {
                const response = await fetch(`${API_BASE}/tables/quotes`);
                const data = await response.json();
                
                // 현재 고객의 견적서만 카운트
                const myQuotes = (data.data || []).filter(q => q.customer_id === currentCustomer.id);
                document.getElementById('stat-quotes').textContent = myQuotes.length;

            } catch (error) {
                console.error('Error loading quotes:', error);
            }
        }

        // 통계 업데이트
        function updateStats() {
            const stats = {
                total: allConsultations.length,
                pending: allConsultations.filter(c => c.status === 'pending').length,
                completed: allConsultations.filter(c => c.status === 'completed').length
            };

            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-completed').textContent = stats.completed;
        }

        // 필터 적용
        function filterConsultations(status) {
            currentFilter = status;

            // 버튼 스타일 업데이트
            document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById(`filter-${status}`).classList.remove('bg-gray-200', 'text-gray-700');
            document.getElementById(`filter-${status}`).classList.add('bg-blue-600', 'text-white');

            displayConsultations();
        }

        // 상담 목록 표시
        function displayConsultations() {
            const filtered = currentFilter === 'all' 
                ? allConsultations 
                : allConsultations.filter(c => c.status === currentFilter);

            // 최신순 정렬
            filtered.sort((a, b) => b.created_at - a.created_at);

            const list = document.getElementById('consultations-list');
            const empty = document.getElementById('empty-state');

            if (filtered.length === 0) {
                list.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            list.classList.remove('hidden');

            list.innerHTML = filtered.map(item => `
                <div class="border rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-lg">${item.treatment_type}</h3>
                            <p class="text-sm text-gray-500">${item.shop_name}</p>
                        </div>
                        <span class="status-badge status-${item.status}">${getStatusText(item.status)}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-sm mb-3 bg-gray-50 p-3 rounded">
                        <p><i class="fas fa-user-tag text-gray-400 mr-2"></i>${item.skin_type}</p>
                        <p><i class="fas fa-calendar text-gray-400 mr-2"></i>${item.preferred_date}</p>
                        <p><i class="fas fa-clock text-gray-400 mr-2"></i>${item.preferred_time}</p>
                        <p><i class="fas fa-won-sign text-gray-400 mr-2"></i>${item.budget}</p>
                    </div>

                    <p class="text-sm text-gray-600 mb-2"><strong>고민:</strong> ${item.concern}</p>
                    <p class="text-sm text-gray-600 mb-3">${item.description}</p>

                    <div class="flex justify-between items-center pt-3 border-t">
                        <span class="text-xs text-gray-500">
                            신청일: ${new Date(item.created_at).toLocaleDateString()}
                        </span>
                        <button onclick="viewQuotes('${item.id}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                            <i class="fas fa-file-invoice mr-2"></i>견적서 확인
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 견적서 확인
        function viewQuotes(consultationId) {
            window.location.href = `my-quotes.html?consultation_id=${consultationId}`;
        }

        // 상태 텍스트
        function getStatusText(status) {
            const map = {
                'pending': '답변 대기',
                'in_progress': '진행중',
                'completed': '완료'
            };
            return map[status] || status;
        }

        // 초기화
        async function init() {
            currentCustomer = checkSession();
            if (!currentCustomer) return;

            document.getElementById('customer-name').textContent = currentCustomer.name;
            document.getElementById('welcome-name').textContent = currentCustomer.name;

            await loadConsultations();
            await loadQuotesCount();
        }

        init();
    </script>

</body>
</html>
