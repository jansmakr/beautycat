<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beautycat API 테스트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .logo { text-align: center; font-size: 2rem; margin-bottom: 20px; }
        .result { margin: 10px 0; padding: 15px; background: #f8f9fa; border-radius: 5px; border-left: 4px solid #ff2d92; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐱 beautycat API 테스트</div>
        <div id="results"></div>
    </div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">🔍 API 테스트 시작...</div>';
            
            // 1. 상담 데이터 조회 테스트
            try {
                console.log('상담 데이터 조회 시도...');
                const response = await fetch('/tables/consultations?limit=5');
                console.log('응답 상태:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('조회된 데이터:', data);
                    
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="success">✅ 상담 데이터 조회 성공</span><br>
                            총 데이터: ${data.total || 0}개<br>
                            현재 페이지: ${data.data ? data.data.length : 0}개
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="error">❌ 상담 데이터 조회 실패</span><br>
                            HTTP 상태: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('상담 데이터 조회 오류:', error);
                resultsDiv.innerHTML += `
                    <div class="result">
                        <span class="error">❌ 상담 데이터 조회 오류</span><br>
                        ${error.message}
                    </div>
                `;
            }
            
            // 2. 업체 데이터 조회 테스트
            try {
                console.log('업체 데이터 조회 시도...');
                const response = await fetch('/tables/skincare_shops?limit=5');
                console.log('업체 응답 상태:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('업체 데이터:', data);
                    
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="success">✅ 업체 데이터 조회 성공</span><br>
                            총 데이터: ${data.total || 0}개<br>
                            현재 페이지: ${data.data ? data.data.length : 0}개
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="error">❌ 업체 데이터 조회 실패</span><br>
                            HTTP 상태: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('업체 데이터 조회 오류:', error);
                resultsDiv.innerHTML += `
                    <div class="result">
                        <span class="error">❌ 업체 데이터 조회 오류</span><br>
                        ${error.message}
                    </div>
                `;
            }
            
            // 3. 테스트 데이터 추가 시도
            try {
                console.log('테스트 데이터 추가 시도...');
                const testData = {
                    customer_name: 'API 테스트 고객',
                    customer_phone: '010-0000-0000', 
                    customer_email: 'api-test@beautycat.com',
                    state: '서울특별시',
                    district: '테스트구',
                    treatment_types: ['API 테스트'],
                    skin_concerns: ['테스트'],
                    age_range: '테스트',
                    budget_range: '테스트',
                    preferred_schedule: '테스트',
                    additional_notes: 'API 연결 테스트 데이터입니다.',
                    status: 'pending',
                    submission_date: new Date().toISOString()
                };
                
                const response = await fetch('/tables/consultations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                console.log('데이터 추가 응답:', response.status);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('추가된 데이터:', result);
                    
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="success">✅ 테스트 데이터 추가 성공</span><br>
                            데이터 ID: ${result.id}<br>
                            추가 시간: ${new Date().toLocaleString()}
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultsDiv.innerHTML += `
                        <div class="result">
                            <span class="error">❌ 테스트 데이터 추가 실패</span><br>
                            HTTP 상태: ${response.status}<br>
                            오류: ${errorText}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('데이터 추가 오류:', error);
                resultsDiv.innerHTML += `
                    <div class="result">
                        <span class="error">❌ 테스트 데이터 추가 오류</span><br>
                        ${error.message}
                    </div>
                `;
            }
            
            resultsDiv.innerHTML += `
                <div class="result">
                    <strong>🏁 API 테스트 완료</strong><br>
                    테스트 시간: ${new Date().toLocaleString()}
                </div>
            `;
        }
        
        // 페이지 로드 시 자동 실행
        window.addEventListener('load', testAPI);
    </script>
</body>
</html>
