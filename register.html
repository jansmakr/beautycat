<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>회원가입 - BeautyCat | 피부관리실 견적비교 플랫폼</title>
    
    <!-- SEO -->
    <meta name="description" content="BeautyCat 회원가입. 간편하게 가입하고 맞춤형 피부관리 서비스를 이용하세요.">
    <meta name="robots" content="noindex, follow">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/tailwind-production.css">
    <link rel="stylesheet" href="css/mobile-optimized.css?v=2.1.0">
    <link rel="stylesheet" href="css/fast-transitions.css?v=2.4.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 카카오 SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    
    <style>
        * { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            min-height: 100vh;
        }

        /* 로고 호버 애니메이션 */
        .logo-container:hover img {
            transform: scale(1.05);
            transition: transform 0.2s ease;
            filter: brightness(1.1);
        }

        .card-soft {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #db2777, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f3f4f6;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        .user-type-btn {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .user-type-btn:hover {
            border-color: #ec4899;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }
        
        .user-type-btn.selected {
            border-color: #ec4899;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
        }

        .social-btn {
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .kakao-btn {
            background: #FEE500;
            color: #000000;
            border: 2px solid #FEE500;
        }

        .kakao-btn:hover {
            background: #fdd835;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(254, 229, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        /* 모바일 최적화 */
        @media (max-width: 640px) {
            .logo-container img {
                height: 40px !important;
            }

            .card-soft {
                border-radius: 20px;
                padding: 24px !important;
            }

            .input-field {
                font-size: 16px;
                padding: 12px 14px;
            }

            h2 {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="py-6 px-4">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <a href="index.html" class="logo-container" style="display: flex; align-items: center; text-decoration: none;">
                <img src="https://www.genspark.ai/api/files/s/bvA3zk1x" alt="Beautyket" style="height: 50px; width: auto;">
            </a>
            <a href="login.html" class="text-gray-600 hover:text-primary-500 transition-colors">
                <i class="fas fa-sign-in-alt mr-1"></i>로그인
            </a>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-2xl mx-auto px-4 pb-12">
        <div class="card-soft p-8 animate-fade-in-up">
            <!-- 제목 -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">회원가입</h2>
                <p class="text-gray-600">BeautyCat과 함께 시작하세요</p>
            </div>

            <!-- 카카오 간편가입 -->
            <div class="mb-8">
                <button type="button" 
                        onclick="registerWithKakao()" 
                        class="social-btn kakao-btn w-full">
                    <i class="fas fa-comment mr-2"></i>
                    카카오로 3초 만에 가입하기
                </button>
                <p class="text-center text-xs text-gray-500 mt-2">
                    간편하고 빠르게 가입하세요
                </p>
            </div>

            <div class="relative mb-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500 font-medium">또는 이메일로 가입</span>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <form id="registerForm" class="space-y-5">
                <!-- 사용자 유형 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        <i class="fas fa-user-circle mr-1 text-primary-500"></i>
                        가입 유형
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" 
                                class="user-type-btn selected" 
                                data-type="customer"
                                onclick="selectUserType('customer', this)">
                            <div class="text-center">
                                <i class="fas fa-user text-3xl mb-2" style="color: #ec4899;"></i>
                                <div class="font-semibold text-gray-900">고객</div>
                                <div class="text-xs text-gray-500 mt-1">일반 사용자</div>
                            </div>
                        </button>
                        <button type="button" 
                                class="user-type-btn" 
                                data-type="shop"
                                onclick="selectUserType('shop', this)">
                            <div class="text-center">
                                <i class="fas fa-store text-3xl mb-2" style="color: #a855f7;"></i>
                                <div class="font-semibold text-gray-900">피부관리실</div>
                                <div class="text-xs text-gray-500 mt-1">업체 회원</div>
                            </div>
                        </button>
                    </div>
                    <input type="hidden" id="userType" value="customer">
                </div>

                <!-- 이름 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-user mr-1 text-primary-500"></i>
                        이름
                    </label>
                    <input type="text" 
                           id="name" 
                           class="input-field" 
                           placeholder="홍길동" 
                           required>
                </div>

                <!-- 이메일 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-1 text-primary-500"></i>
                        이메일
                    </label>
                    <input type="email" 
                           id="email" 
                           class="input-field" 
                           placeholder="example@beautycat.kr" 
                           required>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-lock mr-1 text-primary-500"></i>
                        비밀번호
                    </label>
                    <input type="password" 
                           id="password" 
                           class="input-field" 
                           placeholder="8자 이상 입력하세요" 
                           required 
                           minlength="8">
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>
                        영문, 숫자 포함 8자 이상
                    </p>
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-check-circle mr-1 text-primary-500"></i>
                        비밀번호 확인
                    </label>
                    <input type="password" 
                           id="passwordConfirm" 
                           class="input-field" 
                           placeholder="비밀번호를 다시 입력하세요" 
                           required>
                </div>

                <!-- 전화번호 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-phone mr-1 text-primary-500"></i>
                        전화번호
                    </label>
                    <input type="tel" 
                           id="phone" 
                           class="input-field" 
                           placeholder="010-1234-5678" 
                           required>
                </div>

                <!-- 약관 동의 -->
                <div class="space-y-3 pt-4 border-t border-gray-200">
                    <label class="flex items-start cursor-pointer group">
                        <input type="checkbox" 
                               id="agreeAll" 
                               class="mt-1 mr-3" 
                               onchange="toggleAllAgreements(this)">
                        <span class="text-sm font-semibold text-gray-900 group-hover:text-primary-500">
                            <i class="fas fa-check-double mr-1 text-primary-500"></i>
                            전체 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreeTerms" 
                               class="mt-1 mr-3 agree-checkbox" 
                               required>
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            <a href="legal/terms.html" target="_blank" class="text-primary-500 hover:underline">[필수]</a>
                            이용약관 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreePrivacy" 
                               class="mt-1 mr-3 agree-checkbox" 
                               required>
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            <a href="legal/privacy.html" target="_blank" class="text-primary-500 hover:underline">[필수]</a>
                            개인정보처리방침 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreeMarketing" 
                               class="mt-1 mr-3 agree-checkbox">
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            [선택] 마케팅 정보 수신 동의
                        </span>
                    </label>
                </div>

                <!-- 회원가입 버튼 -->
                <button type="submit" 
                        class="btn-primary w-full py-4 text-lg font-bold rounded-xl mt-6">
                    <i class="fas fa-user-plus mr-2"></i>
                    회원가입
                </button>
            </form>

            <!-- 로그인 링크 -->
            <div class="text-center mt-6">
                <span class="text-gray-600">이미 계정이 있으신가요?</span>
                <a href="login.html" class="text-primary-500 font-semibold hover:underline ml-2">
                    로그인
                </a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/config.js?v=2.5.4"></script>
    <script src="js/auth.js?v=2.8.13"></script>
    <script src="js/kakao-login.js"></script>

    <script>
        // 사용자 유형 선택
        function selectUserType(type, button) {
            document.getElementById('userType').value = type;
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            if (button) {
                button.classList.add('selected');
            }
        }

        // 전체 동의 토글
        function toggleAllAgreements(checkbox) {
            const checkboxes = document.querySelectorAll('.agree-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
            });
        }

        // 개별 체크박스 감지
        document.addEventListener('DOMContentLoaded', function() {
            const agreeCheckboxes = document.querySelectorAll('.agree-checkbox');
            const agreeAll = document.getElementById('agreeAll');
            
            agreeCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const allChecked = Array.from(agreeCheckboxes)
                        .filter(c => c.required)
                        .every(c => c.checked);
                    agreeAll.checked = allChecked;
                });
            });
        });

        // 회원가입 폼 제출
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const phone = document.getElementById('phone').value.trim();
            const userType = document.getElementById('userType').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const agreePrivacy = document.getElementById('agreePrivacy').checked;
            
            // 유효성 검사
            if (!name || !email || !password || !phone) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }
            
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            if (password.length < 8) {
                alert('비밀번호는 8자 이상이어야 합니다.');
                return;
            }
            
            if (!agreeTerms || !agreePrivacy) {
                alert('필수 약관에 동의해주세요.');
                return;
            }
            
            try {
                // 회원가입 함수 호출 (auth.js에서 정의됨)
                await register({
                    name: name,
                    email: email,
                    password: password,
                    phone: phone,
                    user_type: userType
                });
            } catch (error) {
                console.error('회원가입 오류:', error);
                alert('회원가입에 실패했습니다. 다시 시도해주세요.');
            }
        });

        // 카카오 회원가입
        function registerWithKakao() {
            if (typeof startKakaoLogin === 'function') {
                startKakaoLogin();
            } else {
                alert('카카오 간편가입 기능을 준비 중입니다.');
            }
        }
    </script>
</body>
</html>
