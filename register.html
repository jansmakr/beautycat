<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - BeautyCat | 피부관리실 견적비교 플랫폼</title>
    <!-- v2.8.13.6.69: UI 개선 (로딩 + 에러 처리) -->
    
    <!-- SEO -->
    <meta name="description" content="BeautyCat 회원가입. 간편하게 가입하고 맞춤형 피부관리 서비스를 이용하세요.">
    <meta name="robots" content="noindex, follow">
    <meta name="naver-site-verification" content="d1de02844a6d373cbc20ace550630fcc83bf8979" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/tailwind-production.css">
    <link rel="stylesheet" href="css/mobile-optimized.css?v=2.1.0">
    <link rel="stylesheet" href="css/fast-transitions.css?v=2.4.4">
    <link rel="stylesheet" href="css/logo-mobile-fix.css?v=2.8.13.6.80">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 카카오 SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    
    <style>
        * { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            min-height: 100vh;
        }

        /* 로고 호버 애니메이션 */
        .logo-container:hover img {
            transform: scale(1.05);
            transition: transform 0.2s ease;
            filter: brightness(1.1);
        }
        
        /* 로그인 아이콘 스타일 */
        .login-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
            text-decoration: none;
        }
        
        .login-icon-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.5);
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
        }

        .card-soft {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #db2777, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f3f4f6;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        .user-type-btn {
            background: white;
            border: 3px solid #e5e7eb;
            border-radius: 20px;
            padding: 28px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-type-btn:hover {
            border-color: #ec4899;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 28px rgba(236, 72, 153, 0.2);
        }
        
        .user-type-btn.selected {
            border-color: #ec4899;
            border-width: 5px;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #fae8ff 100%);
            box-shadow: 0 12px 32px rgba(236, 72, 153, 0.45), 0 0 0 4px rgba(236, 72, 153, 0.1);
            transform: translateY(-4px) scale(1.05);
            position: relative;
        }
        
        .user-type-btn.selected::before {
            content: '✓ 선택됨';
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.4);
        }
        
        .user-type-btn.selected:hover {
            transform: translateY(-6px) scale(1.06);
            box-shadow: 0 16px 40px rgba(236, 72, 153, 0.5), 0 0 0 4px rgba(236, 72, 153, 0.15);
        }

        .social-btn {
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .kakao-btn {
            background: #FEE500;
            color: #000000;
            border: 2px solid #FEE500;
        }

        .kakao-btn:hover {
            background: #fdd835;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(254, 229, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        /* 로딩 스피너 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #ec4899;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 에러 메시지 */
        .error-message {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            animation: shake 0.5s ease-in-out;
        }

        .error-message.active {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* 모바일 최적화 */
        @media (max-width: 640px) {
            .logo-container img {
                height: 32px !important;
            }
            
            header .logo-container {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
            }

            .card-soft {
                border-radius: 20px;
                padding: 24px !important;
            }

            .input-field {
                font-size: 16px;
                padding: 12px 14px;
            }
            
            .user-type-btn {
                padding: 16px;
                min-height: 160px;
            }
            
            .user-type-btn.selected::before {
                font-size: 10px;
                padding: 3px 8px;
                top: 8px;
                right: 8px;
            }

            h2 {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <!-- 헤더 (v2.8.8.1.59 - 로고 크기 조정 + 헤더 높이 축소) -->
    <header class="py-3 px-4 border-b border-gray-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- 왼쪽 홈 버튼 -->
            <a href="index.html" class="text-gray-600 hover:text-primary-500 transition-colors" rel="nofollow">
                <i class="fas fa-home mr-1"></i>홈으로
            </a>
            
            <!-- 가운데 로고 (v2.8.13.6.86 - SEO: h1 + alt + width/height) -->
            <h1 style="margin: 0; padding: 0; position: absolute; left: 50%; transform: translateX(-50%);">
                <a href="index.html" class="logo-container" style="display: flex; align-items: center; justify-content: center;" title="Beautyket 홈으로 이동">
                    <img src="images/beautyket-logo-full.png?v=2025122404" 
                         alt="Beautyket - 피부관리실 견적비교 플랫폼" 
                         width="96" 
                         height="32"
                         class="beautyket-main-logo" 
                         loading="eager" 
                         decoding="async" 
                         style="height: 32px !important; width: auto !important;">
                </a>
            </h1>
            
            <!-- 오른쪽 로그인 아이콘 -->
            <a href="login.html" class="login-icon-btn" title="로그인" rel="nofollow">
                <i class="fas fa-user-circle"></i>
            </a>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-2xl mx-auto px-4 pb-12">
        <div class="card-soft p-8 animate-fade-in-up">
            <!-- 제목 -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">회원가입</h2>
                <p class="text-gray-600">BeautyCat과 함께 시작하세요</p>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText"></span>
            </div>

            <!-- 카카오 간편가입 (고객 전용 - v2.8.8.1.78) -->
            <div id="kakaoRegisterSection" class="mb-8">
                <button type="button" 
                        id="kakaoRegisterBtn"
                        onclick="registerWithKakao()" 
                        class="social-btn kakao-btn w-full">
                    <i class="fas fa-comment mr-2"></i>
                    카카오로 3초 만에 가입하기
                </button>
                <p class="text-center text-xs text-gray-500 mt-2">
                    💡 카카오 간편가입은 <strong>고객 전용</strong>입니다
                </p>
            </div>

            <div id="orDivider" class="relative mb-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500 font-medium">또는 이메일로 가입</span>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <form id="registerForm" class="space-y-5">
                <!-- 사용자 유형 - 강조 -->
                <div class="p-6 bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl border-2 border-pink-200 mb-6">
                    <label class="block text-lg font-bold text-gray-900 mb-2 text-center">
                        <i class="fas fa-user-circle mr-2 text-pink-500"></i>
                        먼저 선택해주세요! 👇
                    </label>
                    <p class="text-center text-sm text-gray-600 mb-4 font-medium">
                        고객이신가요? 피부관리실 운영자이신가요?
                    </p>
                    <div class="grid grid-cols-2 gap-4">
                        <button type="button" 
                                class="user-type-btn selected" 
                                data-type="customer"
                                onclick="selectUserType('customer', this)">
                            <div class="text-center">
                                <i class="fas fa-user text-4xl mb-3" style="color: #ec4899;"></i>
                                <div class="text-lg font-bold text-gray-900">🙋‍♀️ 고객</div>
                                <div class="text-sm text-gray-600 mt-2 font-medium">피부관리를<br>받고 싶어요</div>
                            </div>
                        </button>
                        <button type="button" 
                                class="user-type-btn" 
                                data-type="shop"
                                onclick="selectUserType('shop', this)">
                            <div class="text-center">
                                <i class="fas fa-store text-4xl mb-3" style="color: #a855f7;"></i>
                                <div class="text-lg font-bold text-gray-900">🏪 피부관리실</div>
                                <div class="text-sm text-gray-600 mt-2 font-medium">피부관리실을<br>운영해요</div>
                            </div>
                        </button>
                    </div>
                    <input type="hidden" id="userType" value="customer">
                </div>

                <!-- 이름 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-user mr-1 text-primary-500"></i>
                        이름
                    </label>
                    <input type="text" 
                           id="name" 
                           class="input-field" 
                           placeholder="홍길동" 
                           required>
                </div>

                <!-- 이메일 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-1 text-primary-500"></i>
                        이메일
                    </label>
                    <input type="email" 
                           id="email" 
                           class="input-field" 
                           placeholder="example@beautycat.kr" 
                           required>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-lock mr-1 text-primary-500"></i>
                        비밀번호
                    </label>
                    <input type="password" 
                           id="password" 
                           class="input-field" 
                           placeholder="8자 이상 입력하세요" 
                           required 
                           minlength="8">
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>
                        영문, 숫자 포함 8자 이상
                    </p>
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-check-circle mr-1 text-primary-500"></i>
                        비밀번호 확인
                    </label>
                    <input type="password" 
                           id="passwordConfirm" 
                           class="input-field" 
                           placeholder="비밀번호를 다시 입력하세요" 
                           required>
                </div>

                <!-- 전화번호 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-phone mr-1 text-primary-500"></i>
                        전화번호
                    </label>
                    <input type="tel" 
                           id="phone" 
                           class="input-field" 
                           placeholder="010-1234-5678" 
                           required>
                </div>

                <!-- 약관 동의 -->
                <div class="space-y-3 pt-4 border-t border-gray-200">
                    <label class="flex items-start cursor-pointer group">
                        <input type="checkbox" 
                               id="agreeAll" 
                               class="mt-1 mr-3" 
                               onchange="toggleAllAgreements(this)">
                        <span class="text-sm font-semibold text-gray-900 group-hover:text-primary-500">
                            <i class="fas fa-check-double mr-1 text-primary-500"></i>
                            전체 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreeTerms" 
                               class="mt-1 mr-3 agree-checkbox" 
                               required>
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            <a href="legal/terms.html" target="_blank" class="text-primary-500 hover:underline">[필수]</a>
                            이용약관 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreePrivacy" 
                               class="mt-1 mr-3 agree-checkbox" 
                               required>
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            <a href="legal/privacy.html" target="_blank" class="text-primary-500 hover:underline">[필수]</a>
                            개인정보처리방침 동의
                        </span>
                    </label>
                    
                    <label class="flex items-start cursor-pointer group pl-6">
                        <input type="checkbox" 
                               id="agreeMarketing" 
                               class="mt-1 mr-3 agree-checkbox">
                        <span class="text-sm text-gray-700 group-hover:text-primary-500">
                            [선택] 마케팅 정보 수신 동의
                        </span>
                    </label>
                </div>

                <!-- 회원가입 버튼 -->
                <button type="submit" 
                        id="registerBtn"
                        class="btn-primary w-full py-4 text-lg font-bold rounded-xl mt-6">
                    <i class="fas fa-user-plus mr-2"></i>
                    회원가입
                </button>
            </form>

            <!-- 로그인 링크 -->
            <div class="text-center mt-6">
                <span class="text-gray-600">이미 계정이 있으신가요?</span>
                <a href="login.html" class="text-primary-500 font-semibold hover:underline ml-2">
                    로그인
                </a>
            </div>
        </div>
    </main>

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="bg-white rounded-lg p-6 text-center">
            <div class="spinner mx-auto mb-4"></div>
            <p class="text-gray-700 font-medium">가입 중...</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/config.js?v=2.5.4"></script>
    <!-- auto-matching.js 제거됨 (v2.8.8.1.77.3) -->
    <script src="js/auth.js?v=2.8.13"></script>
    <script src="js/kakao-login.js"></script>

    <script>
        // 사용자 유형 선택 (v2.8.8.1.78 업데이트)
        function selectUserType(type, button) {
            document.getElementById('userType').value = type;
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            if (button) {
                button.classList.add('selected');
            }
            
            // 🎯 카카오 간편가입 표시/숨김 처리
            const kakaoSection = document.getElementById('kakaoRegisterSection');
            const orDivider = document.getElementById('orDivider');
            
            if (type === 'customer') {
                // 고객: 카카오 간편가입 표시
                kakaoSection.style.display = 'block';
                orDivider.style.display = 'block';
            } else {
                // 업체: 카카오 간편가입 숨김
                kakaoSection.style.display = 'none';
                orDivider.style.display = 'none';
            }
        }

        // 전체 동의 토글
        function toggleAllAgreements(checkbox) {
            const checkboxes = document.querySelectorAll('.agree-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
            });
        }

        // 개별 체크박스 감지
        document.addEventListener('DOMContentLoaded', function() {
            // 🎯 URL 파라미터 처리 (v2.8.8.1.79)
            const urlParams = new URLSearchParams(window.location.search);
            const userTypeParam = urlParams.get('type');
            
            if (userTypeParam === 'shop') {
                // 업체 회원가입: 고객/업체 선택 버튼 숨김, 카카오 간편가입 숨김
                selectUserType('shop', document.querySelector('[data-type="shop"]'));
                
                // 사용자 유형 선택 섹션 숨김
                const userTypeSection = document.querySelector('.p-6.bg-gradient-to-r.from-pink-50');
                if (userTypeSection) {
                    userTypeSection.style.display = 'none';
                }
                
                // 타이틀 변경
                const titleElement = document.querySelector('h2.text-3xl');
                if (titleElement) {
                    titleElement.innerHTML = '<i class="fas fa-store mr-2 text-purple-500"></i>업체 회원가입';
                }
                
                // 설명 변경
                const descElement = document.querySelector('p.text-gray-600');
                if (descElement) {
                    descElement.textContent = '피부관리실 업체 회원 등록';
                }
                
                // 로그인 링크도 업체용으로 변경
                const loginLink = document.querySelector('a[href="login.html"]');
                if (loginLink) {
                    loginLink.href = 'login.html?type=shop';
                }
                
                console.log('🏪 업체 회원가입 모드');
            } else if (userTypeParam === 'customer') {
                // 고객 회원가입: 기본 표시 (카카오 간편가입 표시)
                selectUserType('customer', document.querySelector('[data-type="customer"]'));
                
                // 사용자 유형 선택 섹션 숨김
                const userTypeSection = document.querySelector('.p-6.bg-gradient-to-r.from-pink-50');
                if (userTypeSection) {
                    userTypeSection.style.display = 'none';
                }
                
                // 타이틀 변경
                const titleElement = document.querySelector('h2.text-3xl');
                if (titleElement) {
                    titleElement.innerHTML = '<i class="fas fa-user mr-2 text-pink-500"></i>고객 회원가입';
                }
                
                // 설명 변경
                const descElement = document.querySelector('p.text-gray-600');
                if (descElement) {
                    descElement.textContent = 'BeautyCat 고객 회원 가입';
                }
                
                // 로그인 링크도 고객용으로 변경
                const loginLink = document.querySelector('a[href="login.html"]');
                if (loginLink) {
                    loginLink.href = 'login.html?type=customer';
                }
                
                console.log('🙋‍♀️ 고객 회원가입 모드');
            }
            
            const agreeCheckboxes = document.querySelectorAll('.agree-checkbox');
            const agreeAll = document.getElementById('agreeAll');
            
            agreeCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const allChecked = Array.from(agreeCheckboxes)
                        .filter(c => c.required)
                        .every(c => c.checked);
                    agreeAll.checked = allChecked;
                });
            });
        });

        // 에러 메시지 표시 함수 (v2.8.13.6.69)
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('active');
            
            // 5초 후 자동 숨김
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 5000);
        }

        // 로딩 표시 함수
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
            document.getElementById('registerBtn').disabled = true;
            if (document.getElementById('kakaoRegisterBtn')) {
                document.getElementById('kakaoRegisterBtn').disabled = true;
            }
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
            document.getElementById('registerBtn').disabled = false;
            if (document.getElementById('kakaoRegisterBtn')) {
                document.getElementById('kakaoRegisterBtn').disabled = false;
            }
        }

        // 회원가입 폼 제출
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const phone = document.getElementById('phone').value.trim();
            const userType = document.getElementById('userType').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const agreePrivacy = document.getElementById('agreePrivacy').checked;
            
            // 유효성 검사
            if (!name || !email || !password || !phone) {
                showError('모든 필수 항목을 입력해주세요.');
                return;
            }
            
            if (password !== passwordConfirm) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            if (password.length < 8) {
                showError('비밀번호는 8자 이상이어야 합니다.');
                return;
            }
            
            if (!agreeTerms || !agreePrivacy) {
                showError('필수 약관에 동의해주세요.');
                return;
            }
            
            showLoading();
            
            try {
                // 회원가입 함수 호출 (auth.js에서 정의됨)
                await register({
                    name: name,
                    email: email,
                    password: password,
                    phone: phone,
                    user_type: userType
                });
            } catch (error) {
                console.error('회원가입 오류:', error);
                hideLoading();
                showError('회원가입에 실패했습니다. 다시 시도해주세요.');
            }
        });

        // 카카오 회원가입
        function registerWithKakao() {
            if (typeof startKakaoLogin === 'function') {
                showLoading();
                try {
                    startKakaoLogin();
                } catch (error) {
                    hideLoading();
                    showError('카카오 간편가입 중 오류가 발생했습니다.');
                }
            } else {
                showError('카카오 간편가입 기능을 준비 중입니다.');
            }
        }
    </script>
</body>
</html>
