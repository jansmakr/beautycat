<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyCat 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-rose-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-pink-600 mb-2">🐱 BeautyCat</h1>
            <p class="text-gray-600">피부관리실 견적 플랫폼</p>
        </div>

        <!-- 테스트 계정 안내 -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-sm">
            <p class="font-semibold text-blue-900 mb-2">🧪 테스트 계정</p>
            <div class="space-y-1 text-blue-800">
                <p><strong>Shop:</strong> shop@beautycat.kr / shop123</p>
                <p><strong>Admin:</strong> jansmakr@gmail.com / admin123</p>
                <p><strong>Customer:</strong> customer@test.com / test123</p>
            </div>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                <input type="email" id="email" 
                       value="shop@beautycat.kr"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                       required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                <input type="password" id="password" 
                       value="shop123"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                       required>
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 px-4 rounded-lg hover:from-pink-600 hover:to-rose-600 font-semibold shadow-md transition duration-200">
                🔐 로그인
            </button>
        </form>

        <!-- 결과 메시지 -->
        <div id="message" class="mt-4 hidden"></div>

        <!-- 디버그 로그 -->
        <div id="debug" class="mt-4 p-3 bg-gray-50 rounded-lg text-xs text-gray-600 max-h-32 overflow-auto"></div>
    </div>

    <!-- Config.js 로드 -->
    <script src="js/config.js"></script>
    <script src="js/custom-alert.js"></script>

    <script>
        // 로그인 처리
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            log('로그인 시도:', email);
            showMessage('로그인 중...', 'info');
            
            try {
                // API에서 사용자 정보 가져오기
                const data = await apiCall('/tables/users');
                log('사용자 데이터 받음:', data.total + '명');
                
                // 이메일과 비밀번호 확인
                const user = data.data.find(u => 
                    u.email === email && u.password === password
                );
                
                if (!user) {
                    throw new Error('이메일 또는 비밀번호가 일치하지 않습니다.');
                }
                
                log('로그인 성공:', user.name);
                
                // Shop 타입 사용자의 경우 shop_id 설정
                if (user.user_type === 'shop') {
                    user.shop_id = user.shop_id || user.id;
                }
                
                              // 세션 저장
                Session.set(user);
                
                // 관리자의 경우 추가 인증 설정
                if (user.user_type === 'admin') {
                    localStorage.setItem('adminAuth', 'true');
                    localStorage.setItem('adminLoginTime', Date.now().toString());
                    log('관리자 인증 설정 완료');
                }
                
                showMessage(`환영합니다, ${user.name}님! 🎉`, 'success');

                
                // Dashboard로 이동
                setTimeout(() => {
                    if (user.user_type === 'shop') {
                        window.location.href = 'shop-dashboard-v2.html';
                    } else if (user.user_type === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (user.user_type === 'customer') {
                        window.location.href = 'customer-dashboard-v2.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
                
            } catch (error) {
                log('로그인 실패:', error.message);
                showMessage('❌ ' + error.message, 'error');
            }
        });
        
        // 메시지 표시 함수 - 검정색 텍스트 강제 적용
        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            const colors = {
                success: 'bg-green-100 border-green-400',
                error: 'bg-red-100 border-red-400',
                info: 'bg-blue-100 border-blue-400'
            };
            
            messageDiv.className = `p-4 rounded-lg border ${colors[type]}`;
            messageDiv.style.color = '#000000';
            messageDiv.style.fontWeight = '600';
            messageDiv.textContent = text;
            messageDiv.classList.remove('hidden');
        }
        
        // 디버그 로그 표시
        const originalLog = window.log;
        window.log = function(message, data) {
            originalLog(message, data);
            const debugDiv = document.getElementById('debug');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        };
        
        log('로그인 페이지 로드 완료');
    </script>
</body>
</html>
