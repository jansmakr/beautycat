<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyCat 로그인</title>
    
    <!-- 🌍 글로벌 설정 (최우선 로드) -->
    <script src="js/global-config.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-rose-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-pink-600 mb-2">🐱 BeautyCat</h1>
            <p class="text-gray-600">피부관리실 견적 플랫폼</p>
        </div>

        <!-- 테스트 계정 안내 -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-sm">
            <p class="font-semibold text-blue-900 mb-2">🧪 테스트 계정</p>
            <div class="space-y-1 text-blue-800">
                <p><strong>Shop:</strong> shop@beautycat.kr / shop123</p>
                <p><strong>Admin:</strong> jansmakr@gmail.com / admin123</p>
                <p><strong>Customer:</strong> customer@test.com / test123</p>
            </div>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                <input type="email" id="email" 
                       value="shop@beautycat.kr"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                       required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                <input type="password" id="password" 
                       value="shop123"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"
                       required>
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 px-4 rounded-lg hover:from-pink-600 hover:to-rose-600 font-semibold shadow-md transition duration-200">
                🔐 로그인
            </button>
        </form>

        <!-- 회원가입 링크 -->
        <p class="text-center mt-6 text-sm text-gray-600">
            계정이 없으신가요? <a href="register.html" class="text-pink-600 hover:text-pink-700 font-medium">회원가입</a>
        </p>
    </div>

    <!-- Config.js 로드 -->
    <script src="js/config.js"></script>
    <script src="js/custom-alert.js"></script>

    <script>
        // 🔐 로그인 처리
        const originalLog = console.log;

        function log(...args) {
            originalLog.apply(console, args);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            log('🔐 로그인 시도:', email);
            
            try {
                // API 호출
                const apiUrl = window.CONFIG?.API_BASE_URL || window.CLOUDFLARE_API?.baseUrl || 'https://beautycat-api-v3.jansmakr.workers.dev/api';
                const response = await fetch(`${apiUrl}/tables/users?limit=100`);
                
                if (!response.ok) {
                    throw new Error('사용자 데이터를 불러올 수 없습니다');
                }
                
                const data = await response.json();
                log('📊 사용자 데이터:', data);
                
                // 사용자 찾기
                const users = data.data || data;
                const user = users.find(u => {
                    const userEmail = u.email || u.이메일 || u.Email;
                    const userPassword = u.password || u.비밀번호 || u.Password;
                    return userEmail === email && userPassword === password;
                });
                
                if (user) {
                    log('✅ 로그인 성공:', user);
                    
                    // 세션 저장
                    localStorage.setItem('beautycat_token', 'demo_token_' + Date.now());
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    // Admin 사용자인 경우 추가 인증 설정
                    const userType = user.user_type || user.사용자_유형 || user.UserType;
                    if (userType === 'admin' || userType === '관리자') {
                        localStorage.setItem('adminAuth', 'true');
                        localStorage.setItem('adminLoginTime', Date.now().toString());
                        log('✅ 관리자 인증 설정 완료');
                    }
                    
                    // 사용자 유형별 리다이렉트
                    if (userType === 'customer' || userType === '고객') {
                        log('🎯 고객 대시보드로 이동');
                        window.location.href = 'customer-dashboard-v2.html';
                    } else if (userType === 'shop' || userType === '샵' || userType === '업체') {
                        log('🎯 샵 대시보드로 이동');
                        window.location.href = 'shop-dashboard-v2.html';
                    } else if (userType === 'admin' || userType === '관리자') {
                        log('🎯 관리자 대시보드로 이동');
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        log('⚠️ 알 수 없는 사용자 유형:', userType);
                        alert('알 수 없는 사용자 유형입니다');
                    }
                } else {
                    log('❌ 로그인 실패: 사용자를 찾을 수 없음');
                    alert('이메일 또는 비밀번호가 올바르지 않습니다');
                }
                
            } catch (error) {
                log('🚨 로그인 오류:', error);
                alert('로그인 중 오류가 발생했습니다: ' + error.message);
            }
        });
        
        log('✅ 로그인 페이지 로드 완료');
    </script>
</body>
</html>
