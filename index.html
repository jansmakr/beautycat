        // 1. ?��?지 ?�이지 로딩 (Intersection Observer)
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            observer.unobserve(img);
                        }
                    }
                });
            });
            
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('img[data-src]').forEach(img => imageObserver.observe(img));
            });
        }
        
        // 2. ?�크�??�능 최적??(Throttle)
        let scrollTimeout;
        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
                scrollTimeout = null;
                lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;
            }, 10);
        }, { passive: true });
        
        // 3. 모바?????�환 ?�니메이??최적??        function scrollToTop() {
            // requestAnimationFrame?�로 부?�러???�크�?(GPU 가??
            const start = window.pageYOffset;
            const startTime = performance.now();
            const duration = 250; // 250ms�????�축
            
            function scroll(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = progress * (2 - progress); // easeOutQuad
                
                window.scrollTo(0, start * (1 - easeProgress));
                
                if (progress < 1) {
                    requestAnimationFrame(scroll);
                }
            }
            
            requestAnimationFrame(scroll);
        }
        
        // 4. ?�정 ?�션?�로 빠른 ?�크�?(???�환 최적??
        function fastScrollTo(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const targetPosition = element.getBoundingClientRect().top + window.pageYOffset - 80; // ?�더 ?�이 고려
            const startPosition = window.pageYOffset;
            const distance = targetPosition - startPosition;
            const startTime = performance.now();
            const duration = 250; // 250ms
            
            function animation(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = progress * (2 - progress); // easeOutQuad
                
                window.scrollTo(0, startPosition + (distance * easeProgress));
                
                if (progress < 1) {
                    requestAnimationFrame(animation);
                }
            }
            
            requestAnimationFrame(animation);
        }
