        // 1. ?´ë?ì§€ ?ˆì´ì§€ ë¡œë”© (Intersection Observer)
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            observer.unobserve(img);
                        }
                    }
                });
            });
            
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('img[data-src]').forEach(img => imageObserver.observe(img));
            });
        }
        
        // 2. ?¤í¬ë¡??±ëŠ¥ ìµœì ??(Throttle)
        let scrollTimeout;
        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
                scrollTimeout = null;
                lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;
            }, 10);
        }, { passive: true });
        
        // 3. ëª¨ë°”?????„í™˜ ? ë‹ˆë©”ì´??ìµœì ??        function scrollToTop() {
            // requestAnimationFrame?¼ë¡œ ë¶€?œëŸ¬???¤í¬ë¡?(GPU ê°€??
            const start = window.pageYOffset;
            const startTime = performance.now();
            const duration = 250; // 250msë¡????¨ì¶•
            
            function scroll(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = progress * (2 - progress); // easeOutQuad
                
                window.scrollTo(0, start * (1 - easeProgress));
                
                if (progress < 1) {
                    requestAnimationFrame(scroll);
                }
            }
            
            requestAnimationFrame(scroll);
        }
        
        // 4. ?¹ì • ?¹ì…˜?¼ë¡œ ë¹ ë¥¸ ?¤í¬ë¡?(???„í™˜ ìµœì ??
        function fastScrollTo(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const targetPosition = element.getBoundingClientRect().top + window.pageYOffset - 80; // ?¤ë” ?’ì´ ê³ ë ¤
            const startPosition = window.pageYOffset;
            const distance = targetPosition - startPosition;
            const startTime = performance.now();
            const duration = 250; // 250ms
            
            function animation(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = progress * (2 - progress); // easeOutQuad
                
                window.scrollTo(0, startPosition + (distance * easeProgress));
                
                if (progress < 1) {
                    requestAnimationFrame(animation);
                }
            }
            
            requestAnimationFrame(animation);
        }

        } else {
            // ?´ë°±: Intersection Observer
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src || img.src;
                        img.classList.remove('lazy');
                        observer.unobserve(img);

            });

            });
        }
