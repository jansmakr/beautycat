name = "beautycat-api"
main = "cloudflare-workers-beautycat.js"
compatibility_date = "2024-10-31"

# Custom Domain Routes
routes = [
    { pattern = "api.beautycat.kr/*", zone_name = "beautycat.kr" }
]

# CORS 설정
[observability]
enabled = true

# D1 Database Binding
[[d1_databases]]
binding = "BEAUTYCAT_DB"
database_name = "beautycat-db"
database_id = "4f238e14-6813-4667-a10b-77a02c75abdf"

# 프로덕션 환경 설정
[env.production]
name = "beautycat-api"

[[env.production.d1_databases]]
binding = "BEAUTYCAT_DB"
database_name = "beautycat-db"
database_id = "4f238e14-6813-4667-a10b-77a02c75abdf"
