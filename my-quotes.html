<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>받은 견적서 - BeautyCat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .quote-card {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .quote-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-completed { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <button onclick="history.back()" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">받은 견적서</h1>
                        <p class="text-sm text-gray-500">업체에서 보낸 견적서를 확인하고 선택하세요</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="customer-name" class="font-medium"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">전체 견적서</p>
                        <p id="stat-total" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-invoice text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">검토 필요</p>
                        <p id="stat-pending" class="text-3xl font-bold text-yellow-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">수락함</p>
                        <p id="stat-accepted" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">거절함</p>
                        <p id="stat-rejected" class="text-3xl font-bold text-red-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-times-circle text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 필터 -->
        <div class="card mb-8">
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-700 mr-2">상태:</label>
                    <select id="status-filter" class="border rounded-lg px-4 py-2" onchange="filterQuotes()">
                        <option value="all">전체</option>
                        <option value="pending">검토 필요</option>
                        <option value="accepted">수락함</option>
                        <option value="rejected">거절함</option>
                        <option value="completed">완료</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mr-2">정렬:</label>
                    <select id="sort-filter" class="border rounded-lg px-4 py-2" onchange="filterQuotes()">
                        <option value="newest">최신순</option>
                        <option value="oldest">오래된순</option>
                        <option value="price-low">가격 낮은순</option>
                        <option value="price-high">가격 높은순</option>
                    </select>
                </div>
                <div class="ml-auto">
                    <button onclick="refreshQuotes()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-sync-alt mr-2"></i>새로고침
                    </button>
                </div>
            </div>
        </div>

        <!-- 로딩 -->
        <div id="loading" class="text-center py-16">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
            <p class="text-gray-600">로딩중...</p>
        </div>

        <!-- 견적서 목록 -->
        <div id="quotes-container" class="hidden">
            <div id="quotes-list" class="space-y-6">
                <!-- 동적으로 로드됩니다 -->
            </div>

            <!-- 빈 상태 -->
            <div id="empty-state" class="hidden text-center py-16">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg mb-4">받은 견적서가 없습니다.</p>
                <button onclick="goToRequestPage()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-plus mr-2"></i>
                    상담 신청하기
                </button>
            </div>
        </div>

    </main>

    <!-- 견적서 상세 모달 -->
    <div id="quote-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold">견적서 상세</h2>
                <button onclick="closeQuoteModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <!-- 업체 정보 -->
                <div class="mb-6 p-4 bg-blue-50 rounded-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 id="modal-shop-name" class="font-bold text-lg text-blue-900"></h3>
                            <p id="modal-treatment-type" class="text-blue-700"></p>
                        </div>
                        <span id="modal-status" class="status-badge"></span>
                    </div>
                </div>

                <!-- 견적 내용 -->
                <div class="space-y-4 mb-6">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">관리 내용</p>
                        <p id="modal-description" class="font-medium"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                        <div>
                            <p class="text-sm text-gray-500 mb-1">가격</p>
                            <p id="modal-price" class="text-2xl font-bold text-blue-600"></p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 mb-1">소요 시간</p>
                            <p id="modal-duration" class="text-lg font-medium"></p>
                        </div>
                    </div>

                    <div>
                        <p class="text-sm text-gray-500 mb-1">가능한 일정</p>
                        <p id="modal-dates" class="font-medium"></p>
                    </div>

                    <div id="modal-notes-container" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded">
                        <p class="text-sm text-gray-700">
                            <i class="fas fa-info-circle text-yellow-600 mr-2"></i>
                            <span id="modal-notes"></span>
                        </p>
                    </div>

                    <div class="text-xs text-gray-500 pt-4 border-t">
                        <p>발송일: <span id="modal-created"></span></p>
                        <p>유효기간: <span id="modal-valid"></span></p>
                    </div>
                </div>

                <!-- 액션 버튼 -->
                <div id="modal-actions" class="flex space-x-3">
                    <button onclick="acceptQuote()" class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-medium">
                        <i class="fas fa-check mr-2"></i>
                        수락하기
                    </button>
                    <button onclick="rejectQuote()" class="flex-1 bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 font-medium">
                        <i class="fas fa-times mr-2"></i>
                        거절하기
                    </button>
                </div>

                <div id="modal-accepted" class="hidden bg-green-50 border border-green-200 rounded-lg p-4 text-center">
                    <i class="fas fa-check-circle text-green-600 text-3xl mb-2"></i>
                    <p class="text-green-800 font-medium">이미 수락한 견적서입니다</p>
                </div>

                <div id="modal-rejected" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-center">
                    <i class="fas fa-times-circle text-red-600 text-3xl mb-2"></i>
                    <p class="text-red-800 font-medium">거절한 견적서입니다</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let currentCustomer = null;
        let allQuotes = [];
        let filteredQuotes = [];
        let selectedQuote = null;

        // 세션 확인
        function checkSession() {
            const user = JSON.parse(localStorage.getItem('beautycat_user') || '{}');
            if (!user.id || user.user_type !== 'customer') {
                alert('로그인이 필요합니다.');
                window.location.href = 'login-clean.html';
                return null;
            }
            return user;
        }

        // 페이지 이동
        function goToRequestPage() {
            window.location.href = 'consultation-request.html';
        }

        // 견적서 로드
        async function loadQuotes() {
            try {
                const response = await fetch(`${API_BASE}/tables/quotes`);
                const data = await response.json();
                
                // 현재 고객의 견적서만 필터링
                allQuotes = (data.data || []).filter(q => q.customer_id === currentCustomer.id);
                filteredQuotes = [...allQuotes];
                
                updateStats();
                filterQuotes();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('quotes-container').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading quotes:', error);
                alert('견적서를 불러오는데 실패했습니다.');
            }
        }

        // 통계 업데이트
        function updateStats() {
            const stats = {
                total: allQuotes.length,
                pending: allQuotes.filter(q => q.status === 'pending').length,
                accepted: allQuotes.filter(q => q.status === 'accepted').length,
                rejected: allQuotes.filter(q => q.status === 'rejected').length
            };

            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-accepted').textContent = stats.accepted;
            document.getElementById('stat-rejected').textContent = stats.rejected;
        }

        // 필터 & 정렬
        function filterQuotes() {
            const statusFilter = document.getElementById('status-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;

            // 상태 필터링
            filteredQuotes = statusFilter === 'all' 
                ? [...allQuotes]
                : allQuotes.filter(q => q.status === statusFilter);

            // 정렬
            switch(sortFilter) {
                case 'newest':
                    filteredQuotes.sort((a, b) => b.created_at - a.created_at);
                    break;
                case 'oldest':
                    filteredQuotes.sort((a, b) => a.created_at - b.created_at);
                    break;
                case 'price-low':
                    filteredQuotes.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredQuotes.sort((a, b) => b.price - a.price);
                    break;
            }

            displayQuotes();
        }

        // 견적서 표시
        function displayQuotes() {
            const list = document.getElementById('quotes-list');
            const empty = document.getElementById('empty-state');

            if (filteredQuotes.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            list.innerHTML = filteredQuotes.map(quote => `
                <div class="quote-card card">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <h3 class="font-bold text-lg">${quote.treatment_type}</h3>
                                <span class="status-badge status-${quote.status}">${getStatusText(quote.status)}</span>
                            </div>
                            <p class="text-sm text-gray-500">${quote.shop_name}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-blue-600">${quote.price.toLocaleString()}원</p>
                            <p class="text-sm text-gray-500">${quote.duration}</p>
                        </div>
                    </div>

                    <p class="text-gray-700 mb-4">${quote.description}</p>

                    <div class="grid grid-cols-2 gap-3 bg-gray-50 rounded-lg p-3 mb-4">
                        <div>
                            <p class="text-xs text-gray-500">가능한 일정</p>
                            <p class="text-sm font-medium">${quote.available_dates}</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">유효기간</p>
                            <p class="text-sm font-medium">${new Date(quote.valid_until).toLocaleDateString()}</p>
                        </div>
                    </div>

                    <div class="flex space-x-2">
                        <button onclick="openQuoteModal('${quote.id}')" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            <i class="fas fa-eye mr-2"></i>상세보기
                        </button>
                        ${quote.status === 'pending' ? `
                            <button onclick="quickAccept('${quote.id}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                                <i class="fas fa-check"></i>
                            </button>
                            <button onclick="quickReject('${quote.id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                                <i class="fas fa-times"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 견적서 상세 모달 열기
        function openQuoteModal(quoteId) {
            selectedQuote = allQuotes.find(q => q.id === quoteId);
            if (!selectedQuote) return;

            // 정보 채우기
            document.getElementById('modal-shop-name').textContent = selectedQuote.shop_name;
            document.getElementById('modal-treatment-type').textContent = selectedQuote.treatment_type;
            
            const statusBadge = document.getElementById('modal-status');
            statusBadge.textContent = getStatusText(selectedQuote.status);
            statusBadge.className = `status-badge status-${selectedQuote.status}`;

            document.getElementById('modal-description').textContent = selectedQuote.description;
            document.getElementById('modal-price').textContent = `${selectedQuote.price.toLocaleString()}원`;
            document.getElementById('modal-duration').textContent = selectedQuote.duration;
            document.getElementById('modal-dates').textContent = selectedQuote.available_dates;

            if (selectedQuote.additional_notes) {
                document.getElementById('modal-notes').textContent = selectedQuote.additional_notes;
                document.getElementById('modal-notes-container').classList.remove('hidden');
            } else {
                document.getElementById('modal-notes-container').classList.add('hidden');
            }

            document.getElementById('modal-created').textContent = new Date(selectedQuote.created_at).toLocaleDateString();
            document.getElementById('modal-valid').textContent = new Date(selectedQuote.valid_until).toLocaleDateString();

            // 버튼 표시/숨김
            if (selectedQuote.status === 'pending') {
                document.getElementById('modal-actions').classList.remove('hidden');
                document.getElementById('modal-accepted').classList.add('hidden');
                document.getElementById('modal-rejected').classList.add('hidden');
            } else if (selectedQuote.status === 'accepted') {
                document.getElementById('modal-actions').classList.add('hidden');
                document.getElementById('modal-accepted').classList.remove('hidden');
                document.getElementById('modal-rejected').classList.add('hidden');
            } else if (selectedQuote.status === 'rejected') {
                document.getElementById('modal-actions').classList.add('hidden');
                document.getElementById('modal-accepted').classList.add('hidden');
                document.getElementById('modal-rejected').classList.remove('hidden');
            }

            document.getElementById('quote-modal').classList.remove('hidden');
        }

        // 모달 닫기
        function closeQuoteModal() {
            document.getElementById('quote-modal').classList.add('hidden');
            selectedQuote = null;
        }

        // 견적서 수락
        async function acceptQuote() {
            if (!selectedQuote) return;

            if (confirm(`${selectedQuote.shop_name}의 견적서를 수락하시겠습니까?\n\n가격: ${selectedQuote.price.toLocaleString()}원`)) {
                try {
                    const response = await fetch(`${API_BASE}/tables/quotes/${selectedQuote.id}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ status: 'accepted' })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || '견적서 수락 실패');
                    }

                    const updatedQuote = await response.json();
                    console.log('견적서 수락 성공:', updatedQuote);
                    
                    alert('견적서를 수락했습니다!\n\n업체에서 연락드릴 예정입니다.');
                    closeQuoteModal();
                    await loadQuotes();

                } catch (error) {
                    console.error('견적서 수락 실패:', error);
                    alert('견적서 수락에 실패했습니다: ' + error.message);
                }
            }
        }

        // 견적서 거절
        async function rejectQuote() {
            if (!selectedQuote) return;

            if (confirm(`${selectedQuote.shop_name}의 견적서를 거절하시겠습니까?`)) {
                try {
                    const response = await fetch(`${API_BASE}/tables/quotes/${selectedQuote.id}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ status: 'rejected' })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || '견적서 거절 실패');
                    }

                    const updatedQuote = await response.json();
                    console.log('견적서 거절 성공:', updatedQuote);
                    
                    alert('견적서를 거절했습니다.');
                    closeQuoteModal();
                    await loadQuotes();

                } catch (error) {
                    console.error('견적서 거절 실패:', error);
                    alert('견적서 거절에 실패했습니다: ' + error.message);
                }
            }
        }

        // 빠른 수락
        async function quickAccept(quoteId) {
            selectedQuote = allQuotes.find(q => q.id === quoteId);
            await acceptQuote();
        }

        // 빠른 거절
        async function quickReject(quoteId) {
            selectedQuote = allQuotes.find(q => q.id === quoteId);
            await rejectQuote();
        }

        // 새로고침
        async function refreshQuotes() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('quotes-container').classList.add('hidden');
            await loadQuotes();
        }

        // 상태 텍스트
        function getStatusText(status) {
            const map = {
                'pending': '검토 필요',
                'accepted': '수락함',
                'rejected': '거절함',
                'completed': '완료'
            };
            return map[status] || status;
        }

        // 초기화
        async function init() {
            currentCustomer = checkSession();
            if (!currentCustomer) return;

            document.getElementById('customer-name').textContent = currentCustomer.name;
            await loadQuotes();
        }

        init();
    </script>

</body>
</html>
