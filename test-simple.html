<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beautycat (뷰티+에티켓) - 테스트 페이지</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ff2d92 0%, #ff6b9d 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .message {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .success {
            color: #4CAF50;
            font-size: 1.5rem;
            margin: 20px 0;
        }
        .info {
            font-size: 1rem;
            line-height: 1.6;
            margin-top: 20px;
        }
        .btn {
            background: white;
            color: #ff2d92;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">beautycat</div>
        <div class="tagline">(뷰티+에티켓) 피부관리실 견적 플랫폼</div>
        
        <div class="message">
            <div class="success">✅ 샌드박스 정상 작동 중!</div>
            
            <div class="info">
                <strong>상담신청만 남기면,<br>
                우리 동네 피부관리실 정보와 견적을<br>
                한번에 받아 볼수 있어요</strong>
            </div>
            
            <div style="margin-top: 30px;">
                <button class="btn" onclick="window.location.href='index.html'">
                    메인 페이지로 이동
                </button>
            </div>
        </div>

        <div style="font-size: 0.9rem; opacity: 0.7;">
            현재 시간: <span id="currentTime"></span><br>
            브라우저: <span id="browserInfo"></span>
        </div>
    </div>

    <script>
        // 현재 시간 표시
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('ko-KR');
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 브라우저 정보
        document.getElementById('browserInfo').textContent = navigator.userAgent.split(' ').pop();

        console.log('🎉 beautycat (뷰티+에티켓) 테스트 페이지 로드 완료!');
        console.log('✅ 샌드박스가 정상적으로 작동하고 있습니다.');
    </script>
</body>
</html>
