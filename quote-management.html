<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>견적서 관리 - BeautyCat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-completed { background: #dbeafe; color: #1e40af; }
        .quote-card {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .quote-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <button onclick="history.back()" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">견적서 관리</h1>
                        <p class="text-sm text-gray-500">작성한 견적서를 관리하세요</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="shop-name" class="font-medium"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">전체 견적서</p>
                        <p id="stat-total" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-invoice text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">대기중</p>
                        <p id="stat-pending" class="text-3xl font-bold text-yellow-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">수락됨</p>
                        <p id="stat-accepted" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">거절됨</p>
                        <p id="stat-rejected" class="text-3xl font-bold text-red-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-times-circle text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 필터 -->
        <div class="card mb-8">
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-700 mr-2">상태:</label>
                    <select id="status-filter" class="border rounded-lg px-4 py-2" onchange="filterQuotes()">
                        <option value="all">전체</option>
                        <option value="pending">대기중</option>
                        <option value="accepted">수락됨</option>
                        <option value="rejected">거절됨</option>
                        <option value="completed">완료</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mr-2">정렬:</label>
                    <select id="sort-filter" class="border rounded-lg px-4 py-2" onchange="filterQuotes()">
                        <option value="newest">최신순</option>
                        <option value="oldest">오래된순</option>
                        <option value="price-high">가격 높은순</option>
                        <option value="price-low">가격 낮은순</option>
                    </select>
                </div>
                <div class="ml-auto">
                    <button onclick="refreshQuotes()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        <i class="fas fa-sync-alt mr-2"></i>새로고침
                    </button>
                </div>
            </div>
        </div>

        <!-- 로딩 -->
        <div id="loading" class="text-center py-16">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
            <p class="text-gray-600">로딩중...</p>
        </div>

        <!-- 견적서 목록 -->
        <div id="quotes-container" class="hidden">
            <div id="quotes-list" class="grid grid-cols-1 gap-6">
                <!-- 동적으로 로드됩니다 -->
            </div>

            <!-- 빈 상태 -->
            <div id="empty-state" class="hidden text-center py-16">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">작성한 견적서가 없습니다.</p>
            </div>
        </div>

    </main>

    <!-- 견적서 수정 모달 -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold">견적서 수정</h2>
                <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="edit-form" class="space-y-4">
                    <input type="hidden" id="edit-quote-id">
                    
                    <div>
                        <label class="block font-medium mb-2">관리 유형 *</label>
                        <input type="text" id="edit-treatment-type" class="w-full border rounded-lg px-4 py-2" readonly>
                    </div>

                    <div>
                        <label class="block font-medium mb-2">관리 내용 *</label>
                        <textarea id="edit-description" class="w-full border rounded-lg px-4 py-2 h-24" required></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-medium mb-2">가격 (원) *</label>
                            <input type="number" id="edit-price" class="w-full border rounded-lg px-4 py-2" required>
                        </div>
                        <div>
                            <label class="block font-medium mb-2">소요 시간 *</label>
                            <input type="text" id="edit-duration" class="w-full border rounded-lg px-4 py-2" required>
                        </div>
                    </div>

                    <div>
                        <label class="block font-medium mb-2">가능한 일정 *</label>
                        <input type="text" id="edit-dates" class="w-full border rounded-lg px-4 py-2" required>
                    </div>

                    <div>
                        <label class="block font-medium mb-2">추가 안내사항</label>
                        <textarea id="edit-notes" class="w-full border rounded-lg px-4 py-2 h-20"></textarea>
                    </div>

                    <div class="flex space-x-3 pt-4">
                        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-medium">
                            <i class="fas fa-save mr-2"></i>
                            저장
                        </button>
                        <button type="button" onclick="closeEditModal()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                            취소
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 상태 변경 모달 -->
    <div id="status-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-md w-full">
            <div class="border-b px-6 py-4">
                <h2 class="text-xl font-bold">상태 변경</h2>
            </div>

            <div class="p-6">
                <input type="hidden" id="status-quote-id">
                
                <div class="mb-4">
                    <p class="text-sm text-gray-600 mb-2">현재 상태:</p>
                    <span id="status-current" class="status-badge"></span>
                </div>

                <div class="mb-6">
                    <label class="block font-medium mb-2">변경할 상태 *</label>
                    <select id="status-new" class="w-full border rounded-lg px-4 py-2">
                        <option value="pending">대기중</option>
                        <option value="accepted">수락됨</option>
                        <option value="rejected">거절됨</option>
                        <option value="completed">완료</option>
                    </select>
                </div>

                <div class="flex space-x-3">
                    <button onclick="updateStatus()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-medium">
                        변경
                    </button>
                    <button onclick="closeStatusModal()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let currentShop = null;
        let allQuotes = [];
        let filteredQuotes = [];

        // 세션 확인
        function checkSession() {
            const user = JSON.parse(localStorage.getItem('beautycat_user') || '{}');
            if (!user.id || user.user_type !== 'shop') {
                alert('로그인이 필요합니다.');
                window.location.href = 'login-clean.html';
                return null;
            }
            return user;
        }

        // 견적서 로드
        async function loadQuotes() {
            try {
                const response = await fetch(`${API_BASE}/tables/quotes?shop_id=${currentShop.id}`);
                const data = await response.json();
                
                allQuotes = data.data || [];
                filteredQuotes = [...allQuotes];
                
                updateStats();
                filterQuotes();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('quotes-container').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading quotes:', error);
                alert('견적서를 불러오는데 실패했습니다.');
            }
        }

        // 통계 업데이트
        function updateStats() {
            const stats = {
                total: allQuotes.length,
                pending: allQuotes.filter(q => q.status === 'pending').length,
                accepted: allQuotes.filter(q => q.status === 'accepted').length,
                rejected: allQuotes.filter(q => q.status === 'rejected').length
            };

            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-accepted').textContent = stats.accepted;
            document.getElementById('stat-rejected').textContent = stats.rejected;
        }

        // 필터 & 정렬
        function filterQuotes() {
            const statusFilter = document.getElementById('status-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;

            // 상태 필터링
            filteredQuotes = statusFilter === 'all' 
                ? [...allQuotes]
                : allQuotes.filter(q => q.status === statusFilter);

            // 정렬
            switch(sortFilter) {
                case 'newest':
                    filteredQuotes.sort((a, b) => b.created_at - a.created_at);
                    break;
                case 'oldest':
                    filteredQuotes.sort((a, b) => a.created_at - b.created_at);
                    break;
                case 'price-high':
                    filteredQuotes.sort((a, b) => b.price - a.price);
                    break;
                case 'price-low':
                    filteredQuotes.sort((a, b) => a.price - b.price);
                    break;
            }

            displayQuotes();
        }

        // 견적서 표시
        function displayQuotes() {
            const list = document.getElementById('quotes-list');
            const empty = document.getElementById('empty-state');

            if (filteredQuotes.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            list.innerHTML = filteredQuotes.map(quote => `
                <div class="quote-card card">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <h3 class="font-bold text-lg">${quote.treatment_type}</h3>
                                <span class="status-badge status-${quote.status}">${getStatusText(quote.status)}</span>
                            </div>
                            <p class="text-sm text-gray-500">
                                고객: ${quote.customer_name} | 
                                작성일: ${new Date(quote.created_at).toLocaleDateString()}
                            </p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="openEditModal('${quote.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg" title="수정">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="openStatusModal('${quote.id}')" class="p-2 text-green-600 hover:bg-green-50 rounded-lg" title="상태 변경">
                                <i class="fas fa-exchange-alt"></i>
                            </button>
                            <button onclick="deleteQuote('${quote.id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-lg" title="삭제">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <p class="text-gray-700 mb-4">${quote.description}</p>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-gray-50 rounded-lg p-4 mb-4">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">가격</p>
                            <p class="font-bold text-blue-600">${quote.price.toLocaleString()}원</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1">소요 시간</p>
                            <p class="font-medium">${quote.duration}</p>
                        </div>
                        <div class="col-span-2">
                            <p class="text-xs text-gray-500 mb-1">가능한 일정</p>
                            <p class="font-medium">${quote.available_dates}</p>
                        </div>
                    </div>

                    ${quote.additional_notes ? `
                        <div class="bg-blue-50 border-l-4 border-blue-600 p-3 rounded">
                            <p class="text-sm text-gray-700">
                                <i class="fas fa-info-circle text-blue-600 mr-2"></i>
                                ${quote.additional_notes}
                            </p>
                        </div>
                    ` : ''}

                    <div class="mt-4 pt-4 border-t flex justify-between items-center text-sm text-gray-500">
                        <span>견적서 ID: ${quote.id}</span>
                        <span>유효기간: ${new Date(quote.valid_until).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        // 수정 모달 열기
        function openEditModal(quoteId) {
            const quote = allQuotes.find(q => q.id === quoteId);
            if (!quote) return;

            document.getElementById('edit-quote-id').value = quote.id;
            document.getElementById('edit-treatment-type').value = quote.treatment_type;
            document.getElementById('edit-description').value = quote.description;
            document.getElementById('edit-price').value = quote.price;
            document.getElementById('edit-duration').value = quote.duration;
            document.getElementById('edit-dates').value = quote.available_dates;
            document.getElementById('edit-notes').value = quote.additional_notes || '';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        // 수정 모달 닫기
        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-form').reset();
        }

        // 수정 저장
        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const quoteId = document.getElementById('edit-quote-id').value;
            const updatedData = {
                description: document.getElementById('edit-description').value,
                price: parseInt(document.getElementById('edit-price').value),
                duration: document.getElementById('edit-duration').value,
                available_dates: document.getElementById('edit-dates').value,
                additional_notes: document.getElementById('edit-notes').value
            };

            try {
                const response = await fetch(`${API_BASE}/tables/quotes/${quoteId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '견적서 수정 실패');
                }

                const updatedQuote = await response.json();
                console.log('견적서 수정 성공:', updatedQuote);
                
                alert('견적서가 성공적으로 수정되었습니다!');
                closeEditModal();
                await loadQuotes();

            } catch (error) {
                console.error('견적서 수정 실패:', error);
                alert('견적서 수정에 실패했습니다: ' + error.message);
            }
        });

        // 상태 변경 모달 열기
        function openStatusModal(quoteId) {
            const quote = allQuotes.find(q => q.id === quoteId);
            if (!quote) return;

            document.getElementById('status-quote-id').value = quote.id;
            
            const currentBadge = document.getElementById('status-current');
            currentBadge.textContent = getStatusText(quote.status);
            currentBadge.className = `status-badge status-${quote.status}`;

            document.getElementById('status-new').value = quote.status;

            document.getElementById('status-modal').classList.remove('hidden');
        }

        // 상태 변경 모달 닫기
        function closeStatusModal() {
            document.getElementById('status-modal').classList.add('hidden');
        }

        // 상태 업데이트
        async function updateStatus() {
            const quoteId = document.getElementById('status-quote-id').value;
            const newStatus = document.getElementById('status-new').value;

            try {
                const response = await fetch(`${API_BASE}/tables/quotes/${quoteId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '상태 변경 실패');
                }

                const updatedQuote = await response.json();
                console.log('상태 변경 성공:', updatedQuote);
                
                alert(`상태가 "${getStatusText(newStatus)}"(으)로 변경되었습니다!`);
                closeStatusModal();
                await loadQuotes();

            } catch (error) {
                console.error('상태 변경 실패:', error);
                alert('상태 변경에 실패했습니다: ' + error.message);
            }
        }

        // 견적서 삭제
        async function deleteQuote(quoteId) {
            if (!confirm('정말 이 견적서를 삭제하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_BASE}/tables/quotes/${quoteId}`, {
                    method: 'DELETE'
                });

                if (!response.ok && response.status !== 204) {
                    const error = await response.json();
                    throw new Error(error.message || '견적서 삭제 실패');
                }

                console.log('견적서 삭제 성공:', quoteId);
                alert('견적서가 삭제되었습니다!');
                await loadQuotes();

            } catch (error) {
                console.error('견적서 삭제 실패:', error);
                alert('견적서 삭제에 실패했습니다: ' + error.message);
            }
        }

        // 새로고침
        async function refreshQuotes() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('quotes-container').classList.add('hidden');
            await loadQuotes();
        }

        // 상태 텍스트
        function getStatusText(status) {
            const map = {
                'pending': '대기중',
                'accepted': '수락됨',
                'rejected': '거절됨',
                'completed': '완료'
            };
            return map[status] || status;
        }

        // 초기화
        async function init() {
            currentShop = checkSession();
            if (!currentShop) return;

            document.getElementById('shop-name').textContent = currentShop.shop_name || currentShop.name;
            await loadQuotes();
        }

        init();
    </script>

</body>
</html>
