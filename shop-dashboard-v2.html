<!DOCTYPE html>
<html lang="ko">
undefined    <title>업체 대시보드 - BeautyCat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">🐱 BeautyCat</h1>
                    <p class="text-sm text-gray-500">피부관리실 견적 플랫폼</p>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="shop-name" class="font-medium"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">전체 상담 요청</p>
                        <p id="stat-total" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-comments text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">대기중</p>
                        <p id="stat-pending" class="text-3xl font-bold text-yellow-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">진행중</p>
                        <p id="stat-progress" class="text-3xl font-bold text-blue-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-spinner text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">완료</p>
                        <p id="stat-completed" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 탭 메뉴 -->
        <div class="card mb-8">
            <div class="flex justify-between items-center border-b pb-4">
                <div class="flex space-x-4">
                    <button onclick="showTab('consultations')" id="tab-consultations" class="px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600">
                        상담 요청
                    </button>
                    <button onclick="showTab('quotes')" id="tab-quotes" class="px-4 py-2 font-medium text-gray-500 hover:text-gray-700">
                        견적서
                    </button>
                </div>
                <a href="quote-management.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
                    <i class="fas fa-cog mr-2"></i>견적서 관리
                </a>
            </div>
        </div>

        <!-- 상담 요청 목록 -->
        <div id="consultations-section">
            <div class="card">
                <h2 class="text-xl font-bold mb-4">상담 요청 목록</h2>
                <div id="consultations-list" class="space-y-4">
                    <p class="text-center text-gray-500 py-8">로딩중...</p>
                </div>
            </div>
        </div>

        <!-- 견적서 목록 -->
        <div id="quotes-section" class="hidden">
            <div class="card">
                <h2 class="text-xl font-bold mb-4">견적서 목록</h2>
                <div id="quotes-list" class="space-y-4">
                    <p class="text-center text-gray-500 py-8">로딩중...</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let currentShop = null;

        // 세션 확인
        function checkSession() {
            const user = JSON.parse(localStorage.getItem('currentUser') || '{}');

            if (!user.id || user.user_type !== 'shop') {
                alert('로그인이 필요합니다.');
                window.location.href = 'login-clean.html';
                return null;
            }
            return user;
        }

        // 로그아웃
        function logout() {
localStorage.removeItem('currentUser');
localStorage.removeItem('user_type');
localStorage.removeItem('session_token');
            window.location.href = 'login-clean.html';
        }

        // 탭 전환
        function showTab(tab) {
            // 탭 버튼 스타일 변경
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');
            document.getElementById(`tab-${tab}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');

            // 섹션 표시/숨김
            document.getElementById('consultations-section').classList.toggle('hidden', tab !== 'consultations');
            document.getElementById('quotes-section').classList.toggle('hidden', tab !== 'quotes');
        }

        // 상담 요청 로드
        async function loadConsultations() {
            try {
                const response = await fetch(`${API_BASE}/tables/consultations?shop_id=${currentShop.id}`);
                const data = await response.json();
                
                const list = document.getElementById('consultations-list');
                
                if (!data.data || data.data.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-8">상담 요청이 없습니다.</p>';
                    return;
                }

                list.innerHTML = data.data.map(item => `
                    <div class="border rounded-lg p-4 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-lg">${item.treatment_type}</h3>
                                <p class="text-sm text-gray-500">${item.customer_name} • ${item.customer_phone}</p>
                            </div>
                            <span class="status-badge status-${item.status}">${getStatusText(item.status)}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-sm mb-3">
                            <p><i class="fas fa-user-tag text-gray-400 mr-2"></i>${item.skin_type}</p>
                            <p><i class="fas fa-calendar text-gray-400 mr-2"></i>${item.preferred_date}</p>
                            <p><i class="fas fa-clock text-gray-400 mr-2"></i>${item.preferred_time}</p>
                            <p><i class="fas fa-won-sign text-gray-400 mr-2"></i>${item.budget}</p>
                        </div>
                        <p class="text-sm text-gray-600 mb-2"><strong>고민:</strong> ${item.concern}</p>
                        <p class="text-sm text-gray-600"><strong>상세:</strong> ${item.description}</p>
                        <div class="mt-4 flex space-x-2">
                            <button onclick="viewDetail('${item.id}')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                                <i class="fas fa-eye mr-2"></i>상세보기
                            </button>
                            <button onclick="createQuote('${item.id}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                                <i class="fas fa-file-invoice mr-2"></i>견적서 작성
                            </button>
                        </div>
                    </div>
                `).join('');

                // 통계 업데이트
                updateStats(data.data);

            } catch (error) {
                console.error('Error loading consultations:', error);
                document.getElementById('consultations-list').innerHTML = 
                    '<p class="text-center text-red-500 py-8">데이터를 불러오는데 실패했습니다.</p>';
            }
        }

        // 견적서 로드
        async function loadQuotes() {
            try {
                const response = await fetch(`${API_BASE}/tables/quotes?shop_id=${currentShop.id}`);
                const data = await response.json();
                
                const list = document.getElementById('quotes-list');
                
                if (!data.data || data.data.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-8">작성한 견적서가 없습니다.</p>';
                    return;
                }

                list.innerHTML = data.data.map(item => `
                    <div class="border rounded-lg p-4 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-lg">${item.treatment_type}</h3>
                                <p class="text-sm text-gray-500">${item.customer_name}</p>
                            </div>
                            <span class="status-badge status-${item.status}">${getQuoteStatusText(item.status)}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-3">${item.description}</p>
                        <div class="grid grid-cols-2 gap-2 text-sm mb-3 bg-gray-50 p-3 rounded">
                            <p><i class="fas fa-won-sign text-gray-400 mr-2"></i><strong>${item.price.toLocaleString()}원</strong></p>
                            <p><i class="fas fa-clock text-gray-400 mr-2"></i>${item.duration}</p>
                            <p class="col-span-2"><i class="fas fa-calendar-alt text-gray-400 mr-2"></i>${item.available_dates}</p>
                        </div>
                        ${item.additional_notes ? `<p class="text-xs text-gray-500 mb-2"><i class="fas fa-info-circle mr-1"></i>${item.additional_notes}</p>` : ''}
                        <p class="text-xs text-gray-400">
                            작성일: ${new Date(item.created_at).toLocaleDateString()}
                        </p>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading quotes:', error);
                document.getElementById('quotes-list').innerHTML = 
                    '<p class="text-center text-red-500 py-8">데이터를 불러오는데 실패했습니다.</p>';
            }
        }

        // 통계 업데이트
        function updateStats(consultations) {
            const stats = {
                total: consultations.length,
                pending: consultations.filter(c => c.status === 'pending').length,
                in_progress: consultations.filter(c => c.status === 'in_progress').length,
                completed: consultations.filter(c => c.status === 'completed').length
            };

            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-progress').textContent = stats.in_progress;
            document.getElementById('stat-completed').textContent = stats.completed;
        }

        // 상태 텍스트 변환
        function getStatusText(status) {
            const statusMap = {
                'pending': '대기중',
                'in_progress': '진행중',
                'completed': '완료'
            };
            return statusMap[status] || status;
        }

        function getQuoteStatusText(status) {
            const statusMap = {
                'pending': '대기중',
                'accepted': '수락됨',
                'rejected': '거절됨',
                'completed': '완료'
            };
            return statusMap[status] || status;
        }

        // 상세보기
        function viewDetail(consultationId) {
            window.location.href = `consultation-detail.html?id=${consultationId}`;
        }

        // 견적서 작성
        function createQuote(consultationId) {
            window.location.href = `consultation-detail.html?id=${consultationId}`;
        }

        // 초기화
        async function init() {
            currentShop = checkSession();
            if (!currentShop) return;

            document.getElementById('shop-name').textContent = currentShop.shop_name || currentShop.name;

            await loadConsultations();
            await loadQuotes();
        }

        // 페이지 로드 시 실행
        init();
    </script>

</body>
</html>
