        .loading {

            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        
        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #ff2d92;
            color: white;
            border-color: #ff2d92;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: #ff2d92;
            color: white;
            border-color: #ff2d92;
        }
        
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }
        
        .breadcrumb {
            margin-bottom: 1rem;
            color: #666;
        }
        
        .breadcrumb a {
            color: #ff2d92;
            text-decoration: none;

                    '무안군', '보성군', '순천시', '신안군', '여수시', '영광군', '영암군', '완도군',

            '경북': ['경산시', '경주시', '고령군', '구미시', '군위군', '김천시', '문경시', '봉화군', 
                    '상주시', '성주군', '안동시', '영덕군', '영양군', '영주시', '영천시', '예천군', 
                    '울릉군', '울진군', '의성군', '청도군', '청송군', '칠곡군', '포항시'],
            '경남': ['거제시', '거창군', '고성군', '김해시', '남해군', '밀양시', '사천시', '산청군', 
                    '양산시', '의령군', '진주시', '창녕군', '창원시', '통영시', '하동군', '함안군', '함양군', '합천군'],

        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                region: params.get('region') || '',
                district: params.get('district') || '',
                page: parseInt(params.get('page')) || 1
            };
        }
        
        async function loadRegionFilters() {
            try {
                const regions = ['경기', '서울', '대구', '충북', '전북', '경북', '광주', '부산', '인천', '경남', '충남', '대전', '강원', '전남', '제주', '울산', '세종'];
                
                const regionSelect = document.getElementById('region-filter');
                
                regions.forEach(region => {
                    const option = document.createElement('option');
                    option.value = region;
                    option.textContent = region;
                    regionSelect.appendChild(option);
                });
                
                const params = getURLParams();
                if (params.region) {
                    regionSelect.value = params.region;
                    currentRegion = params.region;
                    await loadDistrictFilters(params.region);
                    if (params.district) {
                        document.getElementById('district-filter').value = params.district;
                        currentDistrict = params.district;
                    }
                }
                
                currentPage = params.page;
                loadShops();
            } catch (error) {
                console.error('필터 로드 오류:', error);
            }
        }
        
        async function loadDistrictFilters(region) {
            try {
                console.log('🔍 구/군 필터 로드 시작:', region);
                
                let districts = [];
                
                if (DISTRICT_MAP[region]) {
                    districts = DISTRICT_MAP[region];
                    console.log('✅ 하드코딩된 구/군 목록 사용:', districts.length, districts);
                } else {
                    console.log('⚠️ 하드코딩 없음, 데이터에서 추출 시도');
                    
                    const [shopsResponse, publicResponse] = await Promise.all([
                        fetch(`/tables/skincare_shops?limit=50000`),
                        fetch(`/tables/public_skincare_data?limit=50000`)
                    ]);
                    
                    const shopsData = await shopsResponse.json();
                    const publicData = await publicResponse.json();
                    
                    const allShops = [...shopsData.data, ...publicData.data];
                    
                    districts = [...new Set(allShops
                        .filter(shop => {
                            const shopRegion = shop.region || shop.state?.replace(/특별시|광역시|특별자치시|도/g, '').trim();
                            return shopRegion === region;
                        })
                        .map(shop => {
                            if (shop.district) return shop.district;
                            
                            const address = shop.address || '';
                            const match = address.match(/[가-힣]+(?:특별시|광역시|도)\s+([가-힣]+(?:구|시|군))/);
                            if (match && match[1]) return match[1];
                            
                            return null;
                        })
                        .filter(district => {
                            if (!district) return false;
                            const excludeList = [region, `${region}특별시`, `${region}광역시`, '서울특별시', 
                                                 '부산광역시', '대구광역시', '인천광역시', '광주광역시', 
                                                 '대전광역시', '울산광역시', '세종특별자치시'];
                            return !excludeList.includes(district);
                        })
                    )].sort();
                    
                    console.log('✅ 데이터에서 추출한 구/군 목록:', districts.length, districts);
                }
                
                console.log('✅ 추출된 구/군 목록:', districts.length, districts);
                
                const districtSelect = document.getElementById('district-filter');
                districtSelect.innerHTML = '<option value="">전체</option>';
                
                if (districts.length === 0) {
                    console.warn('⚠️ 구/군 데이터가 없습니다!');
                }
                
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            } catch (error) {
                console.error('시/군/구 필터 로드 오류:', error);
            }
        }
        
        // v2.8.13.6.163.2: 데이터 캐싱 (503 에러 방지)
        let cachedAllShops = null;
        let loadShopsDebounceTimer = null;
        
        async function loadShops() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('shop-grid').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
            
            try {
                console.log('🔍 샵 로딩 시작:', { currentRegion, currentDistrict, currentPage });
                
                let shops;
                
                // 캐시된 데이터가 있으면 재사용
                if (cachedAllShops) {
                    console.log('💾 캐시된 데이터 사용 (' + cachedAllShops.length + '개)');
                    shops = cachedAllShops;
                } else {
                    // 처음에만 API 호출
                    console.log('📡 API에서 데이터 로드 중...');
                    const [shopsResponse, publicResponse] = await Promise.all([
                        fetch(`/tables/skincare_shops?limit=50000`),
                        fetch(`/tables/public_skincare_data?limit=50000`)
                    ]);
                    
                    const shopsData = await shopsResponse.json();
                    const publicData = await publicResponse.json();
                    
                    console.log('📊 일반 샵 수:', shopsData.data.length);
                    console.log('📊 공공 데이터 수:', publicData.data.length);
                    
                    shops = [...shopsData.data, ...publicData.data];
                    console.log('📊 병합 후 전체 샵 수:', shops.length);
                    
                    // 중복 제거
                    const uniqueShops = [];
                    const seenKeys = new Set();
                    
                    for (const shop of shops) {
                        const key = `${shop.business_name || shop.shop_name}-${shop.address}`.toLowerCase();
                        if (!seenKeys.has(key)) {
                            seenKeys.add(key);
                            uniqueShops.push(shop);
                        }
                    }
                    
                    shops = uniqueShops;
                    console.log('📊 중복 제거 후 샵 수:', shops.length);
                    
                    // 캐시에 저장
                    cachedAllShops = shops;
                    console.log('✅ 데이터 캐시 완료');
                }
                
                // 이미 캐시된 데이터를 사용하므로 복사본 생성
                let filteredShops = [...cachedAllShops];
                
                if (currentRegion) {
                    filteredShops = filteredShops.filter(shop => {
                        const shopRegion = shop.region || shop.state?.replace(/특별시|광역시|특별자치시|도/g, '').trim();
                        return shopRegion === currentRegion;
                    });
                    console.log('📍 지역 필터링 후:', filteredShops.length, '(region:', currentRegion, ')');
                }
                
                if (currentDistrict) {
                    filteredShops = filteredShops.filter(shop => {
                        if (shop.district) {
                            return shop.district === currentDistrict;
                        }
                        
                        const address = shop.address || '';
                        
                        // v2.8.13.6.129.10: 3가지 패턴 지원
                        let match = address.match(/[가-힣]+(?:특별시|광역시|도)\s+([가-힣]+(?:구|시|군))/);
                        
                        if (!match) {
                            match = address.match(/[가-힣]+(?:특별시|광역시|도)([가-힣]+(?:구|시|군))/);
                        }
                        
                        if (!match) {
                            match = address.match(/^([가-힣]+(?:구|시|군))/);
                        }
                        
                        const extractedDistrict = match && match[1] ? match[1] : null;
                        return extractedDistrict === currentDistrict;
                    });
                    console.log('🏘️ 구/군 필터링 후:', filteredShops.length, '(district:', currentDistrict, ')');
                }
                
                console.log('✅ 필터링 후 샵 수:', filteredShops.length);
                
                const totalShops = filteredShops.length;
                const startIndex = (currentPage - 1) * pageSize;
                const endIndex = startIndex + pageSize;
                const paginatedShops = filteredShops.slice(startIndex, endIndex);
                
                console.log('📄 페이지:', currentPage, '표시:', paginatedShops.length, '/', totalShops);
                
                displayShops(paginatedShops);
                displayPagination(totalShops);
                updatePageTitle();
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('샵 로드 오류:', error);
                document.getElementById('loading').textContent = '데이터 로드 실패';
            }
        }
        
        function displayShops(shops) {
            const grid = document.getElementById('shop-grid');
            grid.style.display = 'grid';
            
            if (shops.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem;">해당 지역에 등록된 샵이 없습니다.</p>';
                return;
            }
            
            grid.innerHTML = shops.map(shop => `
                <div class="shop-card" onclick="window.location.href='/shop-detail.html?id=${shop.id}'">
                    <div class="shop-name">${escapeHtml(shop.business_name || shop.shop_name || shop.name || '이름 없음')}</div>
                    <div class="shop-address">${escapeHtml(shop.address || '주소 정보 없음')}</div>
                    <div class="shop-status">${shop.status || '영업중'}</div>
                </div>
            `).join('');
        }
        
        function displayPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            
            let buttons = [];
            buttons.push(`<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>이전</button>`);
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            if (startPage > 1) {
                buttons.push(`<button onclick="goToPage(1)">1</button>`);
                if (startPage > 2) buttons.push('<button disabled>...</button>');
            }
            
            for (let i = startPage; i <= endPage; i++) {
                buttons.push(`<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`);
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) buttons.push('<button disabled>...</button>');
                buttons.push(`<button onclick="goToPage(${totalPages})">${totalPages}</button>`);
            }
            
            buttons.push(`<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>`);
            
            pagination.innerHTML = buttons.join('');
        }
        
        function goToPage(page) {
            currentPage = page;
            updateURL();
            loadShops();
            window.scrollTo(0, 0);
        }
        
        function onRegionChange() {
            const regionSelect = document.getElementById('region-filter');
            currentRegion = regionSelect.value;
            currentDistrict = '';
            currentPage = 1;
            
            if (currentRegion) {
                loadDistrictFilters(currentRegion);
            } else {
                document.getElementById('district-filter').innerHTML = '<option value="">시/군/구 선택</option>';
            }
            
            updateURL();
            loadShops();
        }
        
        function onDistrictChange() {
            const districtSelect = document.getElementById('district-filter');
            currentDistrict = districtSelect.value;
            currentPage = 1;
            
            updateURL();
            loadShops();
        }
        
        function updateURL() {
            const params = new URLSearchParams();
            if (currentRegion) params.set('region', currentRegion);
            if (currentDistrict) params.set('district', currentDistrict);
            if (currentPage > 1) params.set('page', currentPage);
            
            const newURL = params.toString() ? `?${params.toString()}` : '/region.html';
            history.pushState({}, '', newURL);
        }
        
        function updatePageTitle() {
            let title = '지역별 피부관리실';
            let heading = '지역별 피부관리실';
            
            if (currentRegion) {
                title = `${currentRegion} 피부관리실`;
                heading = `${currentRegion}`;
                
                if (currentDistrict) {
                    title = `${currentRegion} ${currentDistrict} 피부관리실`;
                    heading = `${currentRegion} ${currentDistrict}`;
                }
                
                title += ' - BeautyCat';
            } else {
                title = '지역별 피부관리실 - BeautyCat';
            }
            
            document.getElementById('page-title').textContent = title;
            document.getElementById('page-heading').textContent = heading;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('DOMContentLoaded', loadRegionFilters);
    </script>
</body>
</html>
