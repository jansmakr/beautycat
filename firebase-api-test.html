<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 beautycat Firebase API 테스트</title>
    <style>
        body { 
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #ff2d92 0%, #ff6b9d 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px;
        }
        .logo { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            background: linear-gradient(45deg, #ff2d92, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #ff2d92;
        }
        .test-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .result { 
            margin: 10px 0; 
            padding: 15px; 
            background: white; 
            border-radius: 10px; 
            border: 1px solid #e9ecef;
            font-family: 'Courier New', monospace;
        }
        .success { 
            color: #28a745; 
            font-weight: bold;
            border-left: 4px solid #28a745;
            background: #f8fff9;
        }
        .error { 
            color: #dc3545; 
            font-weight: bold;
            border-left: 4px solid #dc3545;
            background: #fff8f8;
        }
        .info {
            color: #17a2b8;
            font-weight: bold;
            border-left: 4px solid #17a2b8;
            background: #f8feff;
        }
        .btn {
            background: linear-gradient(45deg, #ff2d92, #ff6b9d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .data-display {
            background: #f1f3f4;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .progress {
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff2d92;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🐱 beautycat Firebase API</div>
            <div class="subtitle">완전한 백엔드 기능 테스트</div>
        </div>

        <div class="test-section">
            <div class="test-title">🔥 Firebase API 초기화 테스트</div>
            <button class="btn" onclick="initializeAPI()">API 초기화</button>
            <div id="initResults"></div>
        </div>

        <div class="test-section">
            <div class="test-title">📊 데이터 조회 테스트 (GET)</div>
            <button class="btn" onclick="testGetUsers()">사용자 목록 조회</button>
            <button class="btn" onclick="testGetConsultations()">상담 목록 조회</button>
            <button class="btn" onclick="testGetShops()">업체 목록 조회</button>
            <div id="getResults"></div>
        </div>

        <div class="test-section">
            <div class="test-title">➕ 데이터 생성 테스트 (POST)</div>
            <button class="btn" onclick="testCreateConsultation()">새 상담 신청 생성</button>
            <button class="btn" onclick="testCreateUser()">새 사용자 생성</button>
            <div id="postResults"></div>
        </div>

        <div class="test-section">
            <div class="test-title">✏️ 데이터 수정 테스트 (PUT)</div>
            <button class="btn" onclick="testUpdateConsultation()">상담 상태 변경</button>
            <button class="btn" onclick="testUpdateUser()">사용자 정보 수정</button>
            <div id="putResults"></div>
        </div>

        <div class="test-section">
            <div class="test-title">🗑️ 데이터 삭제 테스트 (DELETE)</div>
            <button class="btn" onclick="testDeleteRecord()">테스트 레코드 삭제</button>
            <div id="deleteResults"></div>
        </div>

        <div class="test-section">
            <div class="test-title">🎯 종합 기능 테스트</div>
            <button class="btn" onclick="runFullTest()">전체 API 테스트 실행</button>
            <div id="fullTestResults"></div>
        </div>

        <div id="globalResults"></div>
    </div>

    <!-- Firebase API 스크립트 로드 -->
    <script src="js/firebase-api.js"></script>

    <script>
        // 전역 결과 표시 함수
        function showResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            container.appendChild(resultDiv);
            
            // 스크롤을 결과로 이동
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function showProgress(containerId, message) {
            const container = document.getElementById(containerId);
            const progressDiv = document.createElement('div');
            progressDiv.className = 'progress';
            progressDiv.innerHTML = `<div class="spinner"></div> ${message}`;
            container.appendChild(progressDiv);
            return progressDiv;
        }

        // API 초기화
        async function initializeAPI() {
            const progress = showProgress('initResults', 'Firebase API 초기화 중...');
            
            try {
                await window.firebaseAPI.initialize();
                progress.remove();
                showResult('initResults', '✅ Firebase API 초기화 성공!<br>모든 기능을 사용할 수 있습니다.', 'success');
            } catch (error) {
                progress.remove();
                showResult('initResults', `❌ Firebase API 초기화 실패<br>${error.message}`, 'error');
            }
        }

        // 사용자 목록 조회 테스트
        async function testGetUsers() {
            const progress = showProgress('getResults', '사용자 데이터 조회 중...');
            
            try {
                const result = await window.beautyAPI.getTables('users', { limit: 5 });
                progress.remove();
                
                showResult('getResults', 
                    `✅ 사용자 목록 조회 성공<br>
                    총 데이터: ${result.total}개<br>
                    현재 페이지: ${result.data.length}개<br>
                    <div class="data-display">${JSON.stringify(result.data, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('getResults', `❌ 사용자 조회 실패<br>${error.message}`, 'error');
            }
        }

        // 상담 목록 조회 테스트
        async function testGetConsultations() {
            const progress = showProgress('getResults', '상담 데이터 조회 중...');
            
            try {
                const result = await window.beautyAPI.getTables('consultations', { limit: 5 });
                progress.remove();
                
                showResult('getResults', 
                    `✅ 상담 목록 조회 성공<br>
                    총 데이터: ${result.total}개<br>
                    현재 페이지: ${result.data.length}개<br>
                    <div class="data-display">${JSON.stringify(result.data, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('getResults', `❌ 상담 조회 실패<br>${error.message}`, 'error');
            }
        }

        // 업체 목록 조회 테스트
        async function testGetShops() {
            const progress = showProgress('getResults', '업체 데이터 조회 중...');
            
            try {
                const result = await window.beautyAPI.getTables('skincare_shops', { limit: 5 });
                progress.remove();
                
                showResult('getResults', 
                    `✅ 업체 목록 조회 성공<br>
                    총 데이터: ${result.total}개<br>
                    현재 페이지: ${result.data.length}개<br>
                    <div class="data-display">${JSON.stringify(result.data, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('getResults', `❌ 업체 조회 실패<br>${error.message}`, 'error');
            }
        }

        // 새 상담 생성 테스트
        async function testCreateConsultation() {
            const progress = showProgress('postResults', '새 상담 신청 생성 중...');
            
            try {
                const newConsultation = {
                    customer_name: 'API 테스트 고객',
                    customer_phone: '010-9999-8888',
                    customer_email: 'apitest@beautycat.com',
                    state: '서울특별시',
                    district: '테스트구',
                    treatment_types: ['API 테스트 관리'],
                    skin_concerns: ['테스트 고민'],
                    age_range: 'API 테스트',
                    budget_range: '테스트 예산',
                    preferred_schedule: '테스트 일정',
                    additional_notes: 'Firebase API 연결 테스트입니다.',
                    status: 'pending'
                };

                const result = await window.beautyAPI.createRecord('consultations', newConsultation);
                progress.remove();
                
                showResult('postResults', 
                    `✅ 새 상담 신청 생성 성공<br>
                    생성된 ID: ${result.id}<br>
                    <div class="data-display">${JSON.stringify(result, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('postResults', `❌ 상담 생성 실패<br>${error.message}`, 'error');
            }
        }

        // 새 사용자 생성 테스트
        async function testCreateUser() {
            const progress = showProgress('postResults', '새 사용자 생성 중...');
            
            try {
                const newUser = {
                    email: 'newuser@beautycat.com',
                    name: 'API 테스트 유저',
                    user_type: 'customer',
                    phone: '010-8888-7777',
                    status: 'active'
                };

                const result = await window.beautyAPI.createRecord('users', newUser);
                progress.remove();
                
                showResult('postResults', 
                    `✅ 새 사용자 생성 성공<br>
                    생성된 ID: ${result.id}<br>
                    <div class="data-display">${JSON.stringify(result, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('postResults', `❌사용자 생성 실패<br>${error.message}`, 'error');
            }
        }

        // 상담 상태 업데이트 테스트
        async function testUpdateConsultation() {
            const progress = showProgress('putResults', '상담 상태 변경 중...');
            
            try {
                // 먼저 기존 상담 조회
                const consultations = await window.beautyAPI.getTables('consultations');
                if (consultations.data.length === 0) {
                    throw new Error('업데이트할 상담 데이터가 없습니다.');
                }

                const consultationId = consultations.data[0].id;
                const updateData = {
                    status: 'in_progress',
                    additional_notes: 'API 테스트로 상태 업데이트됨 - ' + new Date().toLocaleString()
                };

                const result = await window.beautyAPI.updateRecord('consultations', consultationId, updateData);
                progress.remove();
                
                showResult('putResults', 
                    `✅ 상담 상태 변경 성공<br>
                    업데이트된 ID: ${result.id}<br>
                    새 상태: ${result.status}<br>
                    <div class="data-display">${JSON.stringify(result, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('putResults', `❌ 상담 업데이트 실패<br>${error.message}`, 'error');
            }
        }

        // 사용자 정보 업데이트 테스트
        async function testUpdateUser() {
            const progress = showProgress('putResults', '사용자 정보 수정 중...');
            
            try {
                const users = await window.beautyAPI.getTables('users');
                if (users.data.length === 0) {
                    throw new Error('업데이트할 사용자 데이터가 없습니다.');
                }

                const userId = users.data[0].id;
                const updateData = {
                    name: users.data[0].name + ' (업데이트됨)',
                    phone: '010-0000-0000'
                };

                const result = await window.beautyAPI.updateRecord('users', userId, updateData);
                progress.remove();
                
                showResult('putResults', 
                    `✅ 사용자 정보 수정 성공<br>
                    업데이트된 ID: ${result.id}<br>
                    새 이름: ${result.name}<br>
                    <div class="data-display">${JSON.stringify(result, null, 2)}</div>`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('putResults', `❌ 사용자 업데이트 실패<br>${error.message}`, 'error');
            }
        }

        // 레코드 삭제 테스트
        async function testDeleteRecord() {
            const progress = showProgress('deleteResults', '테스트 레코드 삭제 중...');
            
            try {
                // 먼저 테스트용 레코드 생성
                const testRecord = await window.beautyAPI.createRecord('users', {
                    email: 'delete-test@beautycat.com',
                    name: '삭제 테스트 유저',
                    user_type: 'customer',
                    status: 'active'
                });

                // 생성된 레코드 삭제
                const deleteResult = await window.beautyAPI.deleteRecord('users', testRecord.id);
                progress.remove();
                
                showResult('deleteResults', 
                    `✅ 레코드 삭제 성공<br>
                    삭제된 ID: ${testRecord.id}<br>
                    삭제 시간: ${new Date().toLocaleString()}`, 
                'success');
            } catch (error) {
                progress.remove();
                showResult('deleteResults', `❌ 레코드 삭제 실패<br>${error.message}`, 'error');
            }
        }

        // 전체 API 테스트 실행
        async function runFullTest() {
            const progress = showProgress('fullTestResults', '전체 API 기능 테스트 실행 중...');
            
            const testResults = [];
            
            try {
                // 1. 초기화 테스트
                await window.firebaseAPI.initialize();
                testResults.push('✅ API 초기화');

                // 2. 조회 테스트
                const users = await window.beautyAPI.getTables('users');
                testResults.push(`✅ 사용자 조회 (${users.total}개)`);

                const consultations = await window.beautyAPI.getTables('consultations');
                testResults.push(`✅ 상담 조회 (${consultations.total}개)`);

                const shops = await window.beautyAPI.getTables('skincare_shops');
                testResults.push(`✅ 업체 조회 (${shops.total}개)`);

                // 3. 생성 테스트
                const newUser = await window.beautyAPI.createRecord('users', {
                    email: 'fulltest@beautycat.com',
                    name: '전체테스트유저',
                    user_type: 'customer',
                    status: 'active'
                });
                testResults.push(`✅ 사용자 생성 (${newUser.id})`);

                // 4. 수정 테스트
                const updatedUser = await window.beautyAPI.updateRecord('users', newUser.id, {
                    name: '수정된테스트유저'
                });
                testResults.push(`✅ 사용자 수정 (${updatedUser.id})`);

                // 5. 삭제 테스트
                await window.beautyAPI.deleteRecord('users', newUser.id);
                testResults.push(`✅ 사용자 삭제 (${newUser.id})`);

                progress.remove();
                showResult('fullTestResults', 
                    `🎉 전체 API 테스트 완료!<br>
                    <strong>성공한 테스트:</strong><br>
                    ${testResults.join('<br>')}
                    <br><br>
                    🚀 beautycat.kr Firebase API가 완전히 작동합니다!`, 
                'success');

            } catch (error) {
                progress.remove();
                showResult('fullTestResults', 
                    `❌ 전체 테스트 실패<br>
                    성공한 테스트: ${testResults.length}개<br>
                    ${testResults.join('<br>')}<br>
                    <strong>오류:</strong> ${error.message}`, 
                'error');
            }
        }

        // 페이지 로드시 자동 초기화
        window.addEventListener('load', async function() {
            showResult('globalResults', 
                '🔥 beautycat Firebase API 테스트 페이지<br>' +
                '모든 백엔드 기능을 테스트할 수 있습니다.<br>' +
                '<strong>사용 가능한 기능:</strong> 회원가입, 로그인, 데이터 저장, 실시간 채팅', 
            'info');
            
            // 자동으로 API 초기화
            setTimeout(initializeAPI, 1000);
        });
    </script>
</body>
</html>
