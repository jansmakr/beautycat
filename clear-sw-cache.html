<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 Service Worker 캐시 완전 정리</title>
    <style>
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #ff2d92 0%, #ff6b9d 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff2d92, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .btn {
            background: linear-gradient(45deg, #ff2d92, #ff6b9d);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .progress {
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff2d92;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🧹 Service Worker 정리</div>
            <div style="color: #666; font-size: 1.1rem;">포워딩 리다이렉트 오류 완전 해결</div>
        </div>

        <div class="status info">
            <strong>🎯 목적:</strong> 포워딩된 도메인에서 Service Worker 리다이렉트 오류를 완전히 해결합니다.
        </div>

        <div class="status warning">
            <strong>⚠️ 주의:</strong> 모든 캐시된 데이터가 삭제됩니다. 페이지 새로고침이 필요할 수 있습니다.
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <button class="btn" onclick="clearEverything()">🧹 모든 캐시 및 SW 완전 정리</button>
            <button class="btn" onclick="forceReload()">🔄 강제 새로고침</button>
        </div>

        <div id="status-log"></div>

        <div class="status info" style="margin-top: 30px;">
            <strong>📋 정리 후 수행 사항:</strong><br>
            1. 브라우저를 완전히 닫기<br>
            2. 브라우저 재시작<br>
            3. beautycat.kr 다시 접속<br>
            4. 리다이렉트 오류 해결 확인
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('status-log');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(div);
            
            // 스크롤을 맨 아래로
            div.scrollIntoView({ behavior: 'smooth' });
        }

        async function clearEverything() {
            addLog('🚀 Service Worker 및 캐시 완전 정리 시작...', 'info');
            
            try {
                // 1. Service Worker 등록 해제
                if ('serviceWorker' in navigator) {
                    addLog('🔍 기존 Service Worker 검색 중...', 'info');
                    
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    addLog(`📋 발견된 Service Worker: ${registrations.length}개`, 'info');
                    
                    for (let registration of registrations) {
                        addLog(`🗑️ Service Worker 제거: ${registration.scope}`, 'warning');
                        await registration.unregister();
                    }
                    
                    addLog('✅ 모든 Service Worker 제거 완료', 'success');
                }
                
                // 2. 캐시 스토리지 완전 삭제
                if ('caches' in window) {
                    addLog('🔍 캐시 스토리지 검색 중...', 'info');
                    
                    const cacheNames = await caches.keys();
                    addLog(`📋 발견된 캐시: ${cacheNames.length}개`, 'info');
                    
                    for (let cacheName of cacheNames) {
                        addLog(`🗑️ 캐시 삭제: ${cacheName}`, 'warning');
                        await caches.delete(cacheName);
                    }
                    
                    addLog('✅ 모든 캐시 삭제 완료', 'success');
                }
                
                // 3. 로컬 스토리지 정리
                try {
                    const localKeys = Object.keys(localStorage);
                    if (localKeys.length > 0) {
                        addLog(`📋 LocalStorage 항목: ${localKeys.length}개`, 'info');
                        localStorage.clear();
                        addLog('✅ LocalStorage 정리 완료', 'success');
                    }
                } catch (e) {
                    addLog('⚠️ LocalStorage 정리 실패 (무시됨)', 'warning');
                }
                
                // 4. 세션 스토리지 정리
                try {
                    const sessionKeys = Object.keys(sessionStorage);
                    if (sessionKeys.length > 0) {
                        addLog(`📋 SessionStorage 항목: ${sessionKeys.length}개`, 'info');
                        sessionStorage.clear();
                        addLog('✅ SessionStorage 정리 완료', 'success');
                    }
                } catch (e) {
                    addLog('⚠️ SessionStorage 정리 실패 (무시됨)', 'warning');
                }
                
                // 5. 강제 정리 Service Worker 등록
                addLog('🧹 강제 정리 Service Worker 등록 중...', 'info');
                
                try {
                    await navigator.serviceWorker.register('sw-force-clear.js');
                    addLog('✅ 강제 정리 SW 등록 완료', 'success');
                    
                    // 5초 후 자동 새로고침
                    addLog('⏰ 5초 후 자동 새로고침...', 'warning');
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 5000);
                    
                } catch (swError) {
                    addLog('⚠️ 강제 정리 SW 등록 실패: ' + swError.message, 'warning');
                }
                
                addLog('🎉 Service Worker 및 캐시 정리 완료!', 'success');
                addLog('🔄 브라우저를 완전히 닫고 재시작하세요.', 'info');
                
            } catch (error) {
                addLog('❌ 정리 중 오류: ' + error.message, 'error');
                console.error('정리 오류:', error);
            }
        }

        function forceReload() {
            addLog('🔄 강제 새로고침 실행...', 'warning');
            
            // 캐시 무시하고 강제 새로고침
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => registration.unregister());
                }).finally(() => {
                    window.location.reload(true);
                });
            } else {
                window.location.reload(true);
            }
        }

        // 페이지 로드 시 현재 상태 확인
        window.addEventListener('load', async () => {
            addLog('🔍 현재 Service Worker 상태 확인 중...', 'info');
            
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    const cacheNames = await caches.keys();
                    
                    addLog(`📊 현재 상태: SW ${registrations.length}개, 캐시 ${cacheNames.length}개`, 'info');
                    
                    if (registrations.length === 0 && cacheNames.length === 0) {
                        addLog('✅ 깔끔한 상태입니다!', 'success');
                    } else {
                        addLog('⚠️ 정리가 필요한 항목들이 있습니다.', 'warning');
                    }
                    
                } catch (e) {
                    addLog('⚠️ 상태 확인 중 오류: ' + e.message, 'warning');
                }
            }
        });
    </script>
</body>
</html>
