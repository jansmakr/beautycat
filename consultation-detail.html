<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 요청 상세 - BeautyCat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .info-row { display: flex; padding: 16px 0; border-bottom: 1px solid #f3f4f6; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 150px; font-weight: 600; color: #6b7280; }
        .info-value { flex: 1; color: #111827; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-in_progress { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <button onclick="history.back()" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">상담 요청 상세</h1>
                        <p class="text-sm text-gray-500">고객의 상담 요청을 확인하고 견적서를 작성하세요</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="shop-name" class="font-medium"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- 로딩 상태 -->
        <div id="loading" class="text-center py-16">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
            <p class="text-gray-600">로딩중...</p>
        </div>

        <!-- 상담 요청 정보 -->
        <div id="consultation-content" class="hidden space-y-6">
            
            <!-- 기본 정보 -->
            <div class="card">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900" id="treatment-type"></h2>
                        <p class="text-gray-500 mt-1" id="created-at"></p>
                    </div>
                    <span id="status-badge" class="status-badge"></span>
                </div>

                <div id="consultation-details">
                    <!-- 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 고객 정보 -->
            <div class="card">
                <h3 class="text-lg font-bold mb-4 flex items-center">
                    <i class="fas fa-user text-blue-600 mr-2"></i>
                    고객 정보
                </h3>
                <div id="customer-info">
                    <!-- 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 피부 정보 & 고민 -->
            <div class="card">
                <h3 class="text-lg font-bold mb-4 flex items-center">
                    <i class="fas fa-spa text-blue-600 mr-2"></i>
                    피부 정보 & 고민 사항
                </h3>
                <div id="skin-info">
                    <!-- 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 희망 일정 & 예산 -->
            <div class="card">
                <h3 class="text-lg font-bold mb-4 flex items-center">
                    <i class="fas fa-calendar-check text-blue-600 mr-2"></i>
                    희망 일정 & 예산
                </h3>
                <div id="schedule-info">
                    <!-- 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 작성된 견적서 목록 -->
            <div class="card" id="quotes-section">
                <h3 class="text-lg font-bold mb-4 flex items-center">
                    <i class="fas fa-file-invoice text-blue-600 mr-2"></i>
                    작성된 견적서
                </h3>
                <div id="quotes-list">
                    <p class="text-gray-500 text-sm">로딩중...</p>
                </div>
            </div>

            <!-- 액션 버튼 -->
            <div class="card bg-blue-50 border-2 border-blue-200">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg mb-1">견적서를 작성하시겠습니까?</h3>
                        <p class="text-sm text-gray-600">고객에게 정확한 가격과 일정을 제안하세요</p>
                    </div>
                    <button onclick="openQuoteForm()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium flex items-center">
                        <i class="fas fa-pen mr-2"></i>
                        견적서 작성
                    </button>
                </div>
            </div>

        </div>

        <!-- 견적서 작성 폼 (모달) -->
        <div id="quote-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold">견적서 작성</h2>
                    <button onclick="closeQuoteForm()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <div class="p-6">
                    <form id="quote-form" class="space-y-4">
                        
                        <div>
                            <label class="block font-medium mb-2">관리 유형 *</label>
                            <input type="text" id="quote-treatment-type" class="w-full border rounded-lg px-4 py-2" required readonly>
                        </div>

                        <div>
                            <label class="block font-medium mb-2">관리 내용 *</label>
                            <textarea id="quote-description" class="w-full border rounded-lg px-4 py-2 h-24" placeholder="예: 여드름 압출 + 진정 관리 + LED 테라피 (1회)" required></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block font-medium mb-2">가격 (원) *</label>
                                <input type="number" id="quote-price" class="w-full border rounded-lg px-4 py-2" placeholder="120000" required>
                            </div>
                            <div>
                                <label class="block font-medium mb-2">소요 시간 *</label>
                                <input type="text" id="quote-duration" class="w-full border rounded-lg px-4 py-2" placeholder="90분" required>
                            </div>
                        </div>

                        <div>
                            <label class="block font-medium mb-2">가능한 일정 *</label>
                            <input type="text" id="quote-dates" class="w-full border rounded-lg px-4 py-2" placeholder="월-금 오전/오후, 주말 오전" required>
                        </div>

                        <div>
                            <label class="block font-medium mb-2">추가 안내사항</label>
                            <textarea id="quote-notes" class="w-full border rounded-lg px-4 py-2 h-20" placeholder="예: 신규 고객 10% 할인 적용된 가격입니다."></textarea>
                        </div>

                        <div class="flex space-x-3 pt-4">
                            <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-medium">
                                <i class="fas fa-paper-plane mr-2"></i>
                                견적서 발송
                            </button>
                            <button type="button" onclick="closeQuoteForm()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
                                취소
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let currentShop = null;
        let currentConsultation = null;

        // URL에서 상담 ID 가져오기
        function getConsultationId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // 세션 확인
        function checkSession() {
            const user = JSON.parse(localStorage.getItem('beautycat_user') || '{}');
            if (!user.id || user.user_type !== 'shop') {
                alert('로그인이 필요합니다.');
                window.location.href = 'login-clean.html';
                return null;
            }
            return user;
        }

        // 상담 요청 로드
        async function loadConsultation() {
            const consultationId = getConsultationId();
            if (!consultationId) {
                alert('잘못된 접근입니다.');
                history.back();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tables/consultations/${consultationId}`);
                const consultation = await response.json();

                if (consultation.error) {
                    throw new Error('상담 요청을 찾을 수 없습니다.');
                }

                // Shop ID 확인
                if (consultation.shop_id !== currentShop.id) {
                    alert('권한이 없습니다.');
                    history.back();
                    return;
                }

                currentConsultation = consultation;
                displayConsultation(consultation);
                await loadQuotesForConsultation(consultationId);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('consultation-content').classList.remove('hidden');

            } catch (error) {
                console.error('Error loading consultation:', error);
                alert('상담 요청을 불러오는데 실패했습니다.');
                history.back();
            }
        }

        // 상담 요청 표시
        function displayConsultation(data) {
            document.getElementById('treatment-type').textContent = data.treatment_type;
            document.getElementById('created-at').textContent = `요청일: ${new Date(data.created_at).toLocaleString()}`;
            
            const statusBadge = document.getElementById('status-badge');
            statusBadge.textContent = getStatusText(data.status);
            statusBadge.className = `status-badge status-${data.status}`;

            // 상세 정보
            document.getElementById('consultation-details').innerHTML = `
                <div class="info-row">
                    <div class="info-label">상담 ID</div>
                    <div class="info-value">${data.id}</div>
                </div>
            `;

            // 고객 정보
            document.getElementById('customer-info').innerHTML = `
                <div class="info-row">
                    <div class="info-label">고객명</div>
                    <div class="info-value">${data.customer_name}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">연락처</div>
                    <div class="info-value">
                        <a href="tel:${data.customer_phone}" class="text-blue-600 hover:underline">
                            ${data.customer_phone}
                        </a>
                    </div>
                </div>
            `;

            // 피부 정보
            document.getElementById('skin-info').innerHTML = `
                <div class="info-row">
                    <div class="info-label">피부 타입</div>
                    <div class="info-value">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800">
                            ${data.skin_type}
                        </span>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-label">주요 고민</div>
                    <div class="info-value">${data.concern}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">상세 설명</div>
                    <div class="info-value">${data.description}</div>
                </div>
            `;

            // 일정 & 예산
            document.getElementById('schedule-info').innerHTML = `
                <div class="info-row">
                    <div class="info-label">희망 날짜</div>
                    <div class="info-value">
                        <i class="fas fa-calendar-day text-gray-400 mr-2"></i>
                        ${data.preferred_date}
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-label">희망 시간</div>
                    <div class="info-value">
                        <i class="fas fa-clock text-gray-400 mr-2"></i>
                        ${data.preferred_time}
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-label">예산 범위</div>
                    <div class="info-value">
                        <i class="fas fa-won-sign text-gray-400 mr-2"></i>
                        ${data.budget} 원
                    </div>
                </div>
            `;
        }

        // 견적서 목록 로드
        async function loadQuotesForConsultation(consultationId) {
            try {
                const response = await fetch(`${API_BASE}/tables/quotes`);
                const data = await response.json();
                
                const quotes = data.data.filter(q => q.consultation_id === consultationId);
                
                const list = document.getElementById('quotes-list');
                
                if (quotes.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-sm">아직 작성된 견적서가 없습니다.</p>';
                    return;
                }

                list.innerHTML = quotes.map(quote => `
                    <div class="border rounded-lg p-4 mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <p class="font-medium">${quote.description}</p>
                                <p class="text-sm text-gray-500">${new Date(quote.created_at).toLocaleString()}</p>
                            </div>
                            <span class="status-badge status-${quote.status}">${getQuoteStatusText(quote.status)}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-sm mt-3">
                            <p><i class="fas fa-won-sign text-gray-400 mr-1"></i><strong>${quote.price.toLocaleString()}원</strong></p>
                            <p><i class="fas fa-clock text-gray-400 mr-1"></i>${quote.duration}</p>
                            <p><i class="fas fa-calendar text-gray-400 mr-1"></i>${quote.available_dates}</p>
                        </div>
                        ${quote.additional_notes ? `<p class="text-xs text-gray-500 mt-2">${quote.additional_notes}</p>` : ''}
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading quotes:', error);
            }
        }

        // 견적서 작성 폼 열기
        function openQuoteForm() {
            document.getElementById('quote-treatment-type').value = currentConsultation.treatment_type;
            document.getElementById('quote-modal').classList.remove('hidden');
        }

        // 견적서 작성 폼 닫기
        function closeQuoteForm() {
            document.getElementById('quote-modal').classList.add('hidden');
            document.getElementById('quote-form').reset();
        }

        // 견적서 제출
        document.getElementById('quote-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const quoteData = {
                consultation_id: currentConsultation.id,
                customer_id: currentConsultation.customer_id,
                customer_name: currentConsultation.customer_name,
                shop_id: currentShop.id,
                shop_name: currentShop.shop_name || currentShop.name,
                treatment_type: document.getElementById('quote-treatment-type').value,
                description: document.getElementById('quote-description').value,
                price: parseInt(document.getElementById('quote-price').value),
                duration: document.getElementById('quote-duration').value,
                available_dates: document.getElementById('quote-dates').value,
                additional_notes: document.getElementById('quote-notes').value,
                status: 'pending',
                valid_until: Date.now() + (7 * 24 * 60 * 60 * 1000) // 7일 후
            };

            try {
                const response = await fetch(`${API_BASE}/tables/quotes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(quoteData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '견적서 작성 실패');
                }

                const createdQuote = await response.json();
                console.log('견적서 생성 성공:', createdQuote);
                
                alert('견적서가 성공적으로 작성되었습니다!');
                closeQuoteForm();
                await loadQuotesForConsultation(currentConsultation.id);

                // 상담 상태를 "진행중"으로 변경
                if (currentConsultation.status === 'pending') {
                    await updateConsultationStatus('in_progress');
                }

            } catch (error) {
                console.error('견적서 작성 실패:', error);
                alert('견적서 작성에 실패했습니다: ' + error.message);
            }
        });

        // 상담 상태 변경
        async function updateConsultationStatus(newStatus) {
            try {
                const response = await fetch(`${API_BASE}/tables/consultations/${currentConsultation.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    throw new Error('상태 변경 실패');
                }

                const updatedConsultation = await response.json();
                console.log('상담 상태 변경 성공:', updatedConsultation);
                
                // 현재 상담 정보 업데이트
                currentConsultation.status = newStatus;
                
                // UI 업데이트
                const statusBadge = document.getElementById('status-badge');
                statusBadge.textContent = getStatusText(newStatus);
                statusBadge.className = `status-badge status-${newStatus}`;

            } catch (error) {
                console.error('상태 변경 실패:', error);
            }
        }

        // 상태 텍스트
        function getStatusText(status) {
            const map = { 'pending': '대기중', 'in_progress': '진행중', 'completed': '완료' };
            return map[status] || status;
        }

        function getQuoteStatusText(status) {
            const map = { 'pending': '대기중', 'accepted': '수락됨', 'rejected': '거절됨', 'completed': '완료' };
            return map[status] || status;
        }

        // 초기화
        async function init() {
            currentShop = checkSession();
            if (!currentShop) return;

            document.getElementById('shop-name').textContent = currentShop.shop_name || currentShop.name;
            await loadConsultation();
        }

        init();
    </script>

</body>
</html>
