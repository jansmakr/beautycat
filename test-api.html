<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyCat API 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #ff2d92;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.success {
            background: #10b981;
            color: white;
        }

        .status-badge.loading {
            background: #f59e0b;
            color: white;
        }

        .status-badge.error {
            background: #ef4444;
            color: white;
        }

        .test-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .test-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .test-button {
            background: #ff2d92;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .test-button:hover {
            background: #e02680;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 45, 146, 0.3);
        }

        .test-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
        }

        .info-box {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-box strong {
            color: #0c4a6e;
            display: block;
            margin-bottom: 8px;
        }

        .info-box code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #0284c7;
        }

        .success-message {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #065f46;
        }

        .error-message {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #991b1b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #ff2d92;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 BeautyCat API 테스트 도구</h1>
            <p>Checkpoint -222 복원 시점 API 정상 작동 확인</p>
        </div>

        <div class="info-box">
            <strong>✅ 테스트 대상 API</strong>
            <code>https://beautycat-api.jansmakr.workers.dev/api</code>
            <br><br>
            <strong>🗄️ D1 Database</strong>
            <code>beautycat-db</code> (10개 테이블)
            <br><br>
            <strong>🌐 Custom Domain</strong>
            <code>api.beautycat.kr</code>
        </div>

        <!-- Test 1: Health Check -->
        <div class="test-section">
            <h2>
                <span>1️⃣ Health Check</span>
                <button class="test-button" onclick="testHealthCheck()">테스트 실행</button>
            </h2>
            <div id="health-status"></div>
            <div id="health-result"></div>
        </div>

        <!-- Test 2: Tables List -->
        <div class="test-section">
            <h2>
                <span>2️⃣ 테이블 목록 조회</span>
                <button class="test-button" onclick="testTablesList()">테스트 실행</button>
            </h2>
            <div id="tables-status"></div>
            <div id="tables-result"></div>
        </div>

        <!-- Test 3: Users Table -->
        <div class="test-section">
            <h2>
                <span>3️⃣ Users 테이블 데이터</span>
                <button class="test-button" onclick="testUsersTable()">테스트 실행</button>
            </h2>
            <div id="users-status"></div>
            <div id="users-result"></div>
        </div>

        <!-- Test 4: All Tables -->
        <div class="test-section">
            <h2>
                <span>4️⃣ 전체 테이블 스캔</span>
                <button class="test-button" onclick="testAllTables()">테스트 실행</button>
            </h2>
            <div id="alltables-status"></div>
            <div id="alltables-result"></div>
        </div>

        <!-- Summary Statistics -->
        <div class="test-section">
            <h2>📊 테스트 통계</h2>
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="label">총 테스트</div>
                    <div class="value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">성공</div>
                    <div class="value" id="stat-success">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">실패</div>
                    <div class="value" id="stat-fail">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">평균 응답시간</div>
                    <div class="value" id="stat-time">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://beautycat-api.jansmakr.workers.dev/api';
        let stats = {
            total: 0,
            success: 0,
            fail: 0,
            times: []
        };

        function updateStats() {
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-success').textContent = stats.success;
            document.getElementById('stat-fail').textContent = stats.fail;
            
            if (stats.times.length > 0) {
                const avg = stats.times.reduce((a, b) => a + b, 0) / stats.times.length;
                document.getElementById('stat-time').textContent = avg.toFixed(0) + 'ms';
            }
        }

        function showLoading(statusId) {
            document.getElementById(statusId).innerHTML = '<span class="status-badge loading"><span class="loading"></span> 테스트 중...</span>';
        }

        function showSuccess(statusId, message) {
            document.getElementById(statusId).innerHTML = `<span class="status-badge success">✅ ${message}</span>`;
        }

        function showError(statusId, message) {
            document.getElementById(statusId).innerHTML = `<span class="status-badge error">❌ ${message}</span>`;
        }

        async function testHealthCheck() {
            showLoading('health-status');
            const startTime = performance.now();
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                const endTime = performance.now();
                const responseTime = Math.round(endTime - startTime);
                
                stats.total++;
                stats.times.push(responseTime);
                
                if (response.ok) {
                    const data = await response.json();
                    stats.success++;
                    showSuccess('health-status', `성공 (${responseTime}ms)`);
                    
                    document.getElementById('health-result').innerHTML = `
                        <div class="success-message">
                            <strong>✅ API가 정상 작동합니다!</strong>
                            <div class="timestamp">응답 시간: ${responseTime}ms</div>
                        </div>
                        <div class="result-box">
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                stats.total++;
                stats.fail++;
                showError('health-status', '실패');
                
                document.getElementById('health-result').innerHTML = `
                    <div class="error-message">
                        <strong>❌ Health Check 실패</strong>
                        <div>${error.message}</div>
                    </div>
                `;
            }
            
            updateStats();
        }

        async function testTablesList() {
            showLoading('tables-status');
            const startTime = performance.now();
            
            try {
                const response = await fetch(`${API_BASE}/tables`);
                const endTime = performance.now();
                const responseTime = Math.round(endTime - startTime);
                
                stats.total++;
                stats.times.push(responseTime);
                
                if (response.ok) {
                    const data = await response.json();
                    stats.success++;
                    showSuccess('tables-status', `성공 (${responseTime}ms)`);
                    
                    const tableCount = data.tables ? data.tables.length : 0;
                    
                    document.getElementById('tables-result').innerHTML = `
                        <div class="success-message">
                            <strong>✅ 테이블 목록 조회 성공!</strong>
                            <div>총 ${tableCount}개의 테이블 발견</div>
                            <div class="timestamp">응답 시간: ${responseTime}ms</div>
                        </div>
                        <div class="result-box">
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                stats.total++;
                stats.fail++;
                showError('tables-status', '실패');
                
                document.getElementById('tables-result').innerHTML = `
                    <div class="error-message">
                        <strong>❌ 테이블 목록 조회 실패</strong>
                        <div>${error.message}</div>
                    </div>
                `;
            }
            
            updateStats();
        }

        async function testUsersTable() {
            showLoading('users-status');
            const startTime = performance.now();
            
            try {
                const response = await fetch(`${API_BASE}/tables/users`);
                const endTime = performance.now();
                const responseTime = Math.round(endTime - startTime);
                
                stats.total++;
                stats.times.push(responseTime);
                
                if (response.ok) {
                    const data = await response.json();
                    stats.success++;
                    showSuccess('users-status', `성공 (${responseTime}ms)`);
                    
                    const userCount = data.data ? data.data.length : 0;
                    const totalUsers = data.total || 0;
                    
                    document.getElementById('users-result').innerHTML = `
                        <div class="success-message">
                            <strong>✅ Users 테이블 조회 성공!</strong>
                            <div>현재 페이지: ${userCount}명 / 전체: ${totalUsers}명</div>
                            <div class="timestamp">응답 시간: ${responseTime}ms</div>
                        </div>
                        <div class="result-box">
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                stats.total++;
                stats.fail++;
                showError('users-status', '실패');
                
                document.getElementById('users-result').innerHTML = `
                    <div class="error-message">
                        <strong>❌ Users 테이블 조회 실패</strong>
                        <div>${error.message}</div>
                    </div>
                `;
            }
            
            updateStats();
        }

        async function testAllTables() {
            showLoading('alltables-status');
            document.getElementById('alltables-result').innerHTML = '<div class="info-box">모든 테이블을 스캔하고 있습니다...</div>';
            
            const tables = [
                'users',
                'skincare_shops',
                'consultations',
                'quotes',
                'messages',
                'representative_shops',
                'announcements',
                'reviews',
                'call_statistics',
                'user_sessions'
            ];
            
            let results = [];
            let successCount = 0;
            let failCount = 0;
            
            for (const table of tables) {
                try {
                    const startTime = performance.now();
                    const response = await fetch(`${API_BASE}/tables/${table}`);
                    const endTime = performance.now();
                    const responseTime = Math.round(endTime - startTime);
                    
                    stats.total++;
                    stats.times.push(responseTime);
                    
                    if (response.ok) {
                        const data = await response.json();
                        stats.success++;
                        successCount++;
                        
                        results.push({
                            table: table,
                            status: 'success',
                            count: data.total || 0,
                            time: responseTime
                        });
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                } catch (error) {
                    stats.total++;
                    stats.fail++;
                    failCount++;
                    
                    results.push({
                        table: table,
                        status: 'error',
                        error: error.message
                    });
                }
            }
            
            if (failCount === 0) {
                showSuccess('alltables-status', `전체 성공 (${successCount}/${tables.length})`);
            } else {
                showError('alltables-status', `일부 실패 (${successCount}/${tables.length})`);
            }
            
            let html = '<div class="success-message"><strong>📊 전체 테이블 스캔 결과</strong></div>';
            html += '<div class="result-box"><table style="width:100%; border-collapse: collapse;">';
            html += '<tr style="background: #f1f5f9; font-weight: 600;"><td style="padding: 10px;">테이블</td><td>상태</td><td>레코드 수</td><td>응답시간</td></tr>';
            
            results.forEach(result => {
                const statusIcon = result.status === 'success' ? '✅' : '❌';
                const count = result.status === 'success' ? result.count : '-';
                const time = result.status === 'success' ? result.time + 'ms' : '-';
                
                html += `<tr style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 10px;">${result.table}</td>
                    <td>${statusIcon}</td>
                    <td>${count}</td>
                    <td>${time}</td>
                </tr>`;
            });
            
            html += '</table></div>';
            document.getElementById('alltables-result').innerHTML = html;
            
            updateStats();
        }

        // 페이지 로드 시 자동으로 Health Check 실행
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('자동 Health Check 실행...');
                testHealthCheck();
            }, 500);
        });
    </script>
</body>
</html>
